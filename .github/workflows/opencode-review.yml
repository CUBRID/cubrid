name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.OPENCODE_API_KEY }}" ]; then
            echo "❌ OPENCODE_API_KEY secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)

      - name: Configure Git for Agent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          share: true
          prompt: |
            /ultrawork

            ## Role
            C/C++ DBMS Code Reviewer for CUBRID RDBMS

            ## Project Context
            - Apache 2.0 C/C++17 RDBMS; `.c` files compile as C++17
            - 3 build modes: SERVER_MODE / SA_MODE / CS_MODE (check changed files)
            - No exceptions — C error model throughout (`er_set()` + return codes)
            - THREAD_ENTRY *thread_p first parameter on all server-side functions

            ## CUBRID Critical Conventions

            ### Memory (CRITICAL — base/)
            - `free_and_init(ptr)` — NEVER bare `free()`; nullifies pointer after free
            - `db_private_alloc(thread_p, size)` / `db_private_free(thread_p, ptr)` — per-thread heaps
            - `memory_wrapper.hpp`: SERVER_MODE only, **MUST be last #include in .c/.cpp files**
            - `memory_cwrapper.h`: safe in headers, SERVER_MODE only

            ### Error Handling (base/)
            - `er_set(ER_ERROR_SEVERITY, ARG_FILE_LINE, ER_CODE, ...)` — ARG_FILE_LINE macro is 2nd arg
            - Check `error != NO_ERROR` after operations that should set errors
            - Severity: FATAL > ERROR > SYNTAX > WARNING > NOTIFICATION
            - Use `ASSERT_ERROR()` or `ASSERT_ERROR_AND_SET(error_code)` for validation

            ### Lock-Free Structures (base/)
            - Modern: `lockfree::hashmap` → use `lockfree::tran::system` for reclamation
            - Legacy: `LF_HASH_TABLE` → use `LF_TRAN_SYSTEM` — same concept, C API
            - Always: start transaction before accessing, end after done
            - Retired nodes reclaimed only when all readers advanced past retirement ID

            ### Resource Tracking (Debug — base/)
            - `resource_tracker.hpp`: tracks page fixes, lock acquisitions
            - `push_track()` before scope, `pop_track()` after — leaks detected at pop

            ## Severity (CUBRID-Specific)

            | Emoji | Level | Examples |
            |-------|-------|----------|
            | 🔴 | blocking | pgbuf_fix/unfix mismatch, memory leak, lock-free reclamation error, WAL inconsistency |
            | 🟡 | important | Missing NULL check, error code unchecked, latch ordering violation, MVCC visibility bug |
            | 🟢 | warning | Style, formatting, missing comments |

            ## Output
            Write to `/tmp/review_results.json`:
            ```json
            [{"file":"path","line":123,"issue":"🔴 [blocking] pgbuf_fix without matching unfix","solution":"Add pgbuf_unfix(thread_p, page) before all return paths"}]
            ```
            - Korean language, specific line numbers
            - Empty `[]` if no issues

            ## Process

            1. Load skills: `skill(name="gh-cli")`, `skill(name="code-review")`, `skill(name="requesting-code-review")`

            2. Get PR diff: `gh pr view $PR_NUMBER --json baseRefOid,headRefOid --jq '[.baseRefOid, .headRefOid]'` → `git diff $BASE_SHA..$HEAD_SHA`

            3. **Read AGENTS.md hierarchy for context:**
               - Root `AGENTS.md` → project overview, build modes, code style
               - `src/AGENTS.md` → module dependencies, SERVER/CS/SA mode boundaries
               - For each changed file in `src/<module>/`, read `src/<module>/AGENTS.md`

            4. **Apply module-specific checks (from AGENTS.md):**
               
               **base/ (Infrastructure):**
               - Lock-free: `lockfree::tran::system` — transaction start before access, end after
               - Memory: `memory_wrapper.hpp` last include only in .c/.cpp files (never headers)
               - Error: `er_set(ER_ERROR_SEVERITY, ARG_FILE_LINE, ...)` — ARG_FILE_LINE macro
               - Debug: `resource_tracker.hpp` — push_track/pop_track pairs must match
               
               **transaction/ (MVCC/WAL/Locking):**
               - MVCC: `insert_id`/`delete_id` are 64-bit, never reused — check `mvcc_satisfies_snapshot()`
               - WAL: Log records identified by `LOG_LSN`, ensure undo/redo data completeness
               - Lock: wait-for graph deadlock detection, lock escalation threshold
               - Boot: strict subsystem initialization order in `boot_sr.c`
               
               **storage/ (Buffer/Heap/B-tree):**
               - Buffer: Every `pgbuf_fix()` MUST have matching `pgbuf_unfix()` — use resource_tracker
               - Latch: Acquire parent page before child page to prevent deadlocks
               - Identifiers: `VPID` (vol+page), `OID` (vol+page+slot), `HFID`/`BTID` — use correctly
               - B-tree: `btree.c` is ~37K lines — use function index to navigate
               
               **query/ (XASL Execution):**
               - XASL: Serialization must match exactly between client/server — version compatibility
               - Scan: `scan_next_scan()` return values must be checked (S_END, S_ERROR, etc.)
               - REGU_VARIABLE: Recursive evaluation — watch for stack overflow on deep expressions
               - Vacuum: `vacuum.c` in query/ — MVCC GC, handles races with active transactions

            5. Apply `code-review` skill focusing on: memory safety, error handling, thread safety, security

            6. Validate JSON format and write to `/tmp/review_results.json`

      - name: Post Inline Comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/review_results.json ]; then
            exit 0
          fi

          PR_NUMBER=${{ github.event.issue.number }}
          COMMIT=$(gh pr view $PR_NUMBER --json headRefOid --jq '.headRefOid')
          REPO="${{ github.repository }}"

          # Fetch existing review comments and build dedupe set (format: "path:line")
          EXISTING_COMMENTS=$(gh api repos/$REPO/pulls/$PR_NUMBER/comments --paginate --jq '.[] | "\(.path):\(.original_line // .line)"' 2>/dev/null || echo "")
          echo "Fetched existing comments for deduplication"

          jq -c '.[]?' /tmp/review_results.json 2>/dev/null | while read -r entry; do
            [ -z "$entry" ] && continue

            FILE=$(echo "$entry" | jq -r '.file // empty')
            LINE=$(echo "$entry" | jq -r '.line // empty')
            ISSUE=$(echo "$entry" | jq -r '.issue // empty')
            SOLUTION=$(echo "$entry" | jq -r '.solution // empty')

            [ -z "$FILE" ] || [ -z "$LINE" ] || [ -z "$ISSUE" ] && continue

            # Check for duplicate (file:line already has comment)
            CHECK_KEY="${FILE}:${LINE}"
            if echo "$EXISTING_COMMENTS" | grep -qx "$CHECK_KEY"; then
              echo "Skipping duplicate comment: $CHECK_KEY"
              continue
            fi

            sleep 0.5

            cat > pr_comment.txt << EOF
          $ISSUE

          $SOLUTION
          EOF

            echo "Posting comment to $FILE:$LINE"
            gh api --method POST /repos/$REPO/pulls/$PR_NUMBER/comments \
              -F body=@pr_comment.txt \
              -f commit_id=$COMMIT \
              -f path="$FILE" \
              -F line=$LINE \
              -f side="RIGHT" || echo "Failed to post comment to $FILE:$LINE"
          done
