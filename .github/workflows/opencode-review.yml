name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write 
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)
            
      - name: Configure Git for Agent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          share: true
          prompt: |
            /ulw
            Role: Expert C/C++ DBMS Senior Developer.

            [Workflow]
            1. Context: Read `./AGENTS.md` and local `AGENTS.md` in modified directories.
            2. Delegation: Compile these rules and strictly pass them to any subagents.
            3. Review: Analyze code for bugs, memory leaks, thread safety, and readability.
            4. Output Generation: You MUST save all your review comments into a single file named `review_results.json` in the workspace root.

            [Constraints]
            - Scope: Inline comments ONLY. STRICTLY NO general summaries in the chat.
            - Action: DO NOT execute any `gh` or git commands. Your ONLY output action is writing the `review_results.json` file using your bash/file tool.
            - Language: Korean (Extremely concise).

            [JSON Schema]
            You MUST ensure the file `review_results.json` contains a valid JSON array matching this exact format:
            [
              {
                "file": "src/connection/coordinator.cpp",
                "line": 74,
                "issue": "assert_release는 런타임 종료 위험. 초기화 실패는 graceful degradation 필요.",
                "suggestion": "if (!m_controller.open (...)) {\n    er_log_conn (__FILE__, __LINE__, \"failed\");\n    throw std::runtime_error(\"error\");\n}"
              }
            ]

      - name: Post Inline Comments from JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f review_results.json ]; then
            echo "No review_results.json found."
            exit 0
          fi
          
          echo "Processing review_results.json..."
          
          PR_NUMBER=${{ github.event.issue.number }}
          COMMIT=$(gh pr view $PR_NUMBER --json commits --jq '.commits[-1].oid')
          
          # Process each entry - .[]? ignores errors, 2>/dev/null suppresses error output
          jq -c '.[]?' review_results.json 2>/dev/null | while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            
            FILE=$(echo "$entry" | jq -r '.file // empty')
            LINE=$(echo "$entry" | jq -r '.line // empty')
            ISSUE=$(echo "$entry" | jq -r '.issue // empty')
            SUGGESTION=$(echo "$entry" | jq -r '.suggestion // empty')
            
            [ -z "$FILE" ] || [ -z "$LINE" ] || [ -z "$ISSUE" ] && continue
            
            # Create and post comment
            cat > pr_comment.txt << EOF
          🚨 **Issue**: $ISSUE
          
          💡 **Solution**:
          \`\`\`suggestion
          $SUGGESTION
          \`\`\`
          EOF
          
            gh api --method POST /repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
              -F body=@pr_comment.txt \
              -f commit_id=$COMMIT \
              -f path="$FILE" \
              -F line=$LINE \
              -f side="RIGHT" 2>/dev/null || echo "⚠️ Failed: $FILE:$LINE"
          done
          
          echo "✅ Done"
