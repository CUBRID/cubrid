name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write 
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)
            
      - name: Configure Git for Agent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          share: true
          prompt: |
            /ultrawork
            Role: Expert C/C++ DBMS Senior Developer.

            [Deduplication]
            BEFORE reviewing: Query existing PR comments via `gh api /repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/comments --jq '[.[] | {path: .path, line: .line}]'`. Skip any (file, line) pairs that already have comments.

            [Task]
            1. Read `./AGENTS.md` and modified directories' local AGENTS.md
            2. Review code for: bugs, memory leaks, thread safety, readability
            3. Save results to `/tmp/review_results.json`

            [Rules]
            - Output: ONLY inline comments in `/tmp/review_results.json`. No chat summaries.
            - Language: Korean
            - Detail: Solution must explain WHY (root cause) and HOW (fix) in 2+ sentences
            - NO markdown code blocks in solution field

            [JSON Format]
            [
              {
                "file": "src/connection/coordinator.cpp",
                "line": 74,
                "issue": "assert_release는 런타임 종료 위험. 디버그/릴리즈 빌드 불일치 문제.",
                "solution": "assert_release()는 릴리즈 빌드에서도 실행되어 프로세스를 강제 종료한다. 초기화 실패 시 graceful degradation이 필요하며, 에러를 로깅하고 예외를 throw하거나 에러 코드를 반환하여 호출자가 처리할 수 있도록 해야 한다. 또한 디버그 빌드와 릴리즈 빌드 간 동작 차이를 고려한 방어적 코딩이 필요하다."
              }
            ]

      - name: Post Inline Comments from JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/review_results.json ]; then
            exit 0
          fi
          
          PR_NUMBER=${{ github.event.issue.number }}
          COMMIT=$(gh pr view $PR_NUMBER --json commits --jq '.commits[-1].oid')
          
          jq -c '.[]?' /tmp/review_results.json 2>/dev/null | while read -r entry; do
            [ -z "$entry" ] && continue
            
            FILE=$(echo "$entry" | jq -r '.file // empty')
            LINE=$(echo "$entry" | jq -r '.line // empty')
            ISSUE=$(echo "$entry" | jq -r '.issue // empty')
            SOLUTION=$(echo "$entry" | jq -r '.solution // empty')
            
            [ -z "$FILE" ] || [ -z "$LINE" ] || [ -z "$ISSUE" ] && continue
            
            sleep 0.5
            
            cat > pr_comment.txt << EOF
          🚨 $ISSUE
          
          💡 $SOLUTION
          EOF
          
            gh api --method POST /repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
              -F body=@pr_comment.txt \
              -f commit_id=$COMMIT \
              -f path="$FILE" \
              -F line=$LINE \
              -f side="RIGHT" 2>/dev/null || true
          done
