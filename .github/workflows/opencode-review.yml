name: opencode-review

on:
  # issue_comment: fork PR 포함 모든 PR에서 maintainer가 /oc review 를 코멘트할 때 실행
  # - base repo 컨텍스트에서 실행 → secrets 접근 가능, GITHUB_TOKEN write 가능
  # - assertPermissions()가 코멘트 작성자(maintainer)의 권한을 체크 → 통과
  # pull_request 트리거는 외부 fork PR에서 세 가지 이유로 동작 불가:
  #   1. assertPermissions(): 외부 기여자는 write 권한 없음 → 즉시 실패
  #   2. GITHUB_TOKEN이 read-only → 코멘트 작성 403
  #   3. secrets(OPENCODE_API_KEY)가 null → 모델 호출 불가
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)
      
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          prompt: |
            /ulw
            You are a strict and expert C/C++ DBMS Senior developer reviewing this pull request.
            
            [CRITICAL INSTRUCTION]
            1. Do NOT just leave a single general summary comment on the PR.
            2. Carefully check for code quality, potential bugs, readability, leftover debug codes, and memory leaks.
            3. If you find any issues, you MUST leave **inline comments on the exact lines of code**.
            4. To leave an inline comment, you MUST use your Shell/Bash execution tool to run the GitHub CLI (`gh api`) command. DO NOT output plain text for the review.
            5. **All review comments and explanations MUST be written entirely in Korean.**
            6. **Be EXTREMELY concise.** State ONLY the issue and the actionable fix without any unnecessary background context.
            
            [COMMENT FORMAT RULE]
            Your inline comment body MUST strictly follow this short format. If code improvement is needed, you MUST use the GitHub Suggestion syntax (```suggestion):
            
            "🚨 **Issue**: [Briefly explain the bug, readability, or code quality issue in 1-2 sentences in Korean]
            
            💡 **Solution**:
            ```suggestion
            [Modified code]
            ```"
            
            [COMMAND FORMAT TO USE]
            The environment variables $GITHUB_REPOSITORY and $PR_NUMBER are already set in your terminal.
            
            Before leaving a comment, you must FIRST fetch the target COMMIT_ID of this PR using the following command:
            COMMIT_ID=$(gh pr view $PR_NUMBER --repo $GITHUB_REPOSITORY --json commits --jq '.commits[-1].oid')
            
            Then, run this exact command format for each issue you find, using the $COMMIT_ID you just fetched. 
            (Note: Ensure proper escaping for the multiline string and backticks in the body parameter if necessary in your bash environment):
            
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments \
              -f body="🚨 **Issue**: [Explanation in Korean]
            
            💡 **Solution**:
            \`\`\`suggestion
            [Modified code]
            \`\`\`" \
              -f commit_id="$COMMIT_ID" \
              -f path="[The exact file path from the diff]" \
              -F line=[The exact line number in the new code] \
              -f side="RIGHT"
