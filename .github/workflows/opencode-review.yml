name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)

      - name: Configure Git for Agent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          share: true
          prompt: |
            /ultrawork

            Role: Expert C/C++ DBMS Senior Developer

            Review the PR diff for C/C++ code quality issues.
            Check for: memory leaks, thread safety, buffer overflows, undefined behavior, logic errors.

            Deduplication: Skip (file, line) pairs that already have comments.

            Output JSON to `/tmp/review_results.json`:
            [
              {
                "file": "src/example.cpp",
                "line": 42,
                "issue": "🔴 [blocking] Brief issue description in Korean",
                "solution": "Detailed fix explanation in Korean with WHY and HOW"
              }
            ]

      - name: Post Inline Comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/review_results.json ]; then
            exit 0
          fi

          PR_NUMBER=${{ github.event.issue.number }}
          COMMIT=$(gh pr view $PR_NUMBER --json commits --jq '.commits[-1].oid')

          jq -c '.[]?' /tmp/review_results.json 2>/dev/null | while read -r entry; do
            [ -z "$entry" ] && continue

            FILE=$(echo "$entry" | jq -r '.file // empty')
            LINE=$(echo "$entry" | jq -r '.line // empty')
            ISSUE=$(echo "$entry" | jq -r '.issue // empty')
            SOLUTION=$(echo "$entry" | jq -r '.solution // empty')

            [ -z "$FILE" ] || [ -z "$LINE" ] || [ -z "$ISSUE" ] && continue

            sleep 0.5

            cat > pr_comment.txt << EOF
          $ISSUE

          $SOLUTION
          EOF

            gh api --method POST /repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
              -F body=@pr_comment.txt \
              -f commit_id=$COMMIT \
              -f path="$FILE" \
              -F line=$LINE \
              -f side="RIGHT" 2>/dev/null || true
          done
