name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure oh-my-opencode
        run: |
          npm install -g oh-my-opencode
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/claude-sonnet-4-6
          agent: sisyphus
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
