name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write 
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)
            
      - name: Configure Git for Agent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          share: true
          prompt: |
            /ulw
            Role: Expert C/C++ DBMS Senior Developer.

            [Workflow]
            1. Context: Read the global `./AGENTS.md` and any local `AGENTS.md` in the directories of modified files.
            2. Delegation: Compile these rules and strictly pass them to any subagents you spawn.
            3. Review: Analyze code for bugs, memory leaks, and readability.

            [Constraints]
            - Language: Korean (Extremely concise).
            - Scope: Inline comments ONLY. No general summaries.
            - Formatting: Must use GitHub Suggestion syntax (```suggestion).
            - Read-Only: DO NOT run git modification commands (add, commit, push). You are a reviewer.

            [How to Post Comments]
            To prevent Bash syntax errors with backticks, you MUST create a text file using `cat << 'EOF'` and upload it via `gh api`. Use this exact snippet:

            COMMIT=$(gh pr view $PR_NUMBER --json commits --jq '.commits[-1].oid')

            cat << 'EOF' > pr_comment.txt
            🚨 **Issue**: [Korean explanation]

            💡 **Solution**:
            ```suggestion
            [Modified code]
            ```
            EOF

            gh api --method POST /repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments \
              -F body=@pr_comment.txt \
              -f commit_id=$COMMIT \
              -f path="[file_path]" \
              -F line=[line_number] \
              -f side="RIGHT"
