name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.OPENCODE_API_KEY }}" ]; then
            echo "❌ OPENCODE_API_KEY secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)

      - name: Configure Git for Agent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          share: true
          prompt: |
            /ultrawork

            ## Role  
            C/C++ DBMS Code Reviewer for CUBRID RDBMS

            ## Prerequisites
            1. Load skills: `skill(name="gh-cli")`, `skill(name="code-review")`, `skill(name="requesting-code-review")`
            2. Get PR range: `gh pr view $PR_NUMBER --json baseRefOid,headRefOid --jq '[.baseRefOid, .headRefOid]'`
            3. Get full diff: `git diff $BASE_SHA..$HEAD_SHA` (NOT HEAD~1)

            ## Project Context  
            - Apache 2.0 C/C++17 RDBMS; `.c` files compile as C++17  
            - 3 build modes: SERVER_MODE / SA_MODE / CS_MODE  
            - Optimizer: client-side (`#if !defined(SERVER_MODE)`)  
            
            ## CUBRID Conventions  
            - Memory: `free_and_init(ptr)` — NEVER bare `free()`; `db_private_free(thread_p, ptr)` is CORRECT  
            - Errors: `er_set(ER_ERROR_SEVERITY, ARG_FILE_LINE, ER_CODE)` before returns; check `error != NO_ERROR`  
            - Style: 2-space indent, 120 chars, `PT_NODE *node`, header guards `_FILENAME_H_` (NOT `#pragma once`), `memory_wrapper.hpp` LAST  
            
            ## Severity  
            | Emoji | Level | Example |  
            |-------|-------|---------|  
            | 🔴 | blocking | Division by zero, buffer overflow |  
            | 🟡 | important | Missing NULL check |  
            | 🟢 | warning | Formatting |  
            
            ## Output  
            Write to `/tmp/review_results.json`:  
            ```json  
            [{"file":"path","line":123,"issue":"🔴 [blocking] issue","solution":"fix with reason"}]  
            ```  
            - Korean language, specific line numbers  
            - Empty `[]` if no issues  
            
            ## Process  
            1. Apply `code-review` skill checklist (memory, errors, logic, security)  
            2. Read AGENTS.md for patterns  
            3. Validate JSON  
            4. Write to `/tmp/review_results.json`

      - name: Post Inline Comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/review_results.json ]; then
            exit 0
          fi

          PR_NUMBER=${{ github.event.issue.number }}
          COMMIT=$(gh pr view $PR_NUMBER --json headRefOid --jq '.headRefOid')
          REPO="${{ github.repository }}"

          # Fetch existing review comments and build dedupe set (format: "path:line")
          EXISTING_COMMENTS=$(gh api repos/$REPO/pulls/$PR_NUMBER/comments --paginate --jq '.[] | "\(.path):\(.original_line // .line)"' 2>/dev/null || echo "")
          echo "Fetched existing comments for deduplication"

          jq -c '.[]?' /tmp/review_results.json 2>/dev/null | while read -r entry; do
            [ -z "$entry" ] && continue

            FILE=$(echo "$entry" | jq -r '.file // empty')
            LINE=$(echo "$entry" | jq -r '.line // empty')
            ISSUE=$(echo "$entry" | jq -r '.issue // empty')
            SOLUTION=$(echo "$entry" | jq -r '.solution // empty')

            [ -z "$FILE" ] || [ -z "$LINE" ] || [ -z "$ISSUE" ] && continue

            # Check for duplicate (file:line already has comment)
            CHECK_KEY="${FILE}:${LINE}"
            if echo "$EXISTING_COMMENTS" | grep -qx "$CHECK_KEY"; then
              echo "Skipping duplicate comment: $CHECK_KEY"
              continue
            fi

            sleep 0.5

            cat > pr_comment.txt << EOF
          $ISSUE

          $SOLUTION
          EOF

            echo "Posting comment to $FILE:$LINE"
            gh api --method POST /repos/$REPO/pulls/$PR_NUMBER/comments \
              -F body=@pr_comment.txt \
              -f commit_id=$COMMIT \
              -f path="$FILE" \
              -F line=$LINE \
              -f side="RIGHT" || echo "Failed to post comment to $FILE:$LINE"
          done
