name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write 
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)
            
      - name: Configure Git for Agent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          share: true
          prompt: |
            /ulw
            You are an expert C/C++ DBMS Senior developer reviewing this PR.

            [PHASE 1: MANDATORY CONTEXT GATHERING]
            Before spawning ANY subagents or starting the code review, you MUST execute the following sequence using your tools:
            1. Identify the directories of the files modified in this PR.
            2. Read the global `./AGENTS.md` file in the root directory.
            3. Read the specific `AGENTS.md` files located within the modified directories (e.g., if `src/sp/pl_executor.cpp` changed, you must read `src/sp/AGENTS.md`).
            4. Compile all these rules into a strict guideline in your memory.

            [PHASE 2: DELEGATION & REVIEW]
            ONLY AFTER completing PHASE 1, you may spawn subagents. You MUST explicitly pass the compiled rules from PHASE 1 to your subagents so they do not produce invalid results.

            [CRITICAL INSTRUCTIONS]
            1. Leave ONLY inline comments on specific lines. No general summary.
            2. Write all comments in Korean. Be EXTREMELY concise.
            3. Check for bugs, memory leaks, and readability.
            4. Use GitHub Suggestion syntax (```suggestion) for all code fixes.
            5. STRICTLY FORBIDDEN: You are a REVIEWER, not a contributor. Do NOT run `git add`, `git commit`, `git push`, or any git state modification commands under any circumstances.
            6. You MUST ONLY use `gh api` to leave comments. Do not try to modify the local repository state.

            [HOW TO POST COMMENTS]
            To avoid Bash syntax errors with backticks, you MUST use `cat << 'EOF'` to create a text file, then upload it via `gh api`. Use this EXACT block for each comment:

            COMMIT=$(gh pr view $PR_NUMBER --json commits --jq '.commits[-1].oid')

            cat << 'EOF' > pr_comment.txt
            🚨 **Issue**: [Korean explanation]

            💡 **Solution**:
            ```suggestion
            [Modified code]
            ```
            EOF

            gh api --method POST /repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments \
              -F body=@pr_comment.txt \
              -f commit_id=$COMMIT \
              -f path="[file_path]" \
              -F line=[line_number] \
              -f side="RIGHT"
