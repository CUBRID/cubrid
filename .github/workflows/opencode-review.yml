name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.OPENCODE_API_KEY }}" ]; then
            echo "❌ OPENCODE_API_KEY secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache oh-my-opencode
        id: cache-oh-my-opencode
        uses: actions/cache@v4
        with:
          path: ~/.oh-my-opencode-global
          key: oh-my-opencode-${{ runner.os }}-${{ runner.arch }}-latest

      - name: Install oh-my-opencode
        if: steps.cache-oh-my-opencode.outputs.cache-hit != 'true'
        shell: bash
        run: npm install -g oh-my-opencode --prefix ~/.oh-my-opencode-global

      - name: Configure and Add oh-my-opencode to PATH
        shell: bash
        run: |
          echo "$HOME/.oh-my-opencode-global/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.config/opencode
          echo '{"plugin":["oh-my-opencode@latest"]}' > $HOME/.config/opencode/opencode.json

      - name: Verify setup
        run: |
          oh-my-opencode --version
          grep -q "oh-my-opencode" $HOME/.config/opencode/opencode.json \
            && echo "✅ oh-my-opencode plugin registered" \
            || (echo "❌ oh-my-opencode not registered" && exit 1)

      - name: Configure Git for Agent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          model: opencode/kimi-k2.5
          agent: sisyphus
          use_github_token: true
          share: true
          prompt: |
            /analyze
            /ultrawork

            ## Role
            Expert C/C++ DBMS Senior Developer reviewing CUBRID RDBMS code.

            ## Project Context
            - Apache 2.0 C/C++17 RDBMS; `.c` files compile as C++17
            - 3 build modes: SERVER_MODE / SA_MODE / CS_MODE
            - Optimizer is client-side (`#if !defined(SERVER_MODE)`)

            ## Critical Conventions (MUST CHECK)
            - **Memory:** `free_and_init(ptr)` — NEVER bare `free()`; use `db_private_free(thread_p, ptr)` for private heap
            - **Alloc checks:** `if (ptr == NULL)` → `er_set(ER_ERROR_SEVERITY, ARG_FILE_LINE, ER_OUT_OF_VIRTUAL_MEMORY, 1, size)`
            - **Errors:** Return `NO_ERROR` (0) on success; call `er_set()` before error returns; check `error != NO_ERROR`
            - **Style:** 2-space indent, 120 chars, `PT_NODE *node` style, header guards `_FILENAME_H_` (NOT `#pragma once`), `memory_wrapper.hpp` LAST with `// XXX: SHOULD BE THE LAST INCLUDE HEADER`

            ## Review Checklist
            **A. Memory Safety (CRITICAL)** — NULL checks, `free_and_init`, no use-after-free, cleanup on `goto error`, bounded strings
            **B. Error Handling** — `er_set()` before returns, `NO_ERROR`, `ARG_FILE_LINE`, no silent failures
            **C. Logic** — Division by zero (cardinality/hit_prob), NULL deref, overflow/underflow, FP precision, dead code
            **D. Thread Safety** — Balanced locks (error paths too); optimizer needs no locks
            **E. Security** — `snprintf()` not `sprintf()`, no format strings/hardcoded secrets, input validation

            ## Severity
            | Emoji | Level | Example |
            |-------|-------|---------|
            | 🔴 | **blocking** | Division by zero, buffer overflow |
            | 🟡 | **important** | Missing NULL check, wrong calculation |
            | 🟢 | **warning** | Formatting, naming |

            ## Output
            Write to `/tmp/review_results.json`:
            ```json
            [{"file":"src/optimizer/query_planner.c","line":3370,"issue":"🔴 [blocking] 0으로 나누기 가능성","solution":"hit_prob 값이 0인 경우를 명시적으로 처리하세요. 'if ((outer->info)->hit_prob > 0)' 체크를 추가하거나, 0일 때는 limit_nljoin_guessed_card를 limit_val로 설정하세요."}]
            ```
            - `issue`: Korean, severity emoji + level
            - `solution`: Korean, explain WHY and HOW
            - Empty `[]` if none; dedupe (file, line) with existing comments

            ## Process
            1. `git diff HEAD~1` → read AGENTS.md → apply checklist → create JSON → validate → write to `/tmp/review_results.json`

            ## Constraints (NEVER)
            - bare `free()` / `db_private_free()`
            - `#pragma once`
            - `as any`, `@ts-ignore`
            - Deleting tests to pass build
            - Focus on C/C++ issues (CI handles formatting); be specific with line numbers

      - name: Post Inline Comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/review_results.json ]; then
            exit 0
          fi

          PR_NUMBER=${{ github.event.issue.number }}
          COMMIT=$(gh pr view $PR_NUMBER --json headRefOid --jq '.headRefOid')

          jq -c '.[]?' /tmp/review_results.json 2>/dev/null | while read -r entry; do
            [ -z "$entry" ] && continue

            FILE=$(echo "$entry" | jq -r '.file // empty')
            LINE=$(echo "$entry" | jq -r '.line // empty')
            ISSUE=$(echo "$entry" | jq -r '.issue // empty')
            SOLUTION=$(echo "$entry" | jq -r '.solution // empty')

            [ -z "$FILE" ] || [ -z "$LINE" ] || [ -z "$ISSUE" ] && continue

            sleep 0.5

            cat > pr_comment.txt << EOF
          $ISSUE

          $SOLUTION
          EOF

            gh api --method POST /repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
              -F body=@pr_comment.txt \
              -f commit_id=$COMMIT \
              -f path="$FILE" \
              -F line=$LINE \
              -f side="RIGHT" 2>/dev/null || true
          done
