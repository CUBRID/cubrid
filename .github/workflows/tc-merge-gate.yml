#
# TC Merge Gate — Block engine PR merge while TC changes are still unlanded
#
# Register as Required Status Check in Branch Protection Rules:
#   Settings → Branches → develop → Require status checks → "Check TC PRs"
#
# Fail conditions (per TC repo, either one blocks):
#   - An open TC PR for tc/pr-<N>                  →  merge it, or close it if it carries nothing
#   - tc/pr-<N> holds content develop does not have →  merge the TC PR
#
# The second condition exists because TC Branch Finalize closes the TC PR and
# deletes tc/pr-<N> when the engine PR merges. Whatever the branch still holds
# is gone at that moment (CUBRID/cubrid#7964 lost a reviewed commit that way).
#
# Every answer this gate cannot establish blocks. Losing a TC change costs more
# than one re-run.
#
# The scheduled sweep judges open PRs again, because tc/pr-<N> changes after the
# engine PR's last event and GitHub does not re-evaluate required checks when
# the merge button is hit.
#
# Where a verdict is stale the sweep re-runs the gate job; it never writes a check
# run of its own. The Checks API files a check run under whichever workflow ran
# first on the commit, and branch protection reads the newest run of each workflow
# on its own: a verdict filed under another workflow blocks however the gate
# decides, and one filed under an older gate run is ignored (CUBRID/cubrid#8118).
# An earlier sweep did write such check runs. They cannot be deleted, so both jobs
# keep them equal to the gate's verdict.
#

name: TC Merge Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Engine PR number to check (required for workflow_dispatch)'
        required: true
        type: string

permissions: {} # Least privilege — jobs opt in below

concurrency:
  group: tc-merge-gate-${{ github.event.pull_request.number || inputs.pr_number || 'sweep' }}
  cancel-in-progress: true

env:
  OWNER: CUBRID
  TC_REPOS: 'cubrid-testcases cubrid-testcases-private-ex'

  # judge <engine-pr-number> — needs GH_TOKEN scoped to the TC repos.
  # stdout: first line PASS|BLOCK, rest a markdown bullet list.
  JUDGE: |
    set -uo pipefail

    PR_NUMBER="$1"
    BRANCH="tc/pr-${PR_NUMBER}"
    VERDICT=PASS
    DETAIL=""

    # Paths carry '%' and spaces; they must be encoded before they enter a URL.
    url_path() { jq -rn --arg s "$1" '$s|@uri' | sed 's|%2F|/|g'; }

    # Blob sha of a path on develop, '-' when develop does not have it, '?' when
    # the answer did not arrive. '?' matches nothing, so it blocks.
    dev_blob() {
      local out
      if out=$(gh api "repos/${OWNER}/${1}/contents/$(url_path "${2}")?ref=develop" --jq '.sha' 2>&1); then
        printf '%s' "${out}"
      elif [[ "${out}" == *"HTTP 404"* ]]; then
        printf '%s' '-'
      else
        printf '%s' '?'
      fi
    }

    for TC_REPO in ${TC_REPOS}; do
      # This call also stands in for an access check: a token that cannot see the
      # repo fails here, before a 404 below could read as "no branch".
      if ! OPEN_PR=$(gh pr list --repo "${OWNER}/${TC_REPO}" --head "${BRANCH}" \
                       --state open --limit 1 --json url,isDraft --jq '.[0] // empty'); then
        DETAIL+="- ⚠️ **${TC_REPO}**: could not read the TC PR list — re-run this check"$'\n'
        VERDICT=BLOCK
        continue
      fi

      if [ -n "${OPEN_PR}" ]; then
        URL=$(jq -r '.url' <<< "${OPEN_PR}")
        STATE=$( [ "$(jq -r '.isDraft' <<< "${OPEN_PR}")" = true ] && echo 'open (draft)' || echo open )
        DETAIL+="- ❌ **${TC_REPO}**: TC PR [\`${BRANCH}\`](${URL}) is ${STATE} — merge it, or close it if it carries no change"$'\n'
        VERDICT=BLOCK
        continue
      fi

      if ! REF_ERR=$(gh api "repos/${OWNER}/${TC_REPO}/git/ref/heads/${BRANCH}" --silent 2>&1); then
        if [[ "${REF_ERR}" == *"HTTP 404"* ]]; then
          DETAIL+="- ✅ **${TC_REPO}**: no TC branch"$'\n'
        else
          DETAIL+="- ⚠️ **${TC_REPO}**: could not read \`${BRANCH}\` — re-run this check"$'\n'
          VERDICT=BLOCK
        fi
        continue
      fi

      # The three-dot file list only says which paths the branch touched. A squash
      # merge leaves them all listed, so the content decides, not the commits.
      if ! CHANGED=$(gh api "repos/${OWNER}/${TC_REPO}/compare/develop...${BRANCH}" \
                       --jq '.files[]? | "\(.status)\t\(if .status == "removed" then "-" else .sha end)\t\(.previous_filename // "-")\t\(.filename)"'); then
        DETAIL+="- ⚠️ **${TC_REPO}**: could not compare \`${BRANCH}\` with develop — re-run this check"$'\n'
        VERDICT=BLOCK
        continue
      fi

      FILE_COUNT=0
      [ -n "${CHANGED}" ] && FILE_COUNT=$(grep -c '' <<< "${CHANGED}")

      if [ "${FILE_COUNT}" -eq 0 ]; then
        DETAIL+="- ✅ **${TC_REPO}**: \`${BRANCH}\` holds nothing develop lacks"$'\n'
        continue
      fi

      # The compare API reports at most 300 files. Past that, silence is not proof.
      if [ "${FILE_COUNT}" -ge 300 ]; then
        DETAIL+="- ❌ **${TC_REPO}**: \`${BRANCH}\` touches ${FILE_COUNT} files or more,"
        DETAIL+=" which is past what the compare API reports. Merge the TC PR."$'\n'
        VERDICT=BLOCK
        continue
      fi

      UNLANDED=0
      CAPPED=''
      LIST=''
      while IFS=$'\t' read -r STATUS BRANCH_BLOB PREVIOUS FILE; do
        HIT=''
        # Never skip a line quietly: an entry we cannot read is an answer we do not have.
        [ -z "${FILE}" ] && HIT='(an entry of the compare output could not be read)'
        if [ -n "${HIT}" ]; then
          :
        elif [ "${STATUS}" = removed ]; then
          [ "$(dev_blob "${TC_REPO}" "${FILE}")" != '-' ] && HIT="${FILE} (deleted on the branch)"
        else
          [ "$(dev_blob "${TC_REPO}" "${FILE}")" != "${BRANCH_BLOB}" ] && HIT="${FILE}"
          # A rename also deletes its old path, and that deletion can be unlanded
          # while the new path already matches.
          if [ -z "${HIT}" ] && [ "${STATUS}" = renamed ] && [ "${PREVIOUS}" != '-' ]; then
            [ "$(dev_blob "${TC_REPO}" "${PREVIOUS}")" != '-' ] && HIT="${PREVIOUS} (renamed on the branch)"
          fi
        fi

        [ -z "${HIT}" ] && continue
        UNLANDED=$((UNLANDED + 1))
        LIST+="  - \`${HIT}\`"$'\n'
        if [ "${UNLANDED}" -ge 10 ]; then CAPPED=' or more'; break; fi
      done <<< "${CHANGED}"

      if [ "${UNLANDED}" -gt 0 ]; then
        DETAIL+="- ❌ **${TC_REPO}**: \`${BRANCH}\` holds ${UNLANDED}${CAPPED} file(s) develop does not have."
        DETAIL+=" Merging this PR closes the TC PR and deletes the branch, and they are lost."
        DETAIL+=" Merge the TC PR first."$'\n'
        DETAIL+="${LIST}"
        VERDICT=BLOCK
      else
        DETAIL+="- ✅ **${TC_REPO}**: \`${BRANCH}\` holds nothing develop lacks"$'\n'
      fi
    done

    echo "${VERDICT}"
    printf '%s' "${DETAIL}"

  # align <head-sha> <success|failure> <detail> — needs GH_TOKEN with checks: write
  # on ENGINE_REPO. Sets every "Check TC PRs" check run on the commit that no job
  # owns to the given verdict. A re-run copies those onto the end of its run, so one
  # left stale would land on top of the fresh verdict.
  # stdout: how many it changed.
  ALIGN: |
    set -uo pipefail

    if [ "${2}" = failure ]; then
      TITLE='TC changes are not on TC develop yet'
    else
      TITLE='Nothing is left on the TC branches that develop does not have'
    fi
    FOLLOWS='Follows the TC Merge Gate verdict. To judge again, re-run TC Merge Gate / Check TC PRs, not this entry.'

    # A verdict can match while the text is still an earlier sweep's, which links
    # that sweep's run. Re-running that run brings back the code that wrote it.
    IDS=$(gh api --paginate "repos/${ENGINE_REPO}/commits/${1}/check-runs?check_name=Check%20TC%20PRs&filter=all&per_page=100" \
            --jq ".check_runs[] | select(.app.slug == \"github-actions\")
                  | select((.details_url // \"\") | test(\"/actions/runs/\") | not)
                  | select(.conclusion != \"${2}\" or ((.output.summary // \"\") | contains(\"${FOLLOWS}\") | not))
                  | .id") || exit 1

    N=0
    for ID in ${IDS}; do
      gh api -X PATCH "repos/${ENGINE_REPO}/check-runs/${ID}" -f conclusion="${2}" \
        -f "output[title]=${TITLE}" -f "output[summary]=${3}"$'\n\n'"${FOLLOWS}" --silent || exit 1
      N=$((N + 1))
    done
    echo "${N}"

jobs:
  check-tc-prs:
    name: Check TC PRs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          repositories: cubrid-testcases,cubrid-testcases-private-ex
          owner: ${{ env.OWNER }}

      - name: Mask token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: echo "::add-mask::${APP_TOKEN}"

      - name: Check TC PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          ENGINE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER}" ] || ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::PR_NUMBER is empty or not a valid number: '${PR_NUMBER}'"
            exit 1
          fi

          # A re-run executes the workflow as it was when the run began, and the
          # sweep re-runs old runs. Reading the judge from develop keeps them on
          # today's rules.
          if ! GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'Accept: application/vnd.github.raw' \
                 "repos/${ENGINE_REPO}/contents/.github/workflows/tc-merge-gate.yml?ref=develop" \
               | yq -e '.env.JUDGE' > "${RUNNER_TEMP}/judge.sh"; then
            echo "::error::Could not read the judge from develop — re-run this check"
            exit 1
          fi
          OUT=$(bash "${RUNNER_TEMP}/judge.sh" "${PR_NUMBER}")
          VERDICT=$(head -n 1 <<< "${OUT}")
          DETAIL=$(tail -n +2 <<< "${OUT}")

          printf '%s' "${ALIGN}" > "${RUNNER_TEMP}/align.sh"
          HEAD_SHA=$(GH_TOKEN="${GITHUB_TOKEN}" gh api "repos/${ENGINE_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          CONCLUSION=$( [ "${VERDICT}" = BLOCK ] && echo failure || echo success )
          if ! GH_TOKEN="${GITHUB_TOKEN}" bash "${RUNNER_TEMP}/align.sh" "${HEAD_SHA}" "${CONCLUSION}" \
                 "${DETAIL}"$'\n\n'"Judged by ${RUN_URL}." > /dev/null; then
            echo "::error::Could not align the check runs an earlier sweep wrote — re-run this check"
            exit 1
          fi

          if [ "${VERDICT}" = BLOCK ]; then
            COMMENT_BODY="## ❌ TC Merge Gate — Merge Blocked

          TC changes for this PR are not on TC develop yet.

          ${DETAIL}
          **Steps to unblock:**
          1. Merge the TC PRs listed above. Close one only when it carries no change.
          2. Re-run **TC Merge Gate / Check TC PRs** (Actions tab → TC Merge Gate → Re-run failed jobs). Re-running any other workflow does not judge again."
          else
            COMMENT_BODY="## ✅ TC Merge Gate — Merge Allowed

          Nothing is left on the TC branches that develop does not have.

          ${DETAIL}"
          fi

          # Best effort — the comment never decides the check result.
          {
            COMMENT_ID=$(GH_TOKEN="${GITHUB_TOKEN}" gh api "repos/${ENGINE_REPO}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login=="github-actions[bot]" and (.body | contains("TC Merge Gate"))) | .id' \
              | tail -n 1)

            if [ -n "${COMMENT_ID}" ]; then
              GH_TOKEN="${GITHUB_TOKEN}" gh api -X PATCH "repos/${ENGINE_REPO}/issues/comments/${COMMENT_ID}" \
                -f body="${COMMENT_BODY}" > /dev/null
            else
              GH_TOKEN="${GITHUB_TOKEN}" gh pr comment "${PR_NUMBER}" --repo "${ENGINE_REPO}" --body "${COMMENT_BODY}"
            fi
          } || echo "::warning::Failed to post PR comment — check result is unaffected"

          echo "${DETAIL}" >> "${GITHUB_STEP_SUMMARY}"

          if [ "${VERDICT}" = BLOCK ]; then
            echo "::error::TC Merge Gate FAILED — TC changes are not on TC develop yet"
            exit 1
          fi

          echo "TC Merge Gate PASSED"

  resweep:
    name: Re-check stale verdicts
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      checks: write
      pull-requests: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          repositories: cubrid-testcases,cubrid-testcases-private-ex
          owner: ${{ env.OWNER }}

      - name: Mask token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: echo "::add-mask::${APP_TOKEN}"

      - name: Judge open PRs again, and re-run the gate where the standing verdict is stale
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ENGINE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "${JUDGE}" > "${RUNNER_TEMP}/judge.sh"
          printf '%s' "${ALIGN}" > "${RUNNER_TEMP}/align.sh"

          # An open TC PR blocks on its own, so one list per TC repo settles most
          # PRs without asking about them one by one.
          : > "${RUNNER_TEMP}/open-tc.txt"
          for TC_REPO in ${TC_REPOS}; do
            gh pr list --repo "${OWNER}/${TC_REPO}" --state open --limit 500 --json headRefName \
              --jq '.[].headRefName | select(startswith("tc/pr-")) | ltrimstr("tc/pr-")' \
              >> "${RUNNER_TEMP}/open-tc.txt"
          done
          sort -u -o "${RUNNER_TEMP}/open-tc.txt" "${RUNNER_TEMP}/open-tc.txt"

          GH_TOKEN="${GITHUB_TOKEN}" gh pr list --repo "${ENGINE_REPO}" --base develop --state open \
            --limit 300 --json number,headRefOid,statusCheckRollup > "${RUNNER_TEMP}/open-prs.json"

          # Past the limit the rest would drop out without a word.
          OPEN_N=$(jq 'length' "${RUNNER_TEMP}/open-prs.json")
          if [ "${OPEN_N}" -ge 300 ]; then
            echo "::warning::${OPEN_N} open PRs reached the list limit — raise it"
          fi

          # Branch protection reads the gate's newest run: the highest run id. Its job
          # id is what a re-run takes. An entry with no job behind it was written by
          # an earlier sweep. No field may be empty: gh gives a running check run an
          # empty conclusion, and read folds an empty field into the next one.
          jq -r '.[] | . as $pr
                  | [$pr.statusCheckRollup[]? | select(.name == "Check TC PRs")] as $all
                  | ([$all[] | select((.detailsUrl // "") | test("/actions/runs/[0-9]+/job/[0-9]+"))
                      | . + (.detailsUrl | capture("/actions/runs/(?<run>[0-9]+)/job/(?<job>[0-9]+)"))]
                     | max_by(.run | tonumber)) as $gate
                  | [$all[] | select((.detailsUrl // "") | test("/actions/runs/") | not)] as $old
                  | select($gate != null or ($old | length) > 0)
                  | [$pr.number, $pr.headRefOid,
                     (if $gate.status == "COMPLETED" then $gate.conclusion else "-" end), ($gate.job // "-"),
                     ([$gate.completedAt, $old[].completedAt] | map(select(. != null)) | max // "-"),
                     ($old | length)]
                  | @tsv' \
            "${RUNNER_TEMP}/open-prs.json" > "${RUNNER_TEMP}/prs.tsv"

          # Re-run no gate whose verdict is younger than this: its run may still be settling.
          MIN_AGE_SEC=1800
          NOW=$(date -u +%s)
          RERUN_N=0
          ALIGNED_N=0

          while IFS=$'\t' read -r PR_NUMBER HEAD_SHA STANDING JOB_ID COMPLETED SWEPT_N; do
            [ -z "${PR_NUMBER}" ] && continue
            [ "${COMPLETED}" = '-' ] && continue
            YOUNG=''
            [ $(( NOW - $(date -u -d "${COMPLETED}" +%s) )) -lt "${MIN_AGE_SEC}" ] && YOUNG=1
            # A gate job that has not completed is still settling.
            [ "${JOB_ID}" != '-' ] && [ "${STANDING}" = '-' ] && YOUNG=1
            # Entries an earlier sweep wrote are aligned on every pass, young or not:
            # a re-run of a gate run older than the ALIGN step leaves them as they were.
            [ -n "${YOUNG}" ] && [ "${SWEPT_N}" = 0 ] && continue

            # A young verdict may be newer than the list — a TC PR closed since — so it
            # goes to the judge.
            if [ -z "${YOUNG}" ] && grep -qxF "${PR_NUMBER}" "${RUNNER_TEMP}/open-tc.txt"; then
              EXPECTED=FAILURE
            else
              OUT=$(bash "${RUNNER_TEMP}/judge.sh" "${PR_NUMBER}") || {
                echo "::warning::PR #${PR_NUMBER}: the judge did not finish — left as it stands"
                continue
              }
              EXPECTED=$( [ "$(head -n 1 <<< "${OUT}")" = BLOCK ] && echo FAILURE || echo SUCCESS )
            fi

            # Before any re-run: it would copy a stale entry onto the end of its run.
            if [ "${SWEPT_N}" != 0 ]; then
              if ! N=$(GH_TOKEN="${GITHUB_TOKEN}" bash "${RUNNER_TEMP}/align.sh" "${HEAD_SHA}" "${EXPECTED,,}" \
                         "Judged by the scheduled sweep (${RUN_URL})."); then
                echo "::warning::PR #${PR_NUMBER}: could not align the entries an earlier sweep wrote — left as it stands"
                continue
              fi
              if [ "${N}" != 0 ]; then
                echo "::notice::PR #${PR_NUMBER}: ${N} entries an earlier sweep wrote now say ${EXPECTED}"
                ALIGNED_N=$((ALIGNED_N + 1))
              fi
            fi

            STALE_GATE=''
            [ -z "${YOUNG}" ] && [ "${STANDING}" != '-' ] && [ "${STANDING}" != "${EXPECTED}" ] && STALE_GATE=1
            [ -z "${STALE_GATE}" ] && continue
            if ERR=$(GH_TOKEN="${GITHUB_TOKEN}" gh api -X POST "repos/${ENGINE_REPO}/actions/jobs/${JOB_ID}/rerun" --silent 2>&1); then
              echo "::notice::PR #${PR_NUMBER}: standing ${STANDING}, now ${EXPECTED} — re-ran the gate"
              RERUN_N=$((RERUN_N + 1))
            else
              echo "::warning::PR #${PR_NUMBER}: standing ${STANDING}, now ${EXPECTED}, but the gate could not be re-run: ${ERR//$'\n'/ }." \
                   "GitHub refuses runs older than 30 days; a push to the PR starts a new one."
            fi
          done < "${RUNNER_TEMP}/prs.tsv"

          echo "Re-ran the gate on ${RERUN_N} PR(s). Aligned earlier sweep entries on ${ALIGNED_N} PR(s)." >> "${GITHUB_STEP_SUMMARY}"
