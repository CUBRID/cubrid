name: Comment trigger

on:
  issue_comment:
    types: [created, edited]

jobs:
  run_shell:
    name: Run shell test on CircleCI
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/run shell'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CircleCI Shell Test
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "$GITHUB_CONTEXT"
          BRANCH_NAME="${{ github.event.issue.pull_request.head.ref }}"
          echo "Branch Name: $BRANCH_NAME"
          curl --request POST \
            --url https://circleci.com/api/v2/project/gh/tw-kang/cubrid/pipeline \
            --header "Circle-Token: $CIRCLECI_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "branch": "'"$BRANCH_NAME"'",
              "parameters": {
                "run_shell_test": true
              }
            }'
