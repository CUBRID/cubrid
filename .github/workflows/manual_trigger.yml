name: Comment trigger

on:
  issue_comment:
    types: [created, edited]

jobs:
  run_shell:
    name: Run shell test on CircleCI
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/run shell'
    runs-on: ubuntu-latest
    steps:
      - name: Set Branch Name
        id: set_branch
        run: |
          if [ -z "${{ github.event.issue.pull_request.head.ref }}" ]; then
            BRANCH_NAME="${GITHUB_HEAD_REF}"
          else
            BRANCH_NAME="${{ github.event.issue.pull_request.head.ref }}"
          fi
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Trigger CircleCI Shell Test
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          echo "$GITHUB_HEAD_REF"
          echo "Branch Name: $BRANCH_NAME"
          curl --request POST \
            --url https://circleci.com/api/v2/project/gh/tw-kang/cubrid/pipeline \
            --header "Circle-Token: $CIRCLECI_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "branch": "'"$BRANCH_NAME"'",
              "parameters": {
                "run_shell_test": true
              }
            }'
