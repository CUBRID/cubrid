name: Comment trigger

on:
  issue_comment:
    types: [created, edited]

jobs:
  run_shell:
    name: run shell test on CircleCI
    if: |
      github.event.issue.pull_request && 
      contains(github.event.comment.body, '/run shell')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CircleCI Shell Test
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        run: |
          curl --request POST \
            --url https://circleci.com/api/v2/project/gh/tw-kang/cubrid/pipeline \
            --header "Circle-Token: ${CIRCLECI_TOKEN}" \
            --header "content-type: application/json" \
            --data '{
              "branch": "'"${{ github.event.pull_request.head.ref }}"'",
              "parameters": {
                "run_shell_test": true
              }
            }'
