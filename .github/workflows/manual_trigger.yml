name: Comment trigger

on:
  issue_comment:
    types: [created, edited]

jobs:
  run_shell:
    name: Run shell test on CircleCI
    if: |
      ${{ github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/run shell ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Get Branch Name from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "${{ github.event.issue.pull_request.url }}" | jq -r .head.ref)
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "Branch Name: $BRANCH_NAME"  # 디버깅용 출력
          
          # Extract baseline version from comment if it exists
          BASELINE=$(echo "${{ github.event.comment.body }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+' || echo "")
          echo "BASELINE=$BASELINE" >> $GITHUB_ENV
          if [ -n "$BASELINE" ]; then
            echo "Baseline Version: $BASELINE"  # 디버깅용 출력
          else
            echo "No Baseline Version provided. Will use latest from DB."  # 디버깅용 출력
          fi

      - name: Trigger CircleCI Shell Test
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          BASELINE: ${{ env.BASELINE }}
        run: |
          # Prepare the data JSON
          if [ -n "$BASELINE" ]; then
            # If baseline is provided
            DATA='{
              "branch": "'"$BRANCH_NAME"'",
              "parameters": {
                "run_shell_test": true,
                "baseline": "'"$BASELINE"'"
              }
            }'
          else
            # If baseline is not provided
            DATA='{
              "branch": "'"$BRANCH_NAME"'",
              "parameters": {
                "run_shell_test": true,
                "baseline": ""
              }
            }'
          fi
          
          # Trigger CircleCI pipeline
          curl --request POST \
            --url https://circleci.com/api/v2/project/gh/tw-kang/cubrid/pipeline \
            --header "Circle-Token: $CIRCLECI_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$DATA"
