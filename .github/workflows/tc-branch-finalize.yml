#
# TC Branch Finalize — Merge or delete TC branches when engine PR closes
#
# Trigger: pull_request_target (closed)
# - PR merged: squash merge tc/pr-<N> → develop, then delete branch
# - PR closed (not merged): delete tc/pr-<N> branch
#
# Security: pull_request_target runs from base branch — secrets available
#           but PR code is NEVER checked out or executed.
#
name: TC Branch Finalize

on:
  pull_request_target:
    types: [closed]

permissions: {} # Least privilege — jobs opt-in below

concurrency:
  group: tc-branch-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize-tc-branch:
    name: Finalize TC (${{ matrix.tc-repo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write # For failure comments
    strategy:
      matrix:
        tc-repo:
          - cubrid-testcases
          - cubrid-testcases-private-ex
      fail-fast: false
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.tc-repo }}
          owner: CUBRID

      - name: Mask token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: echo "::add-mask::${APP_TOKEN}"

      # Only runs when PR was merged — squash merges TC changes into develop.
      # When PR was closed without merge, this step is skipped and delete still runs.
      - name: Squash merge TC branch into develop
        if: github.event.pull_request.merged == true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TC_REPO: ${{ matrix.tc-repo }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"

          # Check if TC branch exists
          if ! gh api "repos/CUBRID/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" > /dev/null 2>&1; then
            echo "::notice::Branch '${BRANCH_NAME}' does not exist in ${TC_REPO}. Nothing to merge."
            exit 0
          fi

          # Extract PR header (e.g. [CBRD-1234]) from title
          PR_HEADER=$(echo "${PR_TITLE}" | grep -oE '^\[[A-Z]+-[0-9]+\]' || echo "")

          # Clone TC repo develop (treeless for speed)
          git clone --filter=blob:none \
            "https://x-access-token:${APP_TOKEN}@github.com/CUBRID/${TC_REPO}.git" \
            tc-repo
          cd tc-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ensure we're on develop (default branch might differ)
          git checkout develop

          # Fetch and squash merge TC branch
          git fetch origin "${BRANCH_NAME}:${BRANCH_NAME}"
          git merge --squash "${BRANCH_NAME}"

          # Commit only if there are actual changes
          if git diff --cached --quiet; then
            echo "::notice::No TC changes in '${BRANCH_NAME}' for ${TC_REPO}. Skipping commit."
          else
            COMMIT_MSG="${PR_HEADER:+${PR_HEADER} }Merge TC branch '${BRANCH_NAME}' into develop"
            git commit -m "${COMMIT_MSG}"
            git push origin develop
            echo "::notice::Squash merged '${BRANCH_NAME}' into develop in ${TC_REPO}"
          fi

      # Runs after merge succeeds OR when merge step is skipped (PR not merged).
      # Skipped only if the merge step above failed (preserves branch for retry).
      - name: Delete TC branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TC_REPO: ${{ matrix.tc-repo }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"

          if gh api "repos/CUBRID/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" > /dev/null 2>&1; then
            gh api "repos/CUBRID/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" --method DELETE
            echo "::notice::Deleted '${BRANCH_NAME}' from ${TC_REPO}"
          else
            echo "::notice::Branch '${BRANCH_NAME}' not found in ${TC_REPO}. Already deleted."
          fi

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TC_REPO: ${{ matrix.tc-repo }}
          ENGINE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${ENGINE_REPO}" \
            --body "⚠️ **TC Branch Finalize Failed** for \`${TC_REPO}\`

          Failed to process \`tc/pr-${PR_NUMBER}\`.
          Please check the [workflow run](${RUN_URL}) for details."
