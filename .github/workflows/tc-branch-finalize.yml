#
# TC Branch Finalize — Merge or delete TC branches when engine PR closes
#
# Trigger: pull_request_target (closed)
# - PR merged: squash merge tc/pr-<N> → develop, then delete branch
# - PR closed (not merged): delete tc/pr-<N> branch
#
# Security: pull_request_target runs from base branch — secrets available
#           but PR code is NEVER checked out or executed.
#
name: TC Branch Finalize

on:
  pull_request_target:
    types: [closed]

permissions: {} # Least privilege — jobs opt-in below

concurrency:
  group: tc-branch-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Job 1: PR merged → squash merge TC branch into develop, then delete
  # ──────────────────────────────────────────────
  merge-tc-branch:
    name: Merge TC (${{ matrix.tc-repo }})
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write # For failure comments
    strategy:
      matrix:
        tc-repo:
          - cubrid-testcases
          - cubrid-testcases-private-ex
      fail-fast: false
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.tc-repo }}
          owner: CUBRID

      - name: Mask token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: echo "::add-mask::${APP_TOKEN}"

      - name: Squash merge TC branch into develop
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TC_REPO: ${{ matrix.tc-repo }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"

          # Check if TC branch exists
          if ! gh api "repos/CUBRID/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" > /dev/null 2>&1; then
            echo "::notice::Branch '${BRANCH_NAME}' does not exist in ${TC_REPO}. Nothing to merge."
            exit 0
          fi

          # Extract PR header (e.g. [CBRD-1234]) from title
          PR_HEADER=$(echo "${PR_TITLE}" | grep -oE '^\[[A-Z]+-[0-9]+\]' || echo "")

          # Clone TC repo develop
          git clone --filter=blob:none \
            "https://x-access-token:${APP_TOKEN}@github.com/CUBRID/${TC_REPO}.git" \
            tc-repo
          cd tc-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch TC branch
          git fetch origin "${BRANCH_NAME}:${BRANCH_NAME}"

          # Squash merge
          git merge --squash "${BRANCH_NAME}"

          # Check if there are actual changes to commit
          if git diff --cached --quiet; then
            echo "::notice::No TC changes in '${BRANCH_NAME}' for ${TC_REPO}. Skipping commit."
          else
            COMMIT_MSG="${PR_HEADER} Merge TC branch '${BRANCH_NAME}' into develop"
            # Trim leading space if no header
            COMMIT_MSG=$(echo "${COMMIT_MSG}" | sed 's/^ //')
            git commit -m "${COMMIT_MSG}"
            git push origin develop
            echo "::notice::Squash merged '${BRANCH_NAME}' into develop in ${TC_REPO}"
          fi

      - name: Delete TC branch
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TC_REPO: ${{ matrix.tc-repo }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"

          # Delete branch via API (no clone needed)
          if gh api "repos/CUBRID/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" > /dev/null 2>&1; then
            gh api "repos/CUBRID/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" --method DELETE
            echo "::notice::Deleted '${BRANCH_NAME}' from ${TC_REPO}"
          else
            echo "::notice::Branch '${BRANCH_NAME}' already deleted from ${TC_REPO}."
          fi

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TC_REPO: ${{ matrix.tc-repo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ⚠️ **TC Branch Finalize Failed** for \`${TC_REPO}\`

          Failed to squash merge or delete \`tc/pr-${PR_NUMBER}\`.
          Please check the [workflow run](${RUN_URL}) for details.

          **Manual recovery:**
          \`\`\`bash
          git clone -b develop https://github.com/CUBRID/${TC_REPO}.git && cd ${TC_REPO}
          git fetch origin tc/pr-${PR_NUMBER}:tc/pr-${PR_NUMBER}
          git merge --squash tc/pr-${PR_NUMBER}
          git commit -m \"Merge TC branch 'tc/pr-${PR_NUMBER}' into develop\"
          git push origin develop
          git push origin --delete tc/pr-${PR_NUMBER}
          \`\`\`
          EOF
          )"

  # ──────────────────────────────────────────────
  # Job 2: PR closed (not merged) → delete TC branch
  # ──────────────────────────────────────────────
  delete-tc-branch:
    name: Delete TC (${{ matrix.tc-repo }})
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write # For failure comments
    strategy:
      matrix:
        tc-repo:
          - cubrid-testcases
          - cubrid-testcases-private-ex
      fail-fast: false
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.tc-repo }}
          owner: CUBRID

      - name: Mask token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: echo "::add-mask::${APP_TOKEN}"

      - name: Delete TC branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TC_REPO: ${{ matrix.tc-repo }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"

          # Delete branch via REST API
          if gh api "repos/CUBRID/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" > /dev/null 2>&1; then
            gh api "repos/CUBRID/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" --method DELETE
            echo "::notice::Deleted '${BRANCH_NAME}' from ${TC_REPO}"
          else
            echo "::notice::Branch '${BRANCH_NAME}' does not exist in ${TC_REPO}. Nothing to delete."
          fi

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TC_REPO: ${{ matrix.tc-repo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ⚠️ **TC Branch Delete Failed** for \`${TC_REPO}\`

          Failed to delete \`tc/pr-${PR_NUMBER}\` branch.
          Please check the [workflow run](${RUN_URL}) for details.

          **Manual cleanup:**
          \`\`\`bash
          curl -X DELETE \\
            -H \"Authorization: Bearer \$GITHUB_TOKEN\" \\
            -H \"Accept: application/vnd.github+json\" \\
            \"https://api.github.com/repos/CUBRID/${TC_REPO}/git/refs/heads/tc/pr-${PR_NUMBER}\"
          \`\`\`
          EOF
          )"
