name: TC Branch Finalize

on:
  pull_request_target:
    types: [closed]
    branches:
      - develop
      - 'release/11.**'
      - 'feature/**'
      - 'test/sync-tc'   # test only

concurrency:
  group: tc-branch-finalize
  cancel-in-progress: false

env:
  TC_PUB_REPO: tw-kang/cubrid-testcases
  TC_PRIV_REPO: tw-kang/cubrid-testcases-private-ex
  TC_BRANCH_PREFIX: tc/pr-

jobs:
  finalize-tc-branch:
    name: Finalize TC branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          owner: tw-kang
          repositories: "cubrid-testcases,cubrid-testcases-private-ex"

      - name: Merge TC branches into develop
        id: merge-tc
        if: github.event.pull_request.merged == true
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "::add-mask::${APP_TOKEN}"
          BRANCH="${TC_BRANCH_PREFIX}${PR_NUMBER}"
          OVERALL="success"

          for REPO in "${TC_PUB_REPO}" "${TC_PRIV_REPO}"; do
            KEY="pub"
            if [ "${REPO}" = "${TC_PRIV_REPO}" ]; then
              KEY="priv"
            fi

            REPO_URL="https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"

            if ! git ls-remote --exit-code --heads "${REPO_URL}" "${BRANCH}" 2>/dev/null; then
              echo "[info] Branch '${BRANCH}' not found in ${REPO}, nothing to merge"
              echo "${KEY}_merge_done=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_delete_failed=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_status=skipped" >> "${GITHUB_OUTPUT}"
              continue
            fi

            echo "[info] Merging '${BRANCH}' into develop in ${REPO}"
            DIR="tc-${KEY}"
            if ! git clone --branch develop "${REPO_URL}" "${DIR}"; then
              echo "[error] Failed to clone develop from ${REPO}"
              echo "${KEY}_merge_done=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_delete_failed=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_status=clone_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              continue
            fi

            cd "${DIR}"
            if ! git fetch origin "${BRANCH}:${BRANCH}"; then
              echo "[error] Failed to fetch '${BRANCH}' from ${REPO}"
              echo "${KEY}_merge_done=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_delete_failed=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_status=fetch_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              cd ..
              continue
            fi

            if ! git merge --no-ff "${BRANCH}" -m "Merge TC branch '${BRANCH}' into develop (Engine PR #${PR_NUMBER})"; then
              echo "[error] Failed to merge '${BRANCH}' into develop in ${REPO}"
              echo "${KEY}_merge_done=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_delete_failed=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_status=merge_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              cd ..
              continue
            fi

            if ! git push origin develop; then
              echo "[error] Failed to push develop to ${REPO}"
              echo "${KEY}_merge_done=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_delete_failed=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_status=push_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              cd ..
              continue
            fi

            echo "merge_done=true" >> "${GITHUB_OUTPUT}"
            echo "${KEY}_merge_done=true" >> "${GITHUB_OUTPUT}"

            if ! git push origin --delete "${BRANCH}"; then
              echo "[warn] Failed to delete '${BRANCH}' in ${REPO} after successful merge"
              echo "delete_failed=true" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_delete_failed=true" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_status=merged_delete_failed" >> "${GITHUB_OUTPUT}"
            else
              echo "[info] Deleted '${BRANCH}' in ${REPO}"
              echo "${KEY}_delete_failed=false" >> "${GITHUB_OUTPUT}"
              echo "${KEY}_status=merged_deleted" >> "${GITHUB_OUTPUT}"
            fi

            cd ..
          done

          if [ "${OVERALL}" != "success" ]; then
            exit 1
          fi

      - name: Fail if any merge step failed
        if: github.event.pull_request.merged == true && steps.merge-tc.outcome == 'failure'
        run: |
          echo "[error] One or more TC branch merge steps failed."
          echo "  cubrid-testcases            : ${{ steps.merge-tc.outputs.pub_status || 'unknown' }}"
          echo "  cubrid-testcases-private-ex : ${{ steps.merge-tc.outputs.priv_status || 'unknown' }}"
          exit 1

      - name: Post merge failure comment on PR
        if: failure() && github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUB_RESULT: ${{ steps.merge-tc.outputs.pub_status || 'unknown' }}
          PRIV_RESULT: ${{ steps.merge-tc.outputs.priv_status || 'unknown' }}
        run: |
          BODY=$(printf '❌ **TC Branch Finalize Failed** (PR #%s)\n\nFailed to finalize `tc/pr-%s` into `develop` (merge and/or delete) in one or more TC repositories:\n- `CUBRID/cubrid-testcases`: %s\n- `CUBRID/cubrid-testcases-private-ex`: %s\n\nThis may be due to a merge conflict, a delete failure, or a misconfigured GitHub App (`TC_APP_ID` / `TC_APP_PRIVATE_KEY`).\n**Manual action required**: please finalize the TC branch in develop and clean it up.\n\nWorkflow logs: %s' \
            "${PR_NUMBER}" "${PR_NUMBER}" "${PUB_RESULT}" "${PRIV_RESULT}" "${RUN_URL}")
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "${BODY}"

      - name: Delete TC branch (PR closed without merge)
        id: delete-branches
        if: github.event.pull_request.merged == false
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "::add-mask::${APP_TOKEN}"
          BRANCH="${TC_BRANCH_PREFIX}${PR_NUMBER}"
          REF="heads/${BRANCH}"

          # Use GitHub API (no git repo context needed)
          PUB_URL="https://x-access-token:${APP_TOKEN}@github.com/${TC_PUB_REPO}.git"
          if git ls-remote --exit-code --heads "${PUB_URL}" "${BRANCH}" 2>/dev/null; then
            curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${APP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TC_PUB_REPO}/git/refs/${REF}" | grep -qE '^2'
            echo "[info] Deleted '${BRANCH}' from ${TC_PUB_REPO}"
          else
            echo "[info] Branch '${BRANCH}' not found in ${TC_PUB_REPO}, skipping"
          fi
          PRIV_URL="https://x-access-token:${APP_TOKEN}@github.com/${TC_PRIV_REPO}.git"
          if git ls-remote --exit-code --heads "${PRIV_URL}" "${BRANCH}" 2>/dev/null; then
            curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${APP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TC_PRIV_REPO}/git/refs/${REF}" | grep -qE '^2'
            echo "[info] Deleted '${BRANCH}' from ${TC_PRIV_REPO}"
          else
            echo "[info] Branch '${BRANCH}' not found in ${TC_PRIV_REPO}, skipping"
          fi

      - name: Fail if delete step failed
        if: github.event.pull_request.merged == false && steps.delete-branches.outcome == 'failure'
        run: exit 1

      - name: Post delete failure comment on PR
        if: failure() && github.event.pull_request.merged == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf '⚠️ **TC Branch Delete Failed** (PR #%s)\n\nFailed to delete `tc/pr-%s` in one or more TC repositories.\nManual cleanup required.\n\nWorkflow logs: %s' \
            "${PR_NUMBER}" "${PR_NUMBER}" "${RUN_URL}")
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "${BODY}"