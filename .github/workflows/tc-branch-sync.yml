#
# TC Branch Sync — Create/revert TC branches for engine PRs
#
# Trigger: pull_request_target (opened, reopened)
#

name: TC Branch Sync

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {} # Least privilege — jobs opt-in below

concurrency:
  group: tc-branch-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  OWNER: tw-kang

jobs:
  # Parse PR metadata: type, header, original PR number
  detect-pr-type:
    name: Detect PR Type
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      is_revert: ${{ steps.detect.outputs.is_revert }}
      original_pr_number: ${{ steps.detect.outputs.original_pr_number }}
      pr_header: ${{ steps.detect.outputs.pr_header }}
    steps:
      - name: Parse PR body and title
        id: detect
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail

          # Extract header [CBRD-XXXX] from title
          PR_HEADER=$(echo "${PR_TITLE}" | grep -oE '^\[[A-Z]+-[0-9]+\]' || echo "")
          echo "pr_header=${PR_HEADER}" >> "${GITHUB_OUTPUT}"

          # Detect revert by "Revert" in title
          if echo "${PR_TITLE}" | grep -qi 'Revert'; then
            # Extract original PR number from body, fallback to title
            ORIGINAL_PR=$(echo "${PR_BODY}" | grep -oiE 'Reverts .*#[0-9]+' | grep -oE '[0-9]+' | head -1 || echo "")
            if [ -z "${ORIGINAL_PR}" ]; then
              ORIGINAL_PR=$(echo "${PR_TITLE}" | grep -oE '\(#[0-9]+\)' | grep -oE '[0-9]+' || echo "")
            fi
            echo "is_revert=true" >> "${GITHUB_OUTPUT}"
            echo "original_pr_number=${ORIGINAL_PR}" >> "${GITHUB_OUTPUT}"
            echo "::notice::Revert PR detected — reverting TC changes"
          else
            echo "is_revert=false" >> "${GITHUB_OUTPUT}"
            echo "original_pr_number=" >> "${GITHUB_OUTPUT}"
            echo "::notice::Normal PR — will create TC branch and draft PR"
          fi

  # Normal PR: create tc/pr-<N> branch from develop, create draft PR
  sync-tc-branch:
    name: Create TC Branch (${{ matrix.tc-repo }})
    needs: detect-pr-type
    if: needs.detect-pr-type.outputs.is_revert == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    strategy:
      matrix:
        tc-repo:
          - cubrid-testcases
          - cubrid-testcases-private-ex
      fail-fast: false
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.tc-repo }}
          owner: ${{ env.OWNER }}

      - name: Mask token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: echo "::add-mask::${APP_TOKEN}"

      - name: Create TC branch from develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TC_REPO: ${{ matrix.tc-repo }}
          OWNER: ${{ env.OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"

          # Skip if branch exists
          if gh api "repos/${OWNER}/${TC_REPO}/git/refs/heads/${BRANCH_NAME}" > /dev/null 2>&1; then
            echo "::notice::Branch '${BRANCH_NAME}' already exists in ${TC_REPO}. Skipping."
            exit 0
          fi

          # Create branch from develop HEAD
          DEVELOP_SHA=$(gh api "repos/${OWNER}/${TC_REPO}/git/refs/heads/develop" --jq '.object.sha')
          gh api "repos/${OWNER}/${TC_REPO}/git/refs" \
            --method POST \
            --field ref="refs/heads/${BRANCH_NAME}" \
            --field sha="${DEVELOP_SHA}"

          echo "::notice::Created '${BRANCH_NAME}' in ${TC_REPO} from develop (${DEVELOP_SHA:0:12})"

          # Add empty commit for PR creation
          git clone --branch "${BRANCH_NAME}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${TC_REPO}.git" \
            /tmp/tc-init-${TC_REPO} 2>/dev/null || true
          if [ -d "/tmp/tc-init-${TC_REPO}/.git" ]; then
            cd /tmp/tc-init-${TC_REPO}
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: Initialize TC branch for PR #${PR_NUMBER}"
            git push origin "${BRANCH_NAME}" --force
            echo "::notice::Added initial commit to ${BRANCH_NAME}"
          fi

      - name: Create draft PR in TC repo
        id: create-draft-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEADER: ${{ needs.detect-pr-type.outputs.pr_header }}
          TC_REPO: ${{ matrix.tc-repo }}
          ENGINE_REPO: ${{ github.repository }}
          OWNER: ${{ env.OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"
          
          if [ -n "${PR_HEADER}" ]; then
            DRAFT_TITLE="${PR_HEADER} Draft: TC branch for PR #${PR_NUMBER}"
          else
            DRAFT_TITLE="Draft: TC branch for PR #${PR_NUMBER}"
          fi
          
          # Create draft PR to develop
          PR_URL=$(gh pr create \
            --repo "${OWNER}/${TC_REPO}" \
            --head "${BRANCH_NAME}" \
            --base develop \
            --title "${DRAFT_TITLE}" \
            --body "This is a draft PR for testing TC changes.

            Related Engine PR: ${ENGINE_REPO}#${PR_NUMBER}
            TC Branch: ${BRANCH_NAME}
            
            This PR will be tested by CircleCI.
            Please review and merge manually when ready." \
            --draft)
          
          echo "::notice::Created draft PR: ${PR_URL}"
          echo "tc_draft_pr_url=${PR_URL}" >> "${GITHUB_OUTPUT}"
          echo "tc_draft_pr_number=$(echo ${PR_URL} | grep -oE '[0-9]+$')" >> "${GITHUB_OUTPUT}"

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TC_REPO: ${{ matrix.tc-repo }}
          ENGINE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${ENGINE_REPO}" \
            --body "⚠️ **TC Branch Sync Failed** for \`${TC_REPO}\`

          Failed to create \`tc/pr-${PR_NUMBER}\` branch or draft PR.
          Please check the [workflow run](${RUN_URL}) for details."

  # Revert PR: revert original TC merge commit, create open PR
  revert-tc-branch:
    name: Revert TC (${{ matrix.tc-repo }})
    needs: detect-pr-type
    if: needs.detect-pr-type.outputs.is_revert == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    strategy:
      matrix:
        tc-repo:
          - cubrid-testcases
          - cubrid-testcases-private-ex
      fail-fast: false
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.tc-repo }}
          owner: ${{ env.OWNER }}

      - name: Mask token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: echo "::add-mask::${APP_TOKEN}"

      - name: Revert TC merge commit
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORIGINAL_PR_NUMBER: ${{ needs.detect-pr-type.outputs.original_pr_number }}
          PR_HEADER: ${{ needs.detect-pr-type.outputs.pr_header }}
          TC_REPO: ${{ matrix.tc-repo }}
          OWNER: ${{ env.OWNER }}
        shell: bash
        run: |
          set -euo pipefail

          # Require original PR number
          if [ -z "${ORIGINAL_PR_NUMBER}" ]; then
            echo "::error::Missing original PR number (expected 'Reverts #N' in body)"
            exit 1
          fi

          BRANCH_NAME="tc/pr-${PR_NUMBER}"
          ORIGINAL_BRANCH="tc/pr-${ORIGINAL_PR_NUMBER}"

          # Clone TC repo with history
          git clone --filter=blob:none \
            "https://x-access-token:${APP_TOKEN}@github.com/${OWNER}/${TC_REPO}.git" \
            tc-repo
          cd tc-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout -B "${BRANCH_NAME}" origin/develop

          # Find merge commit for original PR -- has bug -- need to fix.
          MERGE_COMMIT=$(git log --format="%H" --grep="${ORIGINAL_BRANCH}" origin/develop -1 || echo "")

          if [ -n "${MERGE_COMMIT}" ]; then
            echo "::notice::Found merge commit ${MERGE_COMMIT:0:12} for '${ORIGINAL_BRANCH}'"

            # Try plain revert (squash), then -m 1 (merge)
            REVERT_OK=false
            if git revert --no-edit "${MERGE_COMMIT}" 2>/dev/null; then
              REVERT_OK=true
            else
              git revert --abort 2>/dev/null || true
              if git revert --no-edit -m 1 "${MERGE_COMMIT}" 2>/dev/null; then
                REVERT_OK=true
              else
                git revert --abort 2>/dev/null || true
              fi
            fi

            if [ "${REVERT_OK}" != "true" ]; then
              echo "::error::Revert conflict detected for commit ${MERGE_COMMIT:0:12}. Manual resolution required."
              exit 1
            fi

            if [ -n "${PR_HEADER}" ]; then
              CURRENT_MSG=$(git log -1 --format="%s")
              git commit --amend -m "${PR_HEADER} ${CURRENT_MSG}"
            fi
          else
            echo "::notice::No TC merge commit found for '${ORIGINAL_BRANCH}' in ${TC_REPO}. Creating empty revert branch."
          fi

          # Ensure commit exists for PR creation
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)" ]; then
            git commit --allow-empty -m "chore: No-op TC revert for engine PR #${PR_NUMBER} (reverts #${ORIGINAL_PR_NUMBER})"
            echo "::notice::Added empty commit to '${BRANCH_NAME}' (no changes to revert)."
          fi

          #need to fix.
          git push origin "${BRANCH_NAME}" --force

          echo "revert_branch_pushed=true" >> "${GITHUB_OUTPUT}"
          echo "revert_branch=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Pushed revert branch '${BRANCH_NAME}' to ${TC_REPO}"
        id: revert-commit

      - name: Create open PR for revert
        id: create-revert-pr
        if: steps.revert-commit.outputs.revert_branch_pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORIGINAL_PR_NUMBER: ${{ needs.detect-pr-type.outputs.original_pr_number }}
          PR_HEADER: ${{ needs.detect-pr-type.outputs.pr_header }}
          TC_REPO: ${{ matrix.tc-repo }}
          ENGINE_REPO: ${{ github.repository }}
          REVERT_BRANCH: ${{ steps.revert-commit.outputs.revert_branch }}
          OWNER: ${{ env.OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          
          if [ -n "${PR_HEADER}" ]; then
            PR_TITLE_TC="${PR_HEADER} Revert: TC branch for PR #${PR_NUMBER} (reverts #${ORIGINAL_PR_NUMBER})"
          else
            PR_TITLE_TC="Revert: TC branch for PR #${PR_NUMBER} (reverts #${ORIGINAL_PR_NUMBER})"
          fi
          
          # Reopen existing PR if closed
          EXISTING_PR=$(gh pr list --repo "${OWNER}/${TC_REPO}" --head "${REVERT_BRANCH}" --state all --json number,state --jq '.[0]' || echo "")
          if [ -n "${EXISTING_PR}" ]; then
            PR_NUM=$(echo "${EXISTING_PR}" | jq -r '.number')
            PR_STATE=$(echo "${EXISTING_PR}" | jq -r '.state')
            if [ "${PR_STATE}" = "CLOSED" ]; then
              echo "::notice::Reopening closed PR #${PR_NUM} for ${REVERT_BRANCH}"
              gh pr reopen --repo "${OWNER}/${TC_REPO}" "${PR_NUM}"
            else
              echo "::notice::Open PR #${PR_NUM} already exists for ${REVERT_BRANCH}"
            fi
            PR_URL="${GITHUB_SERVER_URL}/${OWNER}/${TC_REPO}/pull/${PR_NUM}"
            echo "tc_revert_pr_url=${PR_URL}" >> "${GITHUB_OUTPUT}"
            echo "tc_revert_pr_number=${PR_NUM}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          
          # Create open PR to develop
          PR_URL=$(gh pr create \
            --repo "${OWNER}/${TC_REPO}" \
            --head "${REVERT_BRANCH}" \
            --base develop \
            --title "${PR_TITLE_TC}" \
            --body "This PR reverts TC changes from PR #${ORIGINAL_PR_NUMBER}.

          Related Engine Revert PR: ${ENGINE_REPO}#${PR_NUMBER}
          TC Branch: ${REVERT_BRANCH}

          **Please merge this PR FIRST, then merge the engine revert PR.**")
          
          echo "::notice::Created open PR: ${PR_URL}"
          echo "tc_revert_pr_url=${PR_URL}" >> "${GITHUB_OUTPUT}"
          echo "tc_revert_pr_number=$(echo ${PR_URL} | grep -oE '[0-9]+$')" >> "${GITHUB_OUTPUT}"

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORIGINAL_PR_NUMBER: ${{ needs.detect-pr-type.outputs.original_pr_number }}
          TC_REPO: ${{ matrix.tc-repo }}
          ENGINE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${ENGINE_REPO}" \
            --body "⚠️ **TC Revert Failed** for \`${TC_REPO}\`

          Could not automatically revert TC changes from PR #${ORIGINAL_PR_NUMBER}.
          This may be due to a merge conflict requiring manual resolution.

          **Manual steps:**
          1. Clone the TC repo and create \`tc/pr-${PR_NUMBER}\` from develop
          2. Find the merge commit for \`tc/pr-${ORIGINAL_PR_NUMBER}\` and revert it
          3. Push the branch

          See [workflow run](${RUN_URL}) for details."

  # Comment TC info on engine PR (normal PR)
  comment-on-engine-pr:
    name: Comment on Engine PR
    needs: [detect-pr-type, sync-tc-branch]
    if: needs.detect-pr-type.outputs.is_revert == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment TC branch info on engine PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENGINE_REPO: ${{ github.repository }}
          OWNER: ${{ env.OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"

          COMMENT_BODY=$(cat <<EOF
          ## 🧪 TC Test Environment Ready

          **TC Branch:** \`${BRANCH_NAME}\`

          **TC Repositories:**
          - [cubrid-testcases](https://github.com/${OWNER}/cubrid-testcases/tree/${BRANCH_NAME})
          - [cubrid-testcases-private-ex](https://github.com/${OWNER}/cubrid-testcases-private-ex/tree/${BRANCH_NAME})

          **CircleCI Testing:**
          - CircleCI will automatically test using TC branch \`${BRANCH_NAME}\`

          **Next Steps:**
          1. Wait for CircleCI tests to complete
          2. When ready to merge this PR, the TC branch will be processed automatically
          EOF
          )

          gh pr comment "${PR_NUMBER}" \
            --repo "${ENGINE_REPO}" \
            --body "${COMMENT_BODY}"

  # Comment TC info on engine PR (revert PR)
  comment-on-engine-pr-revert:
    name: Comment Revert PR Links
    needs: [detect-pr-type, revert-tc-branch]
    if: needs.detect-pr-type.outputs.is_revert == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment TC branch info on engine PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENGINE_REPO: ${{ github.repository }}
          OWNER: ${{ env.OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="tc/pr-${PR_NUMBER}"

          COMMENT_BODY=$(cat <<EOF
          ## 🔄 TC Revert Environment Ready

          **TC Branch:** \`${BRANCH_NAME}\`

          **TC Repositories:**
          - [cubrid-testcases](https://github.com/${OWNER}/cubrid-testcases/tree/${BRANCH_NAME})
          - [cubrid-testcases-private-ex](https://github.com/${OWNER}/cubrid-testcases-private-ex/tree/${BRANCH_NAME})

          **CircleCI Testing:**
          - CircleCI will automatically test using TC branch \`${BRANCH_NAME}\`

          **Next Steps:**
          1. Wait for CircleCI tests to complete
          2. When ready to merge this revert PR, the TC branch will be processed automatically
          EOF
          )

          gh pr comment "${PR_NUMBER}" \
            --repo "${ENGINE_REPO}" \
            --body "${COMMENT_BODY}"
