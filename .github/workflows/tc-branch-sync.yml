name: TC Branch Sync

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - develop
      - 'release/11.**'
      - 'feature/**'
      - 'test/sync-tc'   # test only

concurrency:
  group: tc-branch-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TC_PUB_REPO: tw-kang/cubrid-testcases
  TC_PRIV_REPO: tw-kang/cubrid-testcases-private-ex
  TC_BRANCH_PREFIX: tc/pr-

jobs:
  sync-tc-branch:
    name: Sync TC branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Detect revert PR
        id: detect
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # GitHub revert PRs include "Reverts owner/repo#N" or "Reverts #N" in body
          ORIGINAL_PR=$(printf '%s' "${PR_BODY}" | grep -oE 'Reverts [^#]*#([0-9]+)' | grep -oE '[0-9]+$' | head -1)
          if [ -z "${ORIGINAL_PR}" ]; then
            echo "[info] Not a revert PR, will create empty TC branch"
            echo "is_revert=false" >> "${GITHUB_OUTPUT}"
          else
            echo "[info] Detected revert PR: reverts engine PR #${ORIGINAL_PR}"
            echo "is_revert=true" >> "${GITHUB_OUTPUT}"
            echo "original_pr=${ORIGINAL_PR}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          owner: tw-kang
          repositories: "cubrid-testcases,cubrid-testcases-private-ex"

      # ──────────────────────────────────────────────────────────────────────
      # Normal PR: create empty tc/pr-<N> branch from develop (idempotent)
      # ──────────────────────────────────────────────────────────────────────

      - name: Sync TC branches
        id: sync-tc
        if: steps.detect.outputs.is_revert == 'false'
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "::add-mask::${APP_TOKEN}"
          BRANCH="${TC_BRANCH_PREFIX}${PR_NUMBER}"
          OVERALL="success"

          for REPO in "${TC_PUB_REPO}" "${TC_PRIV_REPO}"; do
            KEY="pub"
            if [ "${REPO}" = "${TC_PRIV_REPO}" ]; then
              KEY="priv"
            fi

            REPO_URL="https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
            echo "[info] Syncing TC branch '${BRANCH}' in ${REPO}"

            if git ls-remote --exit-code --heads "${REPO_URL}" "${BRANCH}" 2>/dev/null; then
              echo "[info] Branch '${BRANCH}' already exists in ${REPO}, skipping"
              echo "${KEY}_sync_status=exists" >> "${GITHUB_OUTPUT}"
              continue
            fi

            DIR="tc-${KEY}"
            if ! git clone --depth=1 --branch develop "${REPO_URL}" "${DIR}"; then
              echo "[error] Failed to clone develop from ${REPO}"
              echo "${KEY}_sync_status=clone_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              continue
            fi

            cd "${DIR}"
            if ! git checkout -b "${BRANCH}"; then
              echo "[error] Failed to create branch '${BRANCH}' in ${REPO}"
              echo "${KEY}_sync_status=checkout_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              cd ..
              continue
            fi

            if ! git push origin "${BRANCH}"; then
              echo "[error] Failed to push branch '${BRANCH}' to ${REPO}"
              echo "${KEY}_sync_status=push_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              cd ..
              continue
            fi

            echo "[info] Branch '${BRANCH}' created successfully in ${REPO}"
            echo "${KEY}_sync_status=created" >> "${GITHUB_OUTPUT}"
            cd ..
          done

          if [ "${OVERALL}" != "success" ]; then
            exit 1
          fi

      - name: Fail if any sync step failed
        if: steps.detect.outputs.is_revert == 'false' && steps.sync-tc.outcome == 'failure'
        run: |
          echo "[error] One or more TC branch sync steps failed."
          echo "  cubrid-testcases            : ${{ steps.sync-tc.outputs.pub_sync_status || 'unknown' }}"
          echo "  cubrid-testcases-private-ex : ${{ steps.sync-tc.outputs.priv_sync_status || 'unknown' }}"
          exit 1

      # ──────────────────────────────────────────────────────────────────────
      # Revert PR: find original merge commit and push revert commit to tc/pr-<N>
      # ──────────────────────────────────────────────────────────────────────

      - name: Revert TC changes
        id: revert-tc
        if: steps.detect.outputs.is_revert == 'true'
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ORIGINAL_PR: ${{ steps.detect.outputs.original_pr }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "::add-mask::${APP_TOKEN}"
          ORIG_BRANCH="${TC_BRANCH_PREFIX}${ORIGINAL_PR}"
          REVERT_BRANCH="${TC_BRANCH_PREFIX}${PR_NUMBER}"
          OVERALL="success"

          # Extract header like [CBRD-1234] from PR title (fallback: full title)
          HEADER=$(printf '%s\n' "${PR_TITLE}" | grep -oE '^\[[^]]+\]' || printf '%s\n' "${PR_TITLE}")

          for REPO in "${TC_PUB_REPO}" "${TC_PRIV_REPO}"; do
            KEY="pub"
            if [ "${REPO}" = "${TC_PRIV_REPO}" ]; then
              KEY="priv"
            fi

            REPO_URL="https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
            DIR="tc-revert-${KEY}"

            if ! git clone --branch develop "${REPO_URL}" "${DIR}"; then
              echo "[error] Failed to clone develop from ${REPO}"
              echo "${KEY}_status=clone_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              continue
            fi

            cd "${DIR}"

            MERGE_COMMIT=$(git log --grep="Merge TC branch '${ORIG_BRANCH}' into develop" --format="%H" -1)
            if [ -z "${MERGE_COMMIT}" ]; then
              echo "[info] No TC merge commit found for PR #${ORIGINAL_PR} in ${REPO}, nothing to revert"
              echo "${KEY}_status=no_tc_changes" >> "${GITHUB_OUTPUT}"
              cd ..
              continue
            fi

            echo "[info] Found merge commit ${MERGE_COMMIT} for PR #${ORIGINAL_PR} in ${REPO}"
            if ! git revert --no-commit -m 1 "${MERGE_COMMIT}"; then
              git reset --hard HEAD
              echo "[warn] Revert has conflicts in ${REPO}, manual action required"
              echo "${KEY}_status=conflict" >> "${GITHUB_OUTPUT}"
              cd ..
              continue
            fi
            if ! git commit -m "${HEADER} Revert TC changes for engine PR #${ORIGINAL_PR} (reverted by engine PR #${PR_NUMBER})"; then
              echo "[error] Failed to create revert commit in ${REPO}"
              echo "${KEY}_status=commit_failed" >> "${GITHUB_OUTPUT}"
              OVERALL="failure"
              cd ..
              continue
            fi

            if git ls-remote --exit-code --heads "${REPO_URL}" "${REVERT_BRANCH}" 2>/dev/null; then
              if ! git push origin "HEAD:refs/heads/${REVERT_BRANCH}" --force; then
                echo "[error] Failed to force-push revert commit to existing branch '${REVERT_BRANCH}' in ${REPO}"
                echo "${KEY}_status=push_failed" >> "${GITHUB_OUTPUT}"
                OVERALL="failure"
                cd ..
                continue
              fi
              echo "[info] Force-pushed revert commit to existing branch '${REVERT_BRANCH}' in ${REPO}"
            else
              if ! git checkout -b "${REVERT_BRANCH}"; then
                echo "[error] Failed to create revert branch '${REVERT_BRANCH}' in ${REPO}"
                echo "${KEY}_status=checkout_failed" >> "${GITHUB_OUTPUT}"
                OVERALL="failure"
                cd ..
                continue
              fi
              if ! git push origin "${REVERT_BRANCH}"; then
                echo "[error] Failed to push revert branch '${REVERT_BRANCH}' to ${REPO}"
                echo "${KEY}_status=push_failed" >> "${GITHUB_OUTPUT}"
                OVERALL="failure"
                cd ..
                continue
              fi
              echo "[info] Created branch '${REVERT_BRANCH}' with revert commit in ${REPO}"
            fi
            echo "${KEY}_status=applied" >> "${GITHUB_OUTPUT}"
            cd ..
          done

          if [ "${OVERALL}" != "success" ]; then
            exit 1
          fi

      - name: Post comment on revert PR
        if: steps.detect.outputs.is_revert == 'true' && steps.revert-tc.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORIGINAL_PR: ${{ steps.detect.outputs.original_pr }}
          PUB_STATUS: ${{ steps.revert-tc.outputs.pub_status }}
          PRIV_STATUS: ${{ steps.revert-tc.outputs.priv_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${PUB_STATUS}" = "conflict" ] || [ "${PRIV_STATUS}" = "conflict" ]; then
            BODY=$(printf '⚠️ **TC Revert Conflict** (PR #%s)\n\nCould not automatically revert TC changes for engine PR #%s due to merge conflicts:\n- `CUBRID/cubrid-testcases`: %s\n- `CUBRID/cubrid-testcases-private-ex`: %s\n\n**Manual action required**: please manually revert TC changes in `tc/pr-%s`.\n\nWorkflow logs: %s' \
              "${PR_NUMBER}" "${ORIGINAL_PR}" "${PUB_STATUS}" "${PRIV_STATUS}" "${PR_NUMBER}" "${RUN_URL}")
          elif [ "${PUB_STATUS}" = "no_tc_changes" ] && [ "${PRIV_STATUS}" = "no_tc_changes" ]; then
            exit 0
          else
            BODY=$(printf 'ℹ️ **TC Revert Applied** (PR #%s)\n\nTC changes from engine PR #%s have been automatically reverted in `tc/pr-%s`:\n- `CUBRID/cubrid-testcases`: %s\n- `CUBRID/cubrid-testcases-private-ex`: %s\n\nWhen this revert PR is merged, the TC revert will be auto-merged into `develop` by the finalize workflow.\n\nWorkflow logs: %s' \
              "${PR_NUMBER}" "${ORIGINAL_PR}" "${PR_NUMBER}" "${PUB_STATUS}" "${PRIV_STATUS}" "${RUN_URL}")
          fi
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "${BODY}"

      - name: Fail if revert step failed
        if: steps.detect.outputs.is_revert == 'true' && steps.revert-tc.outcome == 'failure'
        run: |
          echo "[error] One or more TC revert steps failed."
          exit 1

      # ──────────────────────────────────────────────────────────────────────
      # Common failure handler
      # ──────────────────────────────────────────────────────────────────────

      - name: Post failure comment on PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORIGINAL_PR: ${{ steps.detect.outputs.original_pr }}
          IS_REVERT: ${{ steps.detect.outputs.is_revert }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUB_RESULT: ${{ steps.detect.outputs.is_revert == 'true' && steps.revert-tc.outputs.pub_status || steps.sync-tc.outputs.pub_sync_status }}
          PRIV_RESULT: ${{ steps.detect.outputs.is_revert == 'true' && steps.revert-tc.outputs.priv_status || steps.sync-tc.outputs.priv_sync_status }}
        run: |
          if [ "${IS_REVERT}" = "true" ]; then
            BODY=$(printf '⚠️ **TC Revert Failed** (PR #%s)\n\nFailed to process TC revert for engine PR #%s:\n- `CUBRID/cubrid-testcases`: %s\n- `CUBRID/cubrid-testcases-private-ex`: %s\n\nThe GitHub App (`TC_APP_ID` / `TC_APP_PRIVATE_KEY`) may be misconfigured.\n\nWorkflow logs: %s' \
              "${PR_NUMBER}" "${ORIGINAL_PR}" "${PUB_RESULT}" "${PRIV_RESULT}" "${RUN_URL}")
          else
            BODY=$(printf '⚠️ **TC Branch Sync Failed** (PR #%s)\n\nFailed to create `tc/pr-%s` in one or more TC repositories:\n- `CUBRID/cubrid-testcases`: %s\n- `CUBRID/cubrid-testcases-private-ex`: %s\n\nThe GitHub App (`TC_APP_ID` / `TC_APP_PRIVATE_KEY`) may be misconfigured.\n\nWorkflow logs: %s' \
              "${PR_NUMBER}" "${PR_NUMBER}" "${PUB_RESULT}" "${PRIV_RESULT}" "${RUN_URL}")
          fi
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "${BODY}"
