# CUBRIDQA-1526 -- build, publish, then run the shell suite on self-hosted runners.
# Replaces the CircleCI jobs build + build_debug + download-build + test_shell.
# Both stay live during the migration, so one /run comment can be compared.
#
# Trigger, and what each one runs.
#
#   issue_comment  /run <suites>       build, then those suites on the debug build
#   push develop, feature/**           build only. develop also writes the ccache
#   workflow_dispatch                  build; one suite always runs, or all three
#   schedule                           the nightly batch, one dispatch per merge
#
# <suites> is any of shell, sql and medium, and `all` means all three. Everything that
# differs between them is one table, the `SUITES` env below; plan and collect walk it
# inside a single job, shard is a matrix over (suite, index), and each suite posts its
# own commit status. workflow_dispatch takes one suite, or `all`; with `all` it takes
# neither parallelism nor rerun_from, so both stay unambiguous.
#
# Any request that runs a suite takes an optional trailing testtools=<branch> --
# `/run shell testtools=fix/x` or the dispatch input -- and then CTP comes from that
# cubrid-testtools branch instead of the image's develop. CircleCI's comment_trigger.yml
# does not know the key, so a comment carrying it never reaches CircleCI.
#
# Which copy of this file runs differs by trigger. issue_comment has no ref of its
# own and always reads the DEFAULT BRANCH, so /run does nothing until this is merged.
# workflow_dispatch runs the copy in the ref it is given, and appears in the UI only
# once the default branch carries the file. push runs the pushed commit's copy, and
# schedule the default branch's -- so the batch dispatches on its own ref.
#
# Three self-hosted runner lanes: cubrid-arc-light (plan, collect, a re-run's one
# shard, medium), cubrid-arc-build (build), cubrid-arc (shell and sql shards).
# Without the split a one-minute job queues behind another run's 50.
#
# Prerequisites in the runner, not here. circleci-k8s-ansible roles/arc owns
# them; its README.md carries the full contract table for this file.
#   pod template   shareProcessNamespace, or the shell tests hang instead of
#                  failing; privileged, or the overlay mount fails;
#                  imagePullPolicy Always, or nodes keep a stale image
#   job hook       ALLOWED_EVENTS must list issue_comment, push and
#                  workflow_dispatch
#
# Decisions, measurements and the ccache/path contract: CUBRIDQA-1526, and
# roles/arc/README.md in circleci-k8s-ansible.

name: gha-ci

# The run title leads with the pull request, "PR #7941 · <title>".
run-name: >-
  ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null
  && format('PR #{0} · {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'workflow_dispatch' && inputs.pr != ''
  && format('PR #{0} · dispatch {1} {2}', inputs.pr, inputs.suite, inputs.sha)
  || github.event_name == 'workflow_dispatch'
  && format('dispatch {0} {1}', inputs.suite, inputs.sha)
  || '' }}

on:
  # Which comments wake this is decided by the gate job; it cannot be narrowed here.
  issue_comment:
    types: [created, edited]
  # Post-merge build. Only develop refreshes the ccache.
  push:
    branches: [develop, 'feature/**']
  # 00:20 KST: past the day's last develop merge (13Z), before the next day's first
  # (00Z), and off the hour, where cron queues longest.
  schedule:
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: "Engine commit to test: full 40-char SHA. Empty only with nightly"
        required: false
        default: ""
        type: string
      force_build:
        description: "Rebuild even when this SHA is already published"
        required: false
        default: false
        type: boolean
      suite:
        description: "Which suite to run. `all` is the batch's shape and takes no parallelism"
        required: false
        default: shell
        type: choice
        options: [shell, sql, medium, all]
      parallelism:
        description: "Shard count, 1..256. Empty means the suite's default (shell 50, sql 10, medium 1)"
        required: false
        default: ""
        type: string
      limit:
        description: "Cap on case count; 0 means all of them"
        required: false
        default: "0"
        type: string
      rerun_from:
        description: "Re-run only the cases that failed in this run id. Takes precedence over limit"
        required: false
        default: ""
        type: string
      sabotage:
        description: "Break the split on purpose to check the guards: none | empty-shard | lose-shard | kill-shard"
        required: false
        default: "none"
        type: string
      pr:
        description: "Engine PR number. Testcases come from tc/pr-<number> and results are posted there"
        required: false
        default: ""
        type: string
      testtools:
        description: "cubrid-testtools branch to take CTP from; empty means develop"
        required: false
        default: ""
        type: string
      nightly:
        description: "Batch. With sha empty: rehearse the batch. With sha set: test that develop commit and post its statuses"
        required: false
        default: false
        type: boolean

# shard is 50 privileged pods running testcase code; it holds no token at all.
permissions: {} # jobs opt-in below

# One group per kind of request, so unrelated ones never cancel each other. Every
# comment starts this workflow, so a comment that asks for nothing must land alone or
# it cancels a running suite. push is keyed on the SHA and not the ref: one group per
# ref holds every develop merge, and with one run pending per group the third merge
# drops the second. dispatch is keyed on the SHA because two force_build dispatches for
# one SHA would race the republish and pull the overlay lowerdir from a running shard.
# The run group is per pull request because a comment carries no head SHA, and it tests
# issue.pull_request the way the gate does -- issues share the PR number space. A rerun
# shares that group: both post the same commit status, so two in flight would race it,
# and CircleCI cannot reach that state -- there a rerun starts from a finished workflow. Every
# suite shares that one group: `/run all` posts all three contexts, so a concurrent `/run sql`
# would race it on `gha-ci: test_sql`.
concurrency:
  group: >-
    gha-ci-${{ github.event_name == 'push'
    && format('push-{0}', github.sha)
    || github.event_name == 'workflow_dispatch'
    && format('dispatch-{0}', inputs.sha)
    || github.event.issue.pull_request != null
    && startsWith(github.event.comment.body, '/run')
    && contains(github.event.comment.body, 'rerun')
    && format('pr-{0}-run', github.event.issue.number)
    || github.event.issue.pull_request != null
    && startsWith(github.event.comment.body, '/run')
    && (contains(github.event.comment.body, 'shell')
    || contains(github.event.comment.body, 'sql')
    || contains(github.event.comment.body, 'medium')
    || contains(github.event.comment.body, 'all'))
    && format('pr-{0}-run', github.event.issue.number)
    || github.run_id }}
  # A develop push publishes the preserved artifact and refreshes the ccache, so the
  # next merge must not cancel it. Everything else supersedes its own predecessor.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CTX_BUILD_RELEASE: "gha-ci: build (release)"
  CTX_BUILD_DEBUG: "gha-ci: build (debug)"
  CI_ROOT: /home/ci/shared
  CI_BUILD_ROOT: /home/ci/shared/builds
  TIMINGS: /home/ci/shared/timings/shell.tsv
  # Per attempt: run_id does not change on a re-run, so attempt 2 would read the
  # stamps attempt 1 left and subtract times taken in different attempts.
  STAMPS: /home/ci/shared/runs/${{ github.run_id }}/stamps/${{ github.run_attempt }}
  # CTP, like the testcases below, comes from the node copy the gha-node-seed
  # DaemonSet refreshes hourly: every byte a test reads is node-local, and the
  # volume carries only what two nodes must share -- CUBRIDQA-1501 ticket 72.
  CTP_SEED: /home/ci/seed/test/cubrid-testtools
  BUILD_SENTINEL: .complete
  BUILD_META: .gha-ci-build.meta
  # Paired with arc_artifact_server_node_port in circleci-k8s-ansible.
  ARTIFACT_URL_BASE: http://192.168.1.48:30080
  # One table for plan, shard, collect and the two status jobs, the way the test
  # image's resolve_category is one table for the whole entrypoint. No job below
  # names a suite outside this block.
  #
  #   tc_seed     the node copy the testcases are overlay-mounted from. The
  #               DaemonSet refreshes it hourly and the pod has it read-only
  #   unit        what one line of a shard's share file holds, and so what the
  #               split moves around: one case, or one top-level directory.
  #   case_glob   find -path pattern that names one case file
  #   case_filter perl regex a case path must also match; shell alone has one,
  #               because there a case is <name>/cases/<name>.sh
  #   runner      which lane a shard of this suite queues in. Expected duration,
  #               not resource use: the queue is FIFO and a one-minute job holds
  #               the same slot as a 28-minute one -- CUBRIDQA-1501 ticket 62
  SUITES: |-
    {
      "shell": {
        "tc_repo": "cubrid-testcases-private-ex", "tc_private": "yes",
        "tc_seed": "/home/ci/seed/test/cubrid-testcases-private-ex",
        "ctp_cmd": "shell", "ctp_conf": "conf/shell_ci.conf",
        "xml_src": "result/shell/current_runtime_logs",
        "verdict_src": "test_status.data",
        "unit": "case", "par_default": "50",
        "runner": "cubrid-arc",
        "case_glob": "*/cases/*.sh", "case_filter": "/([^/]+)/cases/\\1\\.sh$",
        "exclude": "_25_unstable", "status_ctx": "gha-ci: test_shell"
      },
      "sql": {
        "tc_repo": "cubrid-testcases", "tc_private": "no",
        "tc_seed": "/home/ci/seed/test/cubrid-testcases",
        "ctp_cmd": "sql", "ctp_conf": "conf/sql.conf",
        "xml_src": "sql/result",
        "verdict_src": "summary_info",
        "unit": "dir", "par_default": "10",
        "runner": "cubrid-arc",
        "case_glob": "*/cases/*.sql", "case_filter": "",
        "exclude": "", "status_ctx": "gha-ci: test_sql"
      },
      "medium": {
        "tc_repo": "cubrid-testcases", "tc_private": "no",
        "tc_seed": "/home/ci/seed/test/cubrid-testcases",
        "ctp_cmd": "medium", "ctp_conf": "conf/medium_dev.conf",
        "xml_src": "sql/result",
        "verdict_src": "summary_info",
        "unit": "dir", "par_default": "1",
        "runner": "cubrid-arc-light",
        "case_glob": "*/cases/*.sql", "case_filter": "",
        "exclude": "", "status_ctx": "gha-ci: test_medium"
      }
    }

jobs:
  # All three triggers become one shape: every job below reads needs.gate.outputs and
  # never looks at the event, so adding a trigger means editing this job only.
  # GitHub-hosted, so the permission decision lands before a runner is claimed.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # a batch child reads its engine commit's date
      pull-requests: read # the head SHA of the commented PR
      actions: read # a re-run reads the source run's jobs to learn which suites failed
    # Only the comment path needs an author check -- it is the one event anyone with
    # read access can raise. Same author set as comment_trigger.yml; CONTRIBUTOR is
    # refused. push and workflow_dispatch already require write access.
    if: >-
      ${{ github.event_name != 'issue_comment'
      || (github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/run')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) }}
    outputs:
      run: ${{ steps.g.outputs.run }}
      test: ${{ steps.g.outputs.test }} # only the comment path and dispatch run tests
      suites: ${{ steps.g.outputs.suites }} # JSON array, the matrix plan and shard run over
      sha: ${{ steps.g.outputs.sha }}
      pr: ${{ steps.g.outputs.pr }}
      post_status: ${{ steps.g.outputs.post_status }} # which runs paint a commit
      build_ns: ${{ steps.g.outputs.build_ns }} # develop | pr -- artifacts stay apart
      cache_write: ${{ steps.g.outputs.cache_write }} # ccache is written on develop only
      parallelism: ${{ steps.g.outputs.parallelism }}
      limit: ${{ steps.g.outputs.limit }}
      force_build: ${{ steps.g.outputs.force_build }}
      rerun_from: ${{ steps.g.outputs.rerun_from }}
      sabotage: ${{ steps.g.outputs.sabotage }}
      testtools: ${{ steps.g.outputs.testtools }} # CTP branch; empty means develop
      tc_until: ${{ steps.g.outputs.tc_until }} # batch child: testcases as of this instant
    steps:
      - name: Resolve the trigger
        id: g
        env:
          # Inputs arrive through env, never interpolated into the script body.
          EV: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          PUSH_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          IN_SHA: ${{ inputs.sha }}
          IN_PR: ${{ inputs.pr }}
          IN_SUITE: ${{ inputs.suite }}
          IN_PAR: ${{ inputs.parallelism }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_FORCE: ${{ inputs.force_build }}
          IN_RERUN: ${{ inputs.rerun_from }}
          IN_SAB: ${{ inputs.sabotage }}
          IN_TT: ${{ inputs.testtools }}
          IN_NIGHTLY: ${{ inputs.nightly }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # Knobs no path but workflow_dispatch exposes. plan clamps parallelism when
          # rerun_from is set, so both rerun paths land on one shard. An empty parallelism
          # means the suite's own default, which only plan knows.
          par=''; limit=0; force=false; rerun=''; sab=none; tt=''
          # Builds only, PR namespace, ccache read-only. Each branch below narrows this.
          test_run=false; pr=''; ns='pr'; cache_write=false; sel=''

          case "$EV" in
            schedule)
              echo "schedule: nightly batch -- the nightly job does it"
              emit run false
              exit 0
              ;;

            push)
              sha="$PUSH_SHA"
              # develop is the only ref that refreshes the shared ccache and lands in
              # the preserved namespace. feature/** builds like a PR.
              if [ "$REF" = 'refs/heads/develop' ]; then
                ns=develop
                cache_write=true
              fi
              echo "push: ${REF} / ${sha} / build only"
              ;;

            workflow_dispatch)
              if [ "$IN_NIGHTLY" = true ] && [ -z "$IN_SHA" ]; then
                echo "dispatch: nightly batch -- the nightly job does it"
                emit run false
                exit 0
              fi
              # A dispatch supplies every value; pass them through.
              sha="$IN_SHA"; pr="$IN_PR"
              par="$IN_PAR"; limit="$IN_LIMIT"; force="$IN_FORCE"
              rerun="$IN_RERUN"; sab="$IN_SAB"; tt="$IN_TT"
              # `all` refuses parallelism and rerun_from: one number cannot serve three
              # widths, and a re-run takes its suites from the run it names. limit is a
              # per-suite cap either way. The choice input constrains the UI, not the API.
              sel="${IN_SUITE:-shell}"
              case "$sel" in
                shell|sql|medium) ;;
                all)
                  if [ -n "$par" ] || [ -n "$rerun" ]; then
                    echo "::error::suite=all takes neither parallelism nor rerun_from"; exit 1
                  fi
                  sel="medium shell sql" ;; # the order `/run all` lands on
                *) echo "::error::suite must be shell, sql, medium or all, got: ${sel}"; exit 1 ;;
              esac
              test_run=true
              # Already on develop: read the artifact its push published, not a second
              # copy in the pull request namespace.
              if [ "$IN_NIGHTLY" = true ]; then ns=develop; fi
              echo "dispatch: sha=${sha} pr=${pr:-(none)} suite=$(echo $sel) nightly=${IN_NIGHTLY:-false} parallelism=${par:-(suite default)}"
              ;;

            issue_comment)
              pr="$ISSUE"
              # The body ends in CRLF, and CR is not an IFS character: left in, it rides
              # on the last suite word below and fails its case match, so a comment that
              # used to be ignored would run nothing and say nothing. The newline is why
              # both grammars end in [[:space:]]*$.
              req=$(printf '%s' "$BODY" | tr -d '\r')
              # A trailing testtools=<branch> is taken off first, so both grammars below
              # read the request without it and neither regex had to change.
              if [[ "$req" =~ ^(/run[[:space:]].*)[[:space:]]+testtools=([^[:space:]]+)[[:space:]]*$ ]]; then
                req="${BASH_REMATCH[1]}"
                tt="${BASH_REMATCH[2]}"
                echo "comment: CTP from cubrid-testtools branch ${tt}"
              fi
              # Checked before the shared grammar so that regex can stay byte-identical
              # to comment_trigger.yml. The run id comes from the comment collect posts.
              if [[ "$req" =~ ^/run[[:space:]]+rerun[[:space:]]+([0-9]{1,20})[[:space:]]*$ ]]; then
                rerun="${BASH_REMATCH[1]}"
                # Which suites to re-run is not in the comment, and this job cannot
                # read the run directory. The source run's job names carry it --
                # `shard <suite> <index>`. A suite whose shards all passed has
                # nothing to carry, so it is left alone and its status untouched.
                runjobs=$(gh api --paginate "repos/${REPO}/actions/runs/${rerun}/jobs?per_page=100" \
                  --jq '.jobs[] | select(.name | startswith("shard ")) | [.conclusion, .name] | @tsv') || {
                  echo "::error::could not read the jobs of run ${rerun}"; exit 1; }
                known=$(jq -r 'keys | join("|")' <<<"$SUITES")
                sel=$(printf '%s\n' "$runjobs" \
                  | awk -F'\t' -v k="^(${known})$" \
                        '$1 != "success" {split($2, a, " "); if (a[2] ~ k) print a[2]}' \
                  | sort -u)
                if [ -z "$sel" ]; then
                  echo "::error::run ${rerun} left no failed shard to re-run"
                  echo "  Either every shard passed, or that run is older than per-suite"
                  echo "  shard names. For a full run use /run shell, /run sql or /run all."
                  emit run false
                  exit 0
                fi
                test_run=true
                echo "comment: re-run the failures of run ${rerun} / suites: $(echo $sel)"
              # Regex must stay identical to comment_trigger.yml: one syntax to learn.
              elif [[ "$req" =~ ^/run([[:space:]]+(all|shell|sql|medium)){1,4}[[:space:]]*$ ]]; then
                for w in $req; do
                  case "$w" in
                    all)              sel="shell sql medium" ;;
                    shell|sql|medium) sel="$sel $w" ;;
                  esac
                done
                # `/run all shell` must not be two shell suites, and the matrix order has
                # to be the same every run for the logs to be comparable.
                sel=$(printf '%s\n' $sel | sort -u)
                test_run=true
                echo "comment: PR #${pr} / suites: $(echo $sel)"
              else
                echo "[info] not /run syntax, ignoring: $BODY"
                emit run false
                exit 0
              fi
              # Pin the head commit. A branch name is a moving target. The base ref
              # comes along in the same call: issue_comment takes no branches: filter,
              # so the base branch range is enforced here or nowhere.
              pull=$(gh api "repos/${REPO}/pulls/${pr}" --jq '[.head.sha, .base.ref] | @tsv') || {
                echo "::error::could not read PR ${pr}"; exit 1; }
              sha=$(printf '%s' "$pull" | cut -f1)
              base=$(printf '%s' "$pull" | cut -f2)
              echo "comment: base branch ${base}"
              # Same range as the push trigger's branches: filter. release/11.x
              # builds against a different toolchain, so this image cannot test it.
              case "$base" in
                develop|feature/*) ;;
                *)
                  echo "[info] base branch is out of scope, ignoring: $base"
                  emit run false
                  exit 0 ;;
              esac
              ;;

            *)
              echo "::error::unhandled event: $EV"; exit 1 ;;
          esac

          # A dispatch that names no pull request and is no batch still paints nothing.
          post_status=false
          if [ -n "$pr" ] || { [ "$EV" = workflow_dispatch ] && [ "$IN_NIGHTLY" = true ]; }; then
            post_status=true
          fi

          # Every path ends here, so one check covers all four.
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be 40 lowercase hex characters, got: ${sha}"; exit 1
          fi
          # The branch reaches git as `clone --branch` and `ls-remote`, so refuse
          # anything but the shape a branch has. A leading dash would be read as an
          # option, and `..` reaches outside the ref it names.
          if [ -n "$tt" ] \
             && { [[ ! "$tt" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || [[ "$tt" == *..* ]]; }; then
            echo "::error::testtools must be a branch name of letters, digits and . _ / -"
            echo "  starting with a letter or a digit, at most 100 of them. Got: ${tt}"
            exit 1
          fi

          # A batch child tests a commit that merged hours ago, so an answer fix merged
          # since would grade it. Squash merges make the commit date the merge time, the
          # same property the 48-hour window rests on.
          tc_until=''
          if [ "$EV" = workflow_dispatch ] && [ "$IN_NIGHTLY" = true ]; then
            # Retried like probe_branch below: one blip here costs the commit a night,
            # because a gate that dies posts no status and the next batch takes it again.
            for i in 1 2 3; do
              tc_until=$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.committer.date') && break
              sleep $((i * 5))
            done
            # Empty would leave plan on the tip, which is the defect itself.
            [ -n "$tc_until" ] || { echo "::error::no commit date for $sha"; exit 1; }
            echo "tc pin: testcases as of $tc_until"
          fi

          # Empty on the build-only paths, where plan never runs. jq drops the blank line
          # `printf` leaves behind for an empty selection, so that case yields [].
          suites=$(printf '%s\n' $sel | jq -Rc 'select(length > 0)' | jq -sc .)

          emit run true
          emit test "$test_run"
          emit suites "$suites"
          emit sha "$sha"
          emit pr "$pr"
          emit post_status "$post_status"
          emit build_ns "$ns"
          emit cache_write "$cache_write"
          emit parallelism "$par"
          emit limit "$limit"
          emit force_build "$force"
          emit rerun_from "$rerun"
          emit sabotage "$sab"
          emit testtools "$tt"
          emit tc_until "$tc_until"
          echo "resolved: event=$EV test=$test_run suites=$suites namespace=$ns ccache_write=$cache_write status=$post_status"

  # One run per develop commit merged since the last batch, so a failure can be read
  # back to the merge that brought it in. No cursor is stored: the commit status IS
  # the record of what an earlier batch covered, so a missed night heals on the next.
  # schedule only fires on the default branch, so a topic branch rehearses the path
  # with nightly=true and an empty sha.
  nightly:
    name: nightly batch
    # A fork inherits the cron. Only this repository owns the batch; a fork rehearses.
    if: >-
      ${{ (github.event_name == 'schedule' && github.repository == 'CUBRID/cubrid')
      || (github.event_name == 'workflow_dispatch' && inputs.nightly && inputs.sha == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write # workflow_dispatch is one of the two events GITHUB_TOKEN may raise
      statuses: read
    steps:
      - name: Dispatch one run per develop commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The copy of this file to run, not the commits to test.
          REF: ${{ github.ref_name }}
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
          IN_SUITE: ${{ inputs.suite }}
          IN_PAR: ${{ inputs.parallelism }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_TT: ${{ inputs.testtools }}
        run: |
          set -euo pipefail

          BRANCH=develop
          WINDOW_HOURS=48 # one missed batch heals on the next night
          CAP=20          # develop takes 4 to 10 merges a day

          # schedule carries no inputs, and the batch's shape is all three suites.
          suite="${IN_SUITE:-all}"
          par="$IN_PAR"; limit="${IN_LIMIT:-0}"; tt="$IN_TT"
          # Every suite's context, not one of them: a single-suite dispatch must not
          # mark a commit the other two never ran.
          want_ctx=$(jq -c '[.[].status_ctx]' <<<"$SUITES")
          since=$(date -u -d "$WINDOW_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)

          # This lists every commit reachable from the branch, so a merge would put a
          # side branch's in it too; the first-parent walk below is what says "merged".
          gh api --paginate "repos/${REPO}/commits?sha=${BRANCH}&since=${since}&per_page=100" \
            --jq '.[] | [.sha, (.parents[0].sha // "-"), (.commit.message | split("\n")[0])] | @tsv' \
            > /tmp/window.tsv
          # A dash, not an empty field: read takes a tab for whitespace, so a run of them
          # collapses and an empty parent would pull the title into its place.
          declare -A parent title
          while IFS=$'\t' read -r c p t; do parent[$c]="$p"; title[$c]="$t"; done < /tmp/window.tsv
          echo "window: $(wc -l < /tmp/window.tsv) commits on $BRANCH since $since"

          # pending and error are what a run that never judged this commit leaves
          # behind, so the batch takes it again.
          covered() {
            local body missing
            body=$(gh api "repos/${REPO}/commits/$1/status") || {
              echo "::error::could not read the statuses of $1"; exit 1; }
            missing=$(jq -r --argjson want "$want_ctx" \
                '[.statuses[] | select(.state == "success" or .state == "failure") | .context] as $done
                 | ($want - $done) | join(", ")' <<<"$body")
            [ -z "$missing" ]
          }

          : > /tmp/todo.list
          c=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)
          # The walk ends where the window does: outside it a commit has no parent here.
          while [ -n "$c" ] && [ -n "${parent[$c]+set}" ]; do
            if covered "$c"; then
              echo "  covered  ${c:0:10}  ${title[$c]}"
            else
              printf '%s\n' "$c" >> /tmp/todo.list
              echo "  take     ${c:0:10}  ${title[$c]}"
              if [ "$(wc -l < /tmp/todo.list)" -ge "$CAP" ]; then
                echo "::warning::$CAP commits is the cap; older ones wait for the next batch"
                break
              fi
            fi
            c="${parent[$c]}"
          done

          n=$(wc -l < /tmp/todo.list)
          if [ "$n" = 0 ]; then
            echo "nothing to run: every develop commit in the window has its verdicts"
            exit 0
          fi

          if [ "$REHEARSAL" = true ]; then
            echo "::notice::rehearsal: dispatching the newest of $n commits, printing the rest"
            tail -n +2 /tmp/todo.list | sed 's/^/  would dispatch: /'
            head -1 /tmp/todo.list > /tmp/dispatch.list
          else
            cp /tmp/todo.list /tmp/dispatch.list
          fi

          while read -r c; do
            gh workflow run gha-ci.yml --repo "$REPO" --ref "$REF" \
              -f nightly=true -f sha="$c" -f suite="$suite" \
              -f parallelism="$par" -f limit="$limit" -f testtools="$tt" </dev/null
            echo "dispatched ${c:0:10}  ${title[$c]}"
          done < /tmp/dispatch.list
          echo "dispatched $(wc -l < /tmp/dispatch.list) of $n on ref $REF, suite $suite"

  # The checks a run paints on a commit. Posted from here and not from build or
  # collect: those run in a pod that can be evicted, and statuses: write must not
  # reach a runner that executes testcase code.
  status_pending:
    name: status (pending)
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' && needs.gate.outputs.test == 'true' && needs.gate.outputs.post_status == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark the head commit pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
          PR: ${{ needs.gate.outputs.pr }}
          SUITES_RUN: ${{ join(fromJson(needs.gate.outputs.suites), ' ') }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be 40 lowercase hex characters, got: ${SHA}"; exit 1
          fi
          pending() { # context, description
            jq -n --arg c "$1" --arg d "$2" \
              --arg u "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:"pending", context:$c, target_url:$u, description:$d}' > /tmp/st.json
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
              -d @/tmp/st.json)
            echo "$1 -> pending (HTTP $code)"
            if [ "$code" != "201" ]; then
              echo "::error::could not post the pending status: $1"
              jq -r '.message // .' /tmp/resp.json 2>/dev/null | head -3
              exit 1
            fi
          }
          # The build legs are one pair however many suites were asked for; the test
          # contexts are one per suite, and the table is the only thing that names them.
          # build_status answers the pair for a pull request alone.
          if [ -n "$PR" ]; then
            pending "$CTX_BUILD_RELEASE" "release build running"
            pending "$CTX_BUILD_DEBUG" "debug build running"
          fi
          for suite in $SUITES_RUN; do
            pending "$(jq -r --arg s "$suite" '.[$s].status_ctx' <<<"$SUITES")" "$suite suite running"
          done
          echo "pending posted on ${SHA}"

  # Both modes of the CircleCI baseline, which differ only in the build argument and
  # the ccache they use. One image serves both: the release build here is for testing,
  # not distribution, so it carries no glibc constraint.
  #
  # No job outputs. A matrix job reports the last-completing element's outputs, which
  # would make `mode` ambiguous; plan derives the path from gate instead and reads the
  # rest out of build.meta.
  build:
    name: build (${{ matrix.mode }})
    needs: gate
    permissions: {} # no token used; the engine comes from the node mirror
    if: needs.gate.outputs.run == 'true'
    runs-on: cubrid-arc-build
    timeout-minutes: 30
    strategy:
      # One mode failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - mode: release
            args: ""
          - mode: debug
            args: "-m optdebug"
    container:
      image: cubridci/cubridci:build_rl8.10
    defaults:
      run:
        shell: bash

    env:
      BUILD_MIRROR: /home/ci/seed/build
      # Per mode: one path for two matrix legs is the later leg overwriting
      # the earlier one.
      BUILD_LOG_DIR: /home/ci/shared/runs/${{ github.run_id }}/build/${{ matrix.mode }}
      MODE: ${{ matrix.mode }}
      BUILD_ARGS: ${{ matrix.args }}
      # develop | pr. Keeps the preserved develop artifacts out of reach of PR builds.
      BUILD_NS: ${{ needs.gate.outputs.build_ns }}

      # One cache per mode, on the node disk -- there is no restore/save step to
      # gate, so "write on develop only" is enforced by ccache itself below.
      CCACHE_DIR: /home/ci/cache/ccache/develop-${{ matrix.mode }}
      # The default is mtime, which a fresh clone always misses.
      CCACHE_COMPILERCHECK: content
      # `ccache --max-size` writes into the cache directory; the variable does not.
      # 5G held 4.6GB, so the node disk gets the headroom the volume did not.
      CCACHE_MAXSIZE: 10G
      # No CCACHE_HARDLINK: a hardlinked entry is one bad build away from a poisoned
      # cache, and both trees are on the same node disk either way.
      CACHE_WRITE: ${{ needs.gate.outputs.cache_write }}

    steps:
      - name: 0. Environment check
        env:
          # Inputs via env, never interpolated into the body.
          INPUT_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          echo "=== identity ==="
          echo "job pod    : $(hostname)"
          echo "runner     : ${RUNNER_NAME:-(none)}"
          echo "image      : $(cat /etc/redhat-release)"

          echo "=== input SHA ==="
          # Full 40-char SHA only. Short SHAs and ref names are refused.
          if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be 40 lowercase hex characters"
            exit 1
          fi
          echo "SHA: $INPUT_SHA"
          echo "SHA=$INPUT_SHA" >> "$GITHUB_ENV"

          echo "=== mounts ==="
          ls -ld "$CI_ROOT" "$BUILD_MIRROR/cubrid" "$BUILD_MIRROR/cubrid.git" "$CCACHE_DIR" || true
          for d in "$BUILD_MIRROR/cubrid/.git" "$BUILD_MIRROR/cubrid.git"; do
            [ -d "$d" ] && continue
            echo "::error::the node copy is not visible: $d"
            echo "  Either the pod template did not reach the job pod, or gha-node-seed has not run."
            exit 1
          done

          echo "=== writable ==="
          # Checked now rather than at publish time, 30 minutes later.
          mkdir -p "$CI_BUILD_ROOT"
          probe="$CI_BUILD_ROOT/.write-probe.$$"
          touch "$probe" && rm -f "$probe"
          echo "writable"

          # Wall-clock stamps. build opens the run dir; plan's mkdir -p keeps it.
          mkdir -p "$STAMPS"
          printf 'start\t%s\n' "$(date -u +%s)" > "$STAMPS/build.tsv"

          # WAN baseline. GlusterFS goes via hostPath, so this counts GitHub + 3rdparty.
          awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' \
            /proc/net/dev > "$RUNNER_TEMP/rx0"

      - name: 1. Is this SHA already published
        id: reuse
        env:
          INPUT_FORCE: ${{ needs.gate.outputs.force_build }}
        run: |
          set -euo pipefail
          # No `step halt` in GHA: emit an output and gate later steps on it.
          dir="$CI_BUILD_ROOT/$BUILD_NS/$SHA/$MODE"
          # Named reuse, not mode: this job already calls the matrix leg MODE.
          if [ "$INPUT_FORCE" = 'true' ]; then
            echo "force_build=true, rebuilding even though an artifact exists"
            reuse=built
          elif [ -f "$dir/$BUILD_SENTINEL" ]; then
            echo "already published: $dir"
            reuse=reused
          else
            echo "nothing published, building"
            reuse=built
          fi
          echo "reuse=$reuse"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      - name: 2. Source, the node copy with only the delta fetched
        if: steps.reuse.outputs.reuse != 'reused'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # The seed is already checked out, so the image's fetch_source skips its
          # clone and only fetches the delta (docker-entrypoint.sh 42-58). Overlay,
          # not a copy: the build writes 700MB into this tree and the seed is
          # read-only and shared with the other matrix leg.
          #
          # upper and work go on the node disk under $RUNNER_TEMP, not on /rw:
          # this tree takes the build output. overlayfs also refuses an upperdir
          # that is itself on overlayfs, which the container's own / is.
          mkdir -p "$RUNNER_TEMP/src-upper" "$RUNNER_TEMP/src-work" cubrid
          mount -t overlay overlay \
            -o "lowerdir=$BUILD_MIRROR/cubrid,upperdir=$RUNNER_TEMP/src-upper,workdir=$RUNNER_TEMP/src-work" \
            cubrid
          echo "source seed: $BUILD_MIRROR/cubrid @ $(git -C cubrid log -1 --format='%h %ci')"

          # The verb never goes shallow: build.sh reads the serial off `git rev-list
          # --count`, and a shallow clone stamps every package 0001. Submodules still
          # come from $BUILD_MIRROR, which the seed does not carry.
          # The tree lands in ./cubrid, so step 3 stays one level up.
          /entrypoint.sh checkout "$SHA"

      - name: 3. Build
        if: steps.reuse.outputs.reuse != 'reused'
        run: |
          set -euo pipefail
          # One level up from the source on purpose: run_build finds cubrid/build.sh
          # from here and writes build.log to cwd, which is where step 5 reads it.
          cd "$GITHUB_WORKSPACE"

          # Read-only unless this is a develop push. There is no save_cache step to
          # gate, so ccache enforces it -- read_only stops writes, stats=false stops the
          # counter file, and temporary_dir keeps scratch out of the shared cache (the
          # default is <cache_dir>/tmp). CCACHE_MAXSIZE stands in for `ccache --max-size`,
          # which writes into the cache directory, as `ccache -z` also would.
          if [ "$CACHE_WRITE" = 'true' ]; then
            echo "ccache: writable, this is a develop push -- $CCACHE_DIR"
          else
            export CCACHE_READONLY=1 CCACHE_NOSTATS=1
            echo "ccache: read-only -- $CCACHE_DIR"
          fi
          export CCACHE_TEMPDIR="$RUNNER_TEMP/ccache-tmp"
          mkdir -p "$CCACHE_TEMPDIR"
          [ -d "$CCACHE_DIR" ] || echo "::warning::no ccache at $CCACHE_DIR yet, so this is a cold build"

          # No -j: ninja 1.11.1 reads the cgroup quota and decides for itself.
          # BUILD_ARGS is one flag pair from the matrix, so it must word-split.
          # shellcheck disable=SC2086
          /entrypoint.sh build $BUILD_ARGS
          ccache -s

      - name: 4. Publish, staged then moved in with one rename
        env:
          INPUT_FORCE: ${{ needs.gate.outputs.force_build }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: |
          set -euo pipefail
          dir="$CI_BUILD_ROOT/$BUILD_NS/$SHA/$MODE"

          # The reuse decision is 8 to 40 minutes old by now, and a duplicate run on
          # the same SHA -- a push to feature/** and a /run comment naming the same
          # commit -- publishes into this very path. Reading the sentinel again
          # saves the 700MB staging copy when the other run is already done. It does
          # NOT decide the race: see the rename below.
          if [ "$REUSE" != 'reused' ] && [ "$INPUT_FORCE" != 'true' ] \
             && [ -f "$dir/$BUILD_SENTINEL" ]; then
            echo "another run published this build first, keeping theirs: $dir"
            REUSE=reused
          fi

          if [ "$REUSE" = 'reused' ]; then
            echo "reused, not publishing: $dir"
          else
            tmp="${dir}.tmp.${GITHUB_RUN_ID}"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            # Written before the archive so it travels inside it: the shard
            # reads it back out of what it unpacked.
            meta=$(printf 'sha=%s\nmode=%s\nns=%s\nrun_id=%s\nrun_attempt=%s\nbuilt_at=%s\nworkflow=gha-ci\n' \
              "$SHA" "$MODE" "$BUILD_NS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(date -u +%s)")
            printf '%s\n' "$meta" > "/home/CUBRID/$BUILD_META"

            # An archive, not a tree: a published tree became the shard's overlay
            # lowerdir, so every process launch read the build over GlusterFS.
            tar -C /home -cf - CUBRID | gzip -1 > "$tmp/CUBRID.tar.gz"

            # The summary links this copy, not the one under the run directory: a
            # reused build outlives the run that made it.
            if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
              cp "$GITHUB_WORKSPACE/build.log" "$tmp/build.log"
            fi

            printf '%s\n' "$meta" > "$tmp/build.meta"

            # Sentinel created inside staging, so the rename never exposes a partial tree.
            touch "$tmp/$BUILD_SENTINEL"

            # rename(2) refuses to replace a non-empty directory, and on a shared
            # filesystem that refusal is the only atomic arbiter there is. Checking
            # first and acting after loses a race whose window is the staging copy
            # above: measured in the fork, runs 32835135072 and 32835140419 built the
            # same SHA, the second read the sentinel one second before the first wrote
            # it, and replaced a tree that had just been published. So try the plain
            # rename and let the loser find out from the kernel.
            if mv -T "$tmp" "$dir" 2>/dev/null; then
              echo "published: $dir"
            elif [ -f "$dir/$BUILD_SENTINEL" ] && [ "$INPUT_FORCE" != 'true' ]; then
              # Lost. Their tree is finished and a shard may already have it mounted
              # as its overlay lowerdir, so it stays and ours goes -- the same choice
              # the CircleCI baseline makes (config.yml 430-436).
              echo "another run published this build first, keeping theirs: $dir"
              rm -rf "$tmp"
            else
              # force_build, or a tree with no sentinel: published before this
              # workflow, or left behind by a run that died mid-publish. Replacing it
              # takes two renames, and $dir is briefly absent -- plan's sentinel check
              # catches that.
              old="${dir}.old.${GITHUB_RUN_ID}"
              rm -rf "$old"
              if [ -e "$dir" ] && ! mv -T "$dir" "$old"; then
                rm -rf "$tmp"
                echo "::error::could not move the old artifact aside: $dir"; exit 1
              fi
              if ! mv -T "$tmp" "$dir"; then
                # Roll back. The old build surviving beats nothing surviving.
                [ -e "$old" ] && mv -T "$old" "$dir"
                rm -rf "$tmp"
                echo "::error::could not move the new artifact in: $dir"; exit 1
              fi
              rm -rf "$old"
            fi
          fi

          # plan and shard assume these exist. Better to die here.
          for f in "$BUILD_SENTINEL" build.meta; do
            [ -f "$dir/$f" ] || {
              echo "::error::the artifact has no $f: $dir"
              echo "  Builds published before this workflow carry no meta. Re-run with force_build=true."
              exit 1
            }
          done
          # Either shape, the two plan and shard accept: a reused artifact can
          # predate the archive, and this job does not republish it.
          if [ -f "$dir/CUBRID.tar.gz" ]; then
            tar -tzf "$dir/CUBRID.tar.gz" "CUBRID/$BUILD_META" >/dev/null || {
              echo "::error::the archive carries no CUBRID/$BUILD_META: $dir"; exit 1; }
          elif [ -f "$dir/CUBRID/$BUILD_META" ]; then
            echo "reused a tree published before the archive: $dir"
          else
            echo "::error::the artifact has no CUBRID.tar.gz and no CUBRID/$BUILD_META: $dir"
            echo "  Re-run with force_build=true."
            exit 1
          fi
          by=$(awk -F= '/^run_id=/ {print $2}' "$dir/build.meta")
          echo "artifact : $dir"
          echo "built by : $by (this run: $GITHUB_RUN_ID)"
          cat "$dir/build.meta"
          du -sh "$dir"
          df -h "$CI_ROOT" | tail -1

          printf 'end\t%s\n' "$(date -u +%s)" >> "$STAMPS/build.tsv"

      - name: 5. WAN and build log
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/rx0" ]; then
            rx1=$(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev)
            echo "WAN received by this job: $(( (rx1 - $(cat "$RUNNER_TEMP/rx0")) / 1048576 )) MB"
            echo "  baseline: 372.02MB measured, replacing a 290MB CircleCI artifact"
          fi

          # build.log is the only clue on failure, and it does not reach the GHA log.
          f="$GITHUB_WORKSPACE/build.log"
          if [ -f "$f" ]; then
            mkdir -p "$BUILD_LOG_DIR"
            cp "$f" "$BUILD_LOG_DIR/build.log"
            echo "saved: $BUILD_LOG_DIR/build.log ($(wc -l < "$f") lines)"
            echo "=== last 60 lines of build.log ==="
            tail -60 "$f"
          fi

  # A comment run's check runs land on the default branch head, never on the
  # pull request, so the build verdict reaches it as a commit status instead.
  build_status:
    name: build status
    needs: [gate, build]
    # !cancelled(), as plan and collect read it, and unlike status: under always() a
    # superseded run's failure can land after the verdict that replaced it.
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.gate.outputs.test == 'true' && needs.gate.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
      actions: read # the per-leg conclusion, below
    steps:
      - name: Post each build leg to the head commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be 40 lowercase hex characters, got: ${SHA}"; exit 1
          fi

          # needs.build.result is the whole matrix, so the legs come by name. Read
          # apart from the mapping: a failed query must not post as a red build.
          legs=$(gh api --paginate "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name | startswith("build (")) | [.name, .conclusion] | @tsv') || {
            echo "::error::could not read the jobs of this run; posting nothing"; exit 1; }
          printf 'jobs API:\n%s\n' "$legs"

          bad=0
          post() { # context, mode
            conc=$(printf '%s\n' "$legs" | awk -F'\t' -v n="build ($2)" '$1 == n {print $2}')
            case "$conc" in
              success) state=success; desc="$2 build passed" ;;
              '')      state=failure; desc="no $2 build job in this run"; bad=1 ;;
              *)       state=failure; desc="$2 build $conc -- see the run" ;;
            esac
            jq -n --arg s "$state" --arg c "$1" --arg d "$desc" \
              --arg u "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:$s, context:$c, target_url:$u, description:$d}' > /tmp/st.json
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
              -d @/tmp/st.json)
            echo "$1 -> $state (conclusion ${conc:-none}, HTTP $code)"
            if [ "$code" != "201" ]; then
              echo "::error::could not post the status: $1"
              jq -r '.message // .' /tmp/resp.json 2>/dev/null | head -3
              bad=1 # no exit: the other context still needs its answer
            fi
          }

          post "$CTX_BUILD_RELEASE" release
          post "$CTX_BUILD_DEBUG" debug
          [ "$bad" = 0 ] || exit 1
          echo "posted on ${SHA}"

  plan:
    name: plan
    needs: [gate, build]
    # Not success(): needs.build is the whole matrix, and a failed release build must
    # not block the suites (CircleCI's test_shell hangs off build_debug alone). The
    # debug build is checked below. Not a matrix over the suites either: a matrix job
    # reports the last element's outputs, which would make the shard matrix ambiguous.
    if: ${{ !cancelled() && needs.gate.outputs.test == 'true' }}
    permissions: {}
    runs-on: cubrid-arc-light
    timeout-minutes: 30
    container:
      image: cubridci/cubridci:test-rl810-gha-verbs
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      # Stated, not inherited: the image tag is mutable.
      WORKDIR: /home
      BUILD_NS: ${{ needs.gate.outputs.build_ns }}
      SUITES_RUN: ${{ join(fromJson(needs.gate.outputs.suites), ' ') }}
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      rundir: ${{ steps.split.outputs.rundir }}
      sha: ${{ needs.gate.outputs.sha }}
      build_ns: ${{ needs.gate.outputs.build_ns }}
      build_run_id: ${{ steps.build.outputs.build_run_id }}
      ctp_sha: ${{ steps.tc.outputs.ctp_sha }}
      ctp_branch: ${{ steps.tc.outputs.ctp_branch }}

    steps:
      - name: Validate inputs
        id: args
        env:
          IN_PAR: ${{ needs.gate.outputs.parallelism }}
          IN_LIMIT: ${{ needs.gate.outputs.limit }}
          IN_SAB: ${{ needs.gate.outputs.sabotage }}
          IN_RERUN: ${{ needs.gate.outputs.rerun_from }}
        run: |
          # Empty parallelism asks for the suite's default, which the split resolves.
          if [ -n "$IN_PAR" ] \
             && { [[ ! "$IN_PAR" =~ ^[0-9]{1,3}$ ]] || [ "$IN_PAR" -lt 1 ] || [ "$IN_PAR" -gt 256 ]; }; then
            echo "::error::parallelism must be an integer in 1..256"; exit 1
          fi
          if [[ ! "$IN_LIMIT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::limit must be an integer"; exit 1
          fi
          case "$IN_SAB" in
            none|empty-shard|lose-shard|kill-shard) ;;
            *) echo "::error::sabotage must be none|empty-shard|lose-shard|kill-shard"; exit 1 ;;
          esac
          if [ -n "$IN_RERUN" ] && [[ ! "$IN_RERUN" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::rerun_from must be a run id (integer)"; exit 1
          fi
          echo "par=$IN_PAR" >> "$GITHUB_OUTPUT"
          echo "limit=$IN_LIMIT" >> "$GITHUB_OUTPUT"
          mkdir -p "$STAMPS"
          printf 'start\t%s\n' "$(date -u +%s)" > "$STAMPS/plan.tsv"

      - name: Verify the debug build the build job published
        id: build
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          dir="$CI_BUILD_ROOT/$BUILD_NS/$SHA/debug"
          # The sentinel marks a finished tree; the directory alone passes a partial one.
          [ -f "$dir/$BUILD_SENTINEL" ] || {
            echo "::error::the build is not finished publishing (no sentinel): $dir"; exit 1; }
          [ -f "$dir/CUBRID.tar.gz" ] || [ -d "$dir/CUBRID" ] || {
            echo "::error::no CUBRID archive or tree: $dir"; exit 1; }
          [ -f "$dir/build.meta" ] || {
            echo "::error::no build.meta: $dir. Re-run with force_build=true"; exit 1; }
          meta_sha=$(awk -F= '/^sha=/ {print $2}' "$dir/build.meta")
          [ "$meta_sha" = "$SHA" ] || {
            echo "::error::meta sha($meta_sha) differs from the sha gate resolved($SHA)"; exit 1; }
          echo "build_run_id=$(awk -F= '/^run_id=/ {print $2}' "$dir/build.meta")" >> "$GITHUB_OUTPUT"

      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          # One repo only: naming cubrid-testtools too fails the issuance.
          repositories: cubrid-testcases-private-ex
          owner: CUBRID
          permission-contents: read

      - name: Refresh testcases, decided once here
        id: tc
        env:
          GHI_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PR: ${{ needs.gate.outputs.pr }}
          INPUT_TT: ${{ needs.gate.outputs.testtools }}
          TC_UNTIL: ${{ needs.gate.outputs.tc_until }}
        run: |
          echo "::add-mask::$GHI_TOKEN"
          attr() { jq -r --arg s "$1" --arg k "$2" '.[$s][$k] // ""' <<<"$SUITES"; }
          # ls-remote exits 2 only for "no such ref"; the retries keep a network blip
          # from reading as a branch that was never pushed.
          probe_branch() {
            local i rc
            for i in 1 2 3 4 5; do
              rc=0
              git ls-remote --exit-code --heads "$1" "$2" >/dev/null 2>&1 || rc=$?
              [ "$rc" -eq 0 ] && return 0
              [ "$rc" -eq 2 ] && return 2
              echo "::warning::ls-remote '$2' failed (attempt $i, exit $rc); retrying"
              sleep $((i * 3))
            done
            return 1
          }
          # The entrypoint drops the same global key on exit, so each use puts it back.
          use_token() {
            git config --global url."https://x-access-token:${GHI_TOKEN}@github.com/".insteadof \
              https://github.com/
          }
          wan() { awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev; }

          if [ -n "$INPUT_PR" ] && [[ ! "$INPUT_PR" =~ ^[0-9]{1,7}$ ]]; then
            echo "::error::pr must be an integer"; exit 1
          fi

          # A named CTP branch gets no fallback to develop: the failures would be
          # reported against a tree the requester never asked for.
          CTP_REPO=https://github.com/CUBRID/cubrid-testtools.git
          CTP_BRANCH="${INPUT_TT:-develop}"
          if [ -n "$INPUT_TT" ]; then
            use_token
            probe_rc=0
            probe_branch "$CTP_REPO" "$CTP_BRANCH" || probe_rc=$?
            case "$probe_rc" in
              0) ;;
              2) echo "::error::cubrid-testtools has no branch '$CTP_BRANCH'. Push it there first, or drop testtools="; exit 1 ;;
              *) echo "::error::could not reach $CTP_REPO after 5 attempts"; exit 1 ;;
            esac
          fi

          # Else a small fetch touches the node copy's packs, copying them whole into /rw.
          git config --global fetch.unpackLimit 1

          # Mounted from the node copy, the entrypoint finds .git and fetches the tip
          # instead of a 124s clone (CUBRIDQA-1497). The shards mount the same copy.
          if [ -d "$CTP_SEED/.git" ]; then
            mkdir -p /rw/ctp-upper /rw/ctp-work "$WORKDIR/cubrid-testtools"
            mount -t overlay overlay \
              -o "lowerdir=$CTP_SEED,upperdir=/rw/ctp-upper,workdir=/rw/ctp-work" \
              "$WORKDIR/cubrid-testtools"
            git -C "$WORKDIR/cubrid-testtools" remote set-url origin "$CTP_REPO"
          else
            echo "::warning::no usable CTP seed at $CTP_SEED; the entrypoint will clone"
            rm -rf "$WORKDIR/cubrid-testtools"
          fi

          rx0=$(wan)
          # sql and medium are two suites of one repo: a second checkout would move the
          # tree under the split that already read it.
          done_repos=''
          for suite in $SUITES_RUN; do
            repo=$(attr "$suite" tc_repo)
            case " $done_repos " in *" $repo "*) continue ;; esac

            seed=$(attr "$suite" tc_seed)
            dir="$WORKDIR/$repo"
            [ -d "$seed" ] || {
              echo "::error::no testcase seed for $suite: $seed; gha-node-seed swaps it, so it can be absent for a moment"
              exit 1; }
            mkdir -p "/rw/$repo-upper" "/rw/$repo-work" "$dir"
            mount -t overlay overlay \
              -o "lowerdir=$seed,upperdir=/rw/$repo-upper,workdir=/rw/$repo-work" "$dir"

            use_token
            # The sync bot creates tc/pr-<N> when the PR opens. Same rule as CircleCI,
            # and no fallback to develop: the verdict would be against the wrong cases.
            TC_REPO_URL="https://github.com/CUBRID/${repo}.git"
            if [ -n "$INPUT_PR" ]; then TC_BRANCH="tc/pr-${INPUT_PR}"; else TC_BRANCH=develop; fi
            probe_rc=0
            probe_branch "$TC_REPO_URL" "$TC_BRANCH" || probe_rc=$?
            case "$probe_rc" in
              0) ;;
              2) echo "::error::$repo has no $TC_BRANCH. TC Branch Sync creates tc/pr-<N> when the pull request opens"; exit 1 ;;
              *) echo "::error::could not reach $TC_REPO_URL after 5 attempts"; exit 1 ;;
            esac

            export BRANCH_TESTCASES="$TC_BRANCH"
            # Only the node mirror can answer as of a past instant: the entrypoint
            # fetches --depth 1.
            if [ -n "$TC_UNTIL" ]; then
              mirror="${seed}.git"
              [ -d "$mirror" ] || { echo "::error::no mirror for $repo: $mirror"; exit 1; }
              # Commit dates cannot tell a quiet repo from a dead refresh; gha-node-seed
              # rewrites FETCH_HEAD hourly either way.
              [ "$(stat -c %Y "$mirror/FETCH_HEAD")" -ge "$(date -u -d "$TC_UNTIL" +%s)" ] || {
                echo "::error::$repo mirror predates the cutoff $TC_UNTIL; gha-node-seed is behind"; exit 1; }
              BRANCH_TESTCASES=$(git -C "$mirror" rev-list -1 --first-parent --before="$TC_UNTIL" "$TC_BRANCH")
              [ -n "$BRANCH_TESTCASES" ] || {
                echo "::error::$repo has no $TC_BRANCH commit at or before $TC_UNTIL"; exit 1; }
            fi
            BRANCH_TESTTOOLS="$CTP_BRANCH" /entrypoint.sh checkout "$suite"

            # The shards align to this commit: if plan's list and their tree drift, cases vanish.
            git -C "$dir" rev-parse HEAD > "/tmp/tc.$repo.sha"
            printf '%s\n' "$TC_BRANCH" > "/tmp/tc.$repo.branch"
            done_repos="$done_repos $repo"
          done
          echo "refresh WAN: $(( ($(wan) - rx0) / 1048576 )) MB · /rw $(df -h /rw | awk 'END {print $3}') used"
          {
            echo "ctp_sha=$(git -C "$WORKDIR/cubrid-testtools" rev-parse HEAD)"
            echo "ctp_branch=$CTP_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Case list and split
        id: split
        env:
          PAR: ${{ steps.args.outputs.par }}
          LIMIT: ${{ steps.args.outputs.limit }}
          SABOTAGE: ${{ needs.gate.outputs.sabotage }}
          RERUN_FROM: ${{ needs.gate.outputs.rerun_from }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          attr() { jq -r --arg s "$1" --arg k "$2" '.[$s][$k] // ""' <<<"$SUITES"; }
          rundir="$CI_ROOT/runs/${GITHUB_RUN_ID}"
          : > /tmp/matrix.jsonl

          for suite in $SUITES_RUN; do
            repo=$(attr "$suite" tc_repo)
            unit=$(attr "$suite" unit)
            excl=$(attr "$suite" exclude)
            runner=$(attr "$suite" runner)
            par="${PAR:-$(attr "$suite" par_default)}"
            # A re-run takes one shard on the light lane whatever the suite's width: spread
            # out, it would hold that many runners and delay every other PR's first run.
            # Bounded: all of sql on one shard is about 38m, against a 120m timeout.
            if [ -n "$RERUN_FROM" ]; then par=1; runner=cubrid-arc-light; fi
            dir="$WORKDIR/$repo"
            root="$dir/$suite"
            out="$rundir/$suite"
            want=0; unrun=0; short=0; gone=0

            # After the checkout, which restores it. The same exclusion as CircleCI.
            [ -z "$excl" ] || rm -rf "${root:?}/$excl"
            /entrypoint.sh cases "$suite" "$root" | sed "s#^$WORKDIR/##" | sort > /tmp/cases.list
            # A unit is one line of a share: a case, or a top-level directory, the glob
            # CircleCI splits sql and medium by (config.yml 253-258).
            case "$unit" in
              case) cp /tmp/cases.list /tmp/all.list ;;
              dir)
                find "$root" -mindepth 1 -maxdepth 1 -type d -name '_*' | sed "s#^$WORKDIR/##" | sort > /tmp/all.list ;;
              *) echo "::error::unknown unit '$unit' for suite $suite"; exit 1 ;;
            esac

            if [ -n "$RERUN_FROM" ]; then
              src="$CI_ROOT/runs/$RERUN_FROM/$suite/collect/failed.list"
              rd="$CI_ROOT/runs/$RERUN_FROM"
              # Absent for four reasons; naming the wrong one sends the reader after the wrong id.
              if [ ! -f "$src" ]; then
                if [ ! -d "$rd" ]; then
                  echo "::error::run $RERUN_FROM has no run directory: pruned 30 days after the run, or never a gha-ci run"
                elif [ -d "$rd/$suite/results" ]; then
                  echo "::error::run $RERUN_FROM predates the run directory relayout. Use /run $suite"
                elif [ ! -d "$rd/$suite/shard" ]; then
                  echo "::error::run $RERUN_FROM never ran the $suite suite. Take the id from a run that ran it, not from 'built by run'"
                else
                  echo "::error::run $RERUN_FROM ran the suite but collect published no failure list (running, cancelled or dead)"
                fi
                exit 1
              fi
              # The same commit as the run it came from, as CircleCI's rerun.
              prev_sha=$(find "$rd/$suite/shard" -mindepth 2 -maxdepth 2 -name build.read \
                -exec awk -F= '/^sha=/ {print $2}' {} + 2>/dev/null | sort -u) || prev_sha=''
              if [ "$(printf '%s' "$prev_sha" | grep -c . || :)" -ne 1 ] || [ "$prev_sha" != "$SHA" ]; then
                echo "::error::run $RERUN_FROM tested '$(echo $prev_sha)', not this head $SHA. A re-run only re-runs the same commit"
                exit 1
              fi
              # A shard that died whole left no result file, so failed.list cannot see
              # its share: carry the share. One that handled fewer than plan.tsv gave it
              # left cases nothing names: count them.
              srcdir="$rd/$suite"
              : > /tmp/unrun.list
              for sf in "$srcdir"/plan/shards/*.list; do
                [ -f "$sf" ] || continue
                i=$(basename "$sf" .list)
                a=$(awk -F'\t' -v k="$i" '$1 == k {print $2}' "$srcdir/plan/plan.tsv")
                h=$(eval "$(/entrypoint.sh count "$suite" "$srcdir/shard/$i")"; [ "$found" = yes ] && echo $((exec + skip)) || echo none)
                if [ "$h" = none ]; then
                  cat "$sf" >> /tmp/unrun.list
                  unrun=$((unrun + ${a:-0}))
                elif [ "${a:-0}" -gt "$h" ]; then
                  short=$((short + a - h))
                fi
              done
              # A lost share file takes its case names with it; plan.tsv still counts them.
              if [ -f "$srcdir/plan/plan.tsv" ]; then
                while IFS=$'\t' read -r si scnt _; do
                  [ -n "$si" ] && [ ! -f "$srcdir/plan/shards/$si.list" ] && short=$((short + scnt))
                done < "$srcdir/plan/plan.tsv"
              fi
              cut -f2 "$src" | sed "s#^#$repo/#" > /tmp/want.list
              # sql and medium re-run the failed case's whole directory: a case is not
              # known to be safe on its own (CUBRIDQA-1523).
              [ "$unit" != dir ] || sed -i "s#^\($repo/$suite/[^/]*\)/.*#\1#" /tmp/want.list
              cat /tmp/unrun.list >> /tmp/want.list
              sort -u -o /tmp/want.list /tmp/want.list
              want=$(wc -l < /tmp/want.list)
              [ "$short" -eq 0 ] || echo "::warning::run $RERUN_FROM left $short more cases assigned but never handled. Nothing names them, so this re-run cannot pass"
              # A deleted unit and a renamed one look alike, and a renamed one must run
              # under its new name, so the re-run cannot pass over either.
              grep -xF -f /tmp/want.list /tmp/all.list > /tmp/sel.list || : > /tmp/sel.list
              gone=$((want - $(wc -l < /tmp/sel.list)))
              echo "re-run of $RERUN_FROM: $(wc -l < "$src") failed + $unrun unrun -> $((want - gone)) of $want ${unit}s still in the tree"
              if [ "$gone" -gt 0 ]; then
                echo "::warning::$gone are no longer in the tree (deleted or renamed), so this re-run cannot pass"
                comm -23 /tmp/want.list <(sort /tmp/sel.list) | sed 's/^/  gone: /'
              fi
            elif [ "$LIMIT" -gt 0 ]; then
              head -"$LIMIT" /tmp/all.list > /tmp/sel.list
            else
              cp /tmp/all.list /tmp/sel.list
            fi

            # Cases per unit: the guards and the summary count cases whatever the split moves.
            awk -F/ -v unit="$unit" 'FILENAME == ARGV[1] {c[$1 "/" $2 "/" $3]++; next}
              {printf "%s\t%d\n", $0, (unit == "case" ? 1 : c[$0] + 0)}' /tmp/cases.list /tmp/sel.list > /tmp/units.tsv
            nunit=$(wc -l < /tmp/units.tsv)
            total=$(awk -F'\t' '{s+=$2} END {print s+0}' /tmp/units.tsv)
            if [ "$nunit" -eq 0 ]; then
              if [ -n "$RERUN_FROM" ]; then
                echo "::error::nothing to run: none of the $want ${unit}s run $RERUN_FROM left unhandled can run now. Use /run $suite"
              else
                echo "::error::no cases at all: the glob matched nothing. Check the testcase tree"
              fi
              exit 1
            fi
            # More shards than units would leave the tail empty and trip the guard below.
            if [ "$par" -gt "$nunit" ]; then
              echo "::notice::parallelism $par exceeds the $nunit selected units; using $nunit shards"
              par="$nunit"
            fi

            rm -rf /tmp/shards; mkdir -p /tmp/shards
            timed=0
            if [ "$unit" = case ]; then
              # LPT: longest first onto the lightest shard, by the seconds each case took
              # last time; an unseen case gets the median.
              mkdir -p "$(dirname "$TIMINGS")"
              [ -f "$TIMINGS" ] || : > "$TIMINGS"
              if [ -s "$TIMINGS" ]; then
                dflt=$(cut -f2 "$TIMINGS" | sort -n | awk '{a[NR]=$1} END {print (NR? a[int(NR/2)+1] : 10)}')
              else
                # Empty timings turn LPT into name order: the longest shard 24.8m -> 49.4m.
                echo "::warning::timing data is empty, so LPT degrades to name order and the longest shard roughly doubles. Check $TIMINGS"
                dflt=10
              fi
              awk -v dflt="$dflt" -v tf="$TIMINGS" '
                BEGIN {
                  FS = "\t"
                  while ((getline line < tf) > 0) { n = split(line, a, "\t"); if (n >= 2) t[a[1]] = a[2] + 0 }
                  close(tf)
                }
                {
                  if ($1 in t) { sec = t[$1]; timed++ } else { sec = dflt }
                  printf "%015.3f\t%s\t%s\n", sec, $1, $2
                }
                END { print timed + 0 > "/tmp/timed.count" }
              ' /tmp/units.tsv | sort -rn -k1,1 -k2,2 > /tmp/sorted.tsv
              timed=$(cat /tmp/timed.count)
              awk -v par="$par" '
                BEGIN { FS = "\t"; for (i = 0; i < par; i++) load[i] = 0 }
                {
                  best = 0
                  for (i = 1; i < par; i++) if (load[i] < load[best]) best = i
                  load[best] += $1
                  printf "%s\n", $2 >> sprintf("/tmp/shards/%02d.list", best)
                  cases[best] += $3
                  units[best]++
                }
                END { for (i = 0; i < par; i++) printf "%02d\t%d\t%d\t%.1f\n", i, cases[i] + 0, units[i] + 0, load[i] }
              ' /tmp/sorted.tsv > /tmp/plan.tsv
            else
              # CircleCI's --split-by=name: `par` contiguous chunks of the sorted list.
              awk -v par="$par" '
                BEGIN { FS = "\t" }
                { u[NR] = $1; c[NR] = $2 }
                END {
                  for (i = 0; i < par; i++) {
                    lo = int(i * NR / par); hi = int((i + 1) * NR / par)
                    f = sprintf("/tmp/shards/%02d.list", i)
                    n = 0
                    for (k = lo + 1; k <= hi; k++) { print u[k] > f; n += c[k] }
                    close(f)
                    printf "%02d\t%d\t%d\t0\n", i, n, hi - lo
                  }
                }
              ' /tmp/units.tsv > /tmp/plan.tsv
            fi
            awk -F'\t' -v s="$suite" '{if (NR == 1 || $4 > mx) mx = $4; if (NR == 1 || $4 < mn) mn = $4}
              END {if (mx > 0) printf "%s: estimated longest shard %.1fm, shortest %.1fm\n", s, mx / 60, mn / 60}' /tmp/plan.tsv

            # Guard 1 of 3: the split adds up to the whole.
            got=$(awk -F'\t' '{s+=$2} END {print s+0}' /tmp/plan.tsv)
            [ "$got" -eq "$total" ] || { echo "::error::the split lost cases ($got != $total)"; exit 1; }

            mkdir -p "$out/plan/shards" "$out/shard" "$out/collect"
            for i in $(seq 0 $((par - 1))); do
              n=$(printf "%02d" "$i")
              [ -f "/tmp/shards/$n.list" ] || {
                echo "::error::no units assigned to shard $i of $suite (parallelism $par, units $nunit)"; exit 1; }
              cp "/tmp/shards/$n.list" "$out/plan/shards/$n.list"
              printf '{"suite":"%s","i":"%02d","runner":"%s"}\n' "$suite" "$i" "$runner" >> /tmp/matrix.jsonl
            done
            cp /tmp/plan.tsv "$out/plan/plan.tsv"
            cp /tmp/sel.list "$out/plan/cases.list"
            # Quoted: shard and collect source it.
            {
              echo "total=$total"
              echo "units=$nunit"
              echo "par=$par"
              echo "timed=$timed"
              echo "tc_sha='$(cat "/tmp/tc.$repo.sha")'"
              echo "tc_branch='$(cat "/tmp/tc.$repo.branch")'"
              echo "rerun_unrun=$unrun"
              echo "rerun_short=$short"
              echo "rerun_gone=$gone"
            } > "$out/plan/split.meta"

            # Breaks the split on purpose, to see the guards fire.
            case "$SABOTAGE" in
              empty-shard)
                echo "::warning::sabotage=empty-shard: shard 00's share is emptied, so shard 00 must fail"
                : > "$out/plan/shards/00.list" ;;
              lose-shard)
                echo "::warning::sabotage=lose-shard: shard 00's share file is deleted, so shard 00 must fail"
                rm -f "$out/plan/shards/00.list" ;;
              kill-shard)
                # The other two take the share away, leaving a re-run nothing to carry.
                echo "::warning::sabotage=kill-shard: shard 00 dies with its share intact, so shard 00 must fail"
                : > "$out/plan/shards/00.kill" ;;
            esac
          done

          {
            echo "matrix=$(jq -sc . /tmp/matrix.jsonl)"
            echo "rundir=$rundir"
          } >> "$GITHUB_OUTPUT"
          printf 'end\t%s\n' "$(date -u +%s)" >> "$STAMPS/plan.tsv"

      - name: Split summary
        env:
          RUNDIR: ${{ steps.split.outputs.rundir }}
          SHA: ${{ needs.gate.outputs.sha }}
          BRID: ${{ steps.build.outputs.build_run_id }}
        run: |
          {
            echo "## Split"
            echo
            echo "| suite | selected cases | units | shards | measured timings |"
            echo "|---|---|---|---|---|"
            for suite in $SUITES_RUN; do
              . "$RUNDIR/$suite/plan/split.meta"
              echo "| \`$suite\` | $total | $units | $par | $timed |"
            done
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| build SHA | \`$SHA\` |"
            echo "| build | built by run \`$BRID\` |"
            echo "| current run | \`$GITHUB_RUN_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  shard:
    name: "shard ${{ matrix.suite }} ${{ matrix.i }}"
    needs: plan
    # success() is false for a failed job anywhere behind this one: a red release leg
    # would skip every shard, though plan published the split.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    permissions: {}
    # plan owns the lane, as it owns the split.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    container:
      image: cubridci/cubridci:test-rl810-gha-verbs
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      WORKDIR: /home
      CUBRID_DIR: /home/CUBRID
      RUNDIR: ${{ needs.plan.outputs.rundir }}
      SUITE: ${{ matrix.suite }}
      IDX: ${{ matrix.i }}
      BUILD_NS: ${{ needs.plan.outputs.build_ns }}
      PLAN_DIR: ${{ needs.plan.outputs.rundir }}/${{ matrix.suite }}/plan
      SHARD_DIR: ${{ needs.plan.outputs.rundir }}/${{ matrix.suite }}/shard/${{ matrix.i }}

    steps:
      - name: Resolve the suite
        id: suite
        run: |
          attr() { jq -r --arg s "$SUITE" --arg k "$1" '.[$s][$k] // ""' <<<"$SUITES"; }
          {
            echo "TC_DIR=$WORKDIR/$(attr tc_repo)"
            echo "TC_SEED=$(attr tc_seed)"
            echo "STAMP=$STAMPS/shard-$SUITE-$IDX.tsv"
          } >> "$GITHUB_ENV"
          echo "tc_private=$(attr tc_private)" >> "$GITHUB_OUTPUT"

      - name: Check the pod template assumptions
        run: |
          # plan does not run again under "Re-run failed jobs", so nothing made this attempt's stamps.
          mkdir -p "$(dirname "$STAMP")"
          printf 'start\t%s\n' "$(date -u +%s)" > "$STAMP"
          if [ -f "$PLAN_DIR/shards/$IDX.kill" ]; then
            echo "::error::sabotage=kill-shard: shard $IDX is dying on purpose, with its share intact"
            exit 1
          fi
          # Without shareProcessNamespace nothing reaps the double-forked server, and
          # `cubrid server stop` hangs to the job timeout with nothing in the log.
          pid1=$(ps -p 1 -o comm= | tr -d ' ')
          [ "$pid1" = pause ] || {
            echo "::error::PID 1 is $pid1, not pause: the pod template lacks shareProcessNamespace: true"; exit 1; }

      - name: Take my share (guard 2 of 3)
        id: mine
        run: |
          f="$PLAN_DIR/shards/$IDX.list"
          # plan split everything, so no share is a bug, not a pass.
          [ -f "$f" ] || { echo "::error::my share file is missing: $f"; exit 1; }
          [ -s "$f" ] || { echo "::error::my share is empty: $f"; exit 1; }
          # A unit is a case for shell and a top-level directory for sql and medium.
          want=$(awk -F'\t' -v i="$IDX" '$1 == i {print $2}' "$PLAN_DIR/plan.tsv")
          [ -n "$want" ] || { echo "::error::shard $IDX is not in $PLAN_DIR/plan.tsv"; exit 1; }
          echo "n=$want" >> "$GITHUB_OUTPUT"

      - name: Testcases, build and CTP, from the node copy
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          WANT_BRID: ${{ needs.plan.outputs.build_run_id }}
        run: |
          # Every lowerdir is inside the pod and every upperdir is tmpfs: nothing a case
          # reads crosses the network, and nothing it writes outlives the pod.
          for seed in "$TC_SEED" "$CTP_SEED"; do
            [ -d "$seed/.git" ] || {
              echo "::error::no node copy at $seed; gha-node-seed swaps it, so it can be absent for a moment"
              exit 1; }
          done
          mkdir -p /rw/upper /rw/work "$TC_DIR"
          mount -t overlay overlay -o "lowerdir=$TC_SEED,upperdir=/rw/upper,workdir=/rw/work" "$TC_DIR"
          mkdir -p /rw/ctp-upper /rw/ctp-work "$WORKDIR/cubrid-testtools"
          mount -t overlay overlay \
            -o "lowerdir=$CTP_SEED,upperdir=/rw/ctp-upper,workdir=/rw/ctp-work" "$WORKDIR/cubrid-testtools"
          # The image derives init_path and PATH from CTP_HOME, so CTP has to be where it says.
          [ -x "$CTP_HOME/bin/ctp.sh" ] || { echo "::error::no CTP at the image's CTP_HOME ($CTP_HOME)"; exit 1; }

          base="$CI_BUILD_ROOT/$BUILD_NS/$SHA/debug"
          lower=/build-lower/CUBRID
          mkdir -p /build-lower
          t0=$(date +%s)
          if [ -f "$base/CUBRID.tar.gz" ]; then
            tar -xzf "$base/CUBRID.tar.gz" -C /build-lower
          elif [ -d "$base/CUBRID" ]; then
            cp -a "$base/CUBRID" "$lower"    # published before the archive
          else
            echo "::error::no build: $base/CUBRID.tar.gz"; exit 1
          fi
          echo "build unpacked in $(( $(date +%s) - t0 ))s"
          mkdir -p /build-rw/upper /build-rw/work "$CUBRID_DIR"
          mount -t overlay overlay \
            -o lowerdir="$lower",upperdir=/build-rw/upper,workdir=/build-rw/work "$CUBRID_DIR"

          # Read through the mount the tests use, not the artifact on the volume.
          m="$CUBRID_DIR/$BUILD_META"
          [ -f "$m" ] || { echo "::error::no $BUILD_META inside the mounted CUBRID"; exit 1; }
          got_sha=$(awk -F= '/^sha=/ {print $2}' "$m")
          got_brid=$(awk -F= '/^run_id=/ {print $2}' "$m")
          [ "$got_sha" = "$SHA" ] || {
            echo "::error::the build read has sha $got_sha, not plan's $SHA"; exit 1; }
          [ "$got_brid" = "$WANT_BRID" ] || {
            echo "::error::the build read was made by run $got_brid, not the one plan verified ($WANT_BRID)"; exit 1; }
          mkdir -p "$SHARD_DIR"
          cp -f "$m" "$SHARD_DIR/build.read"

      # Each job mints its own: a job output crosses the boundary unmasked.
      - name: GitHub App token
        id: app-token
        if: steps.suite.outputs.tc_private == 'yes'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          # One repo only: naming cubrid-testtools too fails the issuance.
          repositories: cubrid-testcases-private-ex
          owner: CUBRID
          permission-contents: read

      - name: Align CTP and testcases to the commits plan saw
        env:
          GHI_TOKEN: ${{ steps.app-token.outputs.token }}
          WANT_CTP_SHA: ${{ needs.plan.outputs.ctp_sha }}
        run: |
          [ -z "$GHI_TOKEN" ] || echo "::add-mask::$GHI_TOKEN"
          . "$PLAN_DIR/split.meta"
          wan() { awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev; }
          rx0=$(wan)
          git config --global fetch.unpackLimit 1
          # Commits, not branches: tc/pr-<N> and probe/* are gone once their work ends.
          BRANCH_TESTCASES="$tc_sha" BRANCH_TESTTOOLS="$WANT_CTP_SHA" /entrypoint.sh checkout "$SUITE"
          # /rw in MB means the fetch kept its pack; in GB, it copied the node copy's up.
          echo "refresh WAN: $(( ($(wan) - rx0) / 1048576 )) MB · /rw $(df -h /rw | awk 'END {print $3}') used"
          printf 'tc_sha=%s\ntc_branch=%s\n' "$(git -C "$TC_DIR" rev-parse HEAD)" "$tc_branch" > "$SHARD_DIR/tc.read"

      - name: Keep only my share
        run: /entrypoint.sh keep "$TC_DIR/$SUITE" "$PLAN_DIR/shards/$IDX.list"

      - name: Run CTP
        id: ctp
        env:
          # The only CircleCI variable CTP reads. Without it every shard logs as `local`.
          CIRCLE_NODE_INDEX: ${{ matrix.i }}
        # A failed test does not stop here: collect needs the results published first.
        run: |
          rc=0
          /entrypoint.sh test "$SUITE" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Publish results for collect
        if: always()
        env:
          WANT: ${{ steps.mine.outputs.n }}
          TEST_RC: ${{ steps.ctp.outputs.rc }}
        run: |
          /entrypoint.sh results "$SUITE" "$SHARD_DIR"
          eval "$(/entrypoint.sh count "$SUITE" "$SHARD_DIR")"
          # The pod is gone seconds after this, so a failure's evidence leaves now. Only
          # on failure: a green 50-shard run would write 50 archives nobody reads.
          if [ "${TEST_RC:-1}" != 0 ] || [ "$found" = no ] || [ "$fail" -gt 0 ]; then
            /entrypoint.sh evidence "$SUITE" "$SHARD_DIR" 10G || echo "::warning::could not keep all of the failure evidence"
            cp -f "$PLAN_DIR/shards/$IDX.list" "$SHARD_DIR/tc.list" || echo "::warning::no share list for shard $IDX"
          fi
          # Without it collect counts this shard as dead.
          printf 'suite=%s\nidx=%s\nassigned=%s\ntest_rc=%s\n' "$SUITE" "$IDX" "$WANT" "${TEST_RC:-}" > "$SHARD_DIR/shard.done"
          printf 'end\t%s\n' "$(date -u +%s)" >> "$STAMP"
          # tmpfs is charged to this container's memory cgroup, so the peak covers both mounts.
          peak=$(cat /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory/memory.max_usage_in_bytes 2>/dev/null | head -1 || :)
          used() { df -h "$1" | awk 'END {print $3 "/" $2}'; }
          echo "memory peak ${peak:+$(awk -v b="$peak" 'BEGIN {printf "%.1f GiB", b / 1073741824}')} · /rw $(used /rw) · /build-rw $(used /build-rw) · /build-lower $(du -sh /build-lower 2>/dev/null | cut -f1)"

      - name: Verdict
        if: always()
        env:
          WANT: ${{ steps.mine.outputs.n }}
        run: |
          eval "$(/entrypoint.sh count "$SUITE" "$SHARD_DIR")"
          [ "$found" = yes ] || { echo "::error::no CTP result file: the tests did not run"; exit 1; }
          echo "assigned $WANT / run $exec / failed $fail / skipped $skip"
          [ $((exec + skip)) -ge "$WANT" ] || {
            echo "::error::assigned $WANT but only $((exec + skip)) handled: cases went missing"; exit 1; }
          [ "$fail" -eq 0 ] || { echo "::error::$fail failed"; exit 1; }

  collect:
    name: collect
    needs: [gate, build, plan, shard]
    # The gate outputs alone would not do: a comment the gate turned away, and the
    # build-only triggers, have nothing to collect. !cancelled() rather than
    # always() so a superseded run stops here instead of posting a summary of a
    # suite that never ran. A shard cut by timeout-minutes still reports.
    #
    # NOT a matrix over the suites, for the reason plan is not: a matrix job reports
    # one element's outputs, and `status` needs each suite's verdict separately.
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.gate.outputs.test == 'true' }}
    permissions:
      # The wall-clock step reads the run start time. Public repos need no scope --
      # stated so it does not fail silently if this repository ever becomes private.
      actions: read
    runs-on: cubrid-arc-light
    timeout-minutes: 30
    container:
      image: cubridci/cubridci:test-rl810-gha-verbs
    defaults:
      run:
        shell: bash
    env:
      WORKDIR: /home
      RUNDIR: ${{ needs.plan.outputs.rundir }}
      BUILD_NS: ${{ needs.plan.outputs.build_ns }}
      PR: ${{ needs.gate.outputs.pr }}
      SUITES_RUN: ${{ join(fromJson(needs.gate.outputs.suites), ' ') }}
    outputs:
      # One per suite, because one commit status per suite hangs off them. A suite
      # that did not run leaves its own empty, and `status` never asks for it.
      verdict_shell: ${{ steps.verdict.outputs.verdict_shell }}
      verdict_sql: ${{ steps.verdict.outputs.verdict_sql }}
      verdict_medium: ${{ steps.verdict.outputs.verdict_medium }}

    steps:
      - name: Check the run directory
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          set -euo pipefail
          if [ -z "$RUNDIR" ] || [ ! -d "$RUNDIR" ]; then
            # Say which stage broke, not just that something did.
            if [ "$BUILD_RESULT" != 'success' ]; then
              echo "::error::the build ended $BUILD_RESULT, so no test ran at all."
            else
              echo "::error::plan ended $PLAN_RESULT, so the split stage broke."
            fi
            exit 1
          fi
          echo "run directory: $RUNDIR / suites: $SUITES_RUN"

      - name: Update timings for the next split
        run: |
          set -euo pipefail
          # feedback.log format: [OK]:  <case path> <milliseconds> EnvId=...
          # Only the shell runner writes one, so this is a no-op for the others.
          : > /tmp/new_timings.tsv
          for f in "$RUNDIR"/*/shard/*/artifacts/feedback.log; do
            [ -f "$f" ] || continue
            # A feedback.log with no verdict line is grep exit 1. This step has no
            # always(), so pipefail here would also drop Wall clock and Guard 3.
            { grep -E '^\[(OK|NOK)\]' "$f" 2>/dev/null || :; } | awk '
              {
                # Scan back for the number before EnvId=; assumes no spaces in the path.
                for (i = NF; i > 1; i--) {
                  if ($i ~ /^EnvId=/) { ms = $(i-1); path = $(i-2); break }
                }
                if (ms ~ /^[0-9]+$/ && path != "") printf "%s\t%.3f\n", path, ms / 1000
              }' >> /tmp/new_timings.tsv
          done
          new_n=$(wc -l < /tmp/new_timings.tsv)
          echo "measured by this run: $new_n"
          [ "$new_n" -gt 0 ] || { echo "no suite of this run measures case timings"; exit 0; }

          mkdir -p "$(dirname "$TIMINGS")"
          [ -f "$TIMINGS" ] || : > "$TIMINGS"
          old_n=$(wc -l < "$TIMINGS")

          # Newer values win, as they do in CircleCI. A row is the cost the split must
          # reserve for a case, and feedback.log records one verdict line per attempt.
          awk -F'\t' '
            NR == FNR { t[$1] += $2; next }       # this run: all attempts of a case
            !($1 in t) { t[$1] = $2 }             # old values only fill the gaps
            END { for (k in t) printf "%s\t%.3f\n", k, t[k] }   # seconds to 3 decimals, summed or not
          ' /tmp/new_timings.tsv "$TIMINGS" | sort > /tmp/merged.tsv

          # Losing this data takes the longest shard 24.8m -> 49.4m. The merge is a
          # union, so a shorter result means the merge broke. Keep the old file then.
          merged_n=$(wc -l < /tmp/merged.tsv)
          if [ "$merged_n" -lt "$old_n" ]; then
            echo "::error::the merge is shorter than the old file ($merged_n < $old_n). Not updating."
            exit 1
          fi

          # A cross-filesystem mv is copy+unlink: move onto GlusterFS, then rename.
          mv -f /tmp/merged.tsv "${TIMINGS}.tmp.$$"
          mv -f "${TIMINGS}.tmp.$$" "$TIMINGS"
          echo "timing data: $old_n -> $(wc -l < "$TIMINGS") rows"

      - name: Wall clock
        id: clock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          mkdir -p "$STAMPS"
          printf 'start\t%s\n' "$now" > "$STAMPS/collect.tsv"

          # The run start time is not in the context; one API call returns it.
          # queue_sec now covers gate + runner queue, so it is not comparable
          # with the pre-port runs.
          run_started=""
          if code=$(curl -sS -o /tmp/run.json -w '%{http_code}' \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"); then
            if [ "$code" = "200" ]; then
              run_started=$(date -u -d "$(jq -r '.run_started_at' /tmp/run.json)" +%s 2>/dev/null || echo "")
            fi
          fi
          [ -n "$run_started" ] || echo "::warning::could not read the run start time (HTTP ${code:-?}); queue time is omitted."

          dur() {   # <file> -> seconds; needs both start and end
            [ -f "$1" ] || { echo ""; return; }
            awk -F'\t' '$1=="start"{s=$2} $1=="end"{e=$2} END {if (s&&e) print e-s}' "$1"
          }
          fmt() { [ -z "$1" ] && { echo "(not measured)"; return; }; awk -v s="$1" 'BEGIN{printf "%ds (%.1fm)", s, s/60}'; }

          build_sec=$(dur "$STAMPS/build.tsv")
          plan_sec=$(dur "$STAMPS/plan.tsv")
          # Gone on a later attempt: build succeeded, so "Re-run failed jobs" did not
          # run it again and this attempt's stamps hold nothing for it. Without `|| :`
          # awk's exit 2 would end the step under set -e.
          build_start=$(awk -F'\t' '$1=="start"{print $2}' "$STAMPS/build.tsv" 2>/dev/null || :)
          queue_sec=""
          [ -n "$run_started" ] && [ -n "$build_start" ] && queue_sec=$((build_start - run_started))
          total_sec=""
          [ -n "$run_started" ] && total_sec=$((now - run_started))

          echo "=== wall clock ==="
          echo "queue        : $(fmt "$queue_sec")"
          echo "build        : $(fmt "$build_sec")"
          echo "split        : $(fmt "$plan_sec")"

          # Many shards per suite: longest, median, shortest and the wall-clock span.
          # Written per suite, because the summary reports one table per suite.
          for suite in $SUITES_RUN; do
            : > /tmp/shard_dur.txt
            for f in "$STAMPS"/shard-"$suite"-*.tsv; do
              [ -f "$f" ] || continue
              d=$(dur "$f"); [ -n "$d" ] && echo "$d" >> /tmp/shard_dur.txt
            done
            # The span counts a dead shard's start too, since it held the slot. `|| true`:
            # every shard dying is exactly when the wall clock must still be reported.
            stamp_field() { { awk -F'\t' -v k="$1" '$1==k {print $2}' "$STAMPS"/shard-"$suite"-*.tsv 2>/dev/null || true; } | sort -n; }
            first_start=$(stamp_field start | head -1)
            last_end=$(stamp_field end | tail -1)
            read -r sh_n sh_max sh_med <<<"$(sort -n /tmp/shard_dur.txt | awk '
              {a[NR]=$1} END {
                if (NR==0) {print "0 0 0"; exit}
                printf "%d %d %d\n", NR, a[NR], a[int((NR+1)/2)]
              }')"
            sh_span=""
            [ -n "$first_start" ] && [ -n "$last_end" ] && sh_span=$((last_end - first_start))
            # Quoted: the values read `12s (0.2m)`, and the summary step sources this.
            {
              echo "shard_max='$(fmt "$sh_max")'"
              echo "shard_med='$(fmt "$sh_med")'"
              echo "shard_span='$(fmt "$sh_span")'"
              echo "shard_n=$sh_n"
            } > "/tmp/clock.$suite"
            echo "$suite: longest $(fmt "$sh_max") / median $(fmt "$sh_med") / span $(fmt "$sh_span") / $sh_n shards"
          done
          echo "total        : $(fmt "$total_sec")  (run start to now; the rest of collect is not counted)"

          {
            echo "queue=$(fmt "$queue_sec")"
            echo "build=$(fmt "$build_sec")"
            echo "plan=$(fmt "$plan_sec")"
            echo "total=$(fmt "$total_sec")"
          } >> "$GITHUB_OUTPUT"

      - name: Guard 3 of 3, and the summary
        id: verdict
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          BRID: ${{ needs.plan.outputs.build_run_id }}
          WANT_BRID: ${{ needs.plan.outputs.build_run_id }}
          CTP_SHA: ${{ needs.plan.outputs.ctp_sha }}
          CTP_BRANCH: ${{ needs.plan.outputs.ctp_branch }}
          RERUN_FROM: ${{ needs.gate.outputs.rerun_from }}   # names the source run in the summary
          C_QUEUE: ${{ steps.clock.outputs.queue }}
          C_BUILD: ${{ steps.clock.outputs.build }}
          C_PLAN: ${{ steps.clock.outputs.plan }}
          C_TOTAL: ${{ steps.clock.outputs.total }}
        run: |
          set -euo pipefail
          attr() { jq -r --arg s "$1" --arg k "$2" '.[$s][$k] // ""' <<<"$SUITES"; }
          rc=0
          rm -rf /tmp/failed-logs; mkdir -p /tmp/failed-logs

          for suite in $SUITES_RUN; do
            repo=$(attr "$suite" tc_repo)
            vsrc=$(attr "$suite" verdict_src)
            d="$RUNDIR/$suite"
            . "$d/plan/split.meta"          # total, units, par, timed, tc_*, rerun_*
            echo "=================================================="
            echo "=== $suite: $total cases in $units units over $par shards"

            # --- gather -------------------------------------------------------
            # Not `ls <glob> | wc -l`: with no match it kills the step under pipefail --
            # exactly when every shard died and guard 3 must speak. find returns 0.
            planned=$(find "$d/plan/shards" -maxdepth 1 -name '*.list' 2>/dev/null | wc -l)
            done_n=$(find "$d/shard" -mindepth 2 -maxdepth 2 -name shard.done 2>/dev/null | wc -l)
            read_n=$(find "$d/shard" -mindepth 2 -maxdepth 2 -name build.read 2>/dev/null | wc -l)
            tcread_n=$(find "$d/shard" -mindepth 2 -maxdepth 2 -name tc.read 2>/dev/null | wc -l)
            echo "shard: planned $planned / published $done_n / build provenance $read_n / tc provenance $tcread_n"

            # A shard with no result file reached no case, so the failure list below
            # cannot see its share.
            unrun_n=0; dead_n=0
            : > /tmp/dead_shards.list
            for f in "$d"/plan/shards/*.list; do
              [ -f "$f" ] || continue
              i=$(basename "$f" .list)
              [ -f "$d/shard/$i/$vsrc" ] && continue
              n=$(awk -F'\t' -v k="$i" '$1 == k {print $2}' "$d/plan/plan.tsv")
              dead_n=$((dead_n + 1))
              unrun_n=$((unrun_n + ${n:-0}))
              printf 'shard %s: %s cases\n' "$i" "${n:-0}" >> /tmp/dead_shards.list
            done
            echo "shards that never ran a case: $dead_n / cases left unrun: $unrun_n"
            [ "$dead_n" -eq 0 ] || cat /tmp/dead_shards.list

            exec_sum=0; succ_sum=0; fail_sum=0; skip_sum=0
            for r in "$d"/shard/*/; do
              st="$r/$vsrc"
              [ -f "$st" ] || continue
              case "$vsrc" in
                test_status.data)
                  read -r e s fl k <<<"$(awk -F= '
                    /total_executed_case_count/ {e=$2+0}
                    /total_success_case_count/  {s=$2+0}
                    /total_fail_case_count/     {f=$2+0}
                    /total_skip_case_count/     {k=$2+0}
                    END {printf "%d %d %d %d\n", e, s, f, k}' "$st")"
                  ;;
                summary_info)
                  # One line per case: `<path>:ok    123ms`, `:nok`, or an empty
                  # verdict where the conf's exclusion list held the case back.
                  fl=$(grep -cE ':nok[[:space:]]+[0-9]+ms$' "$st" || :)
                  s=$(grep -cE ':ok[[:space:]]+[0-9]+ms$' "$st" || :)
                  k=$(grep -cE ':[[:space:]]+[0-9]+ms$' "$st" || :)
                  e=$((s + fl))
                  ;;
              esac
              exec_sum=$((exec_sum + e)); succ_sum=$((succ_sum + s))
              fail_sum=$((fail_sum + fl)); skip_sum=$((skip_sum + k))
            done
            echo "run $exec_sum / passed $succ_sum / failed $fail_sum / skipped $skip_sum (of $total)"

            # --- provenance ---------------------------------------------------
            # Every shard recorded the meta it read. They must all name the same run.
            : > /tmp/brids.txt
            for f in "$d"/shard/*/build.read; do
              [ -f "$f" ] || continue
              awk -F= '/^run_id=/ {print $2}' "$f" >> /tmp/brids.txt
            done
            uniq_n=$(sort -u /tmp/brids.txt | wc -l)
            echo "distinct run_ids among the builds shards read: $uniq_n"
            sort /tmp/brids.txt | uniq -c

            # Three ways to disagree, reported separately: they are different faults.
            if [ "$uniq_n" -eq 0 ]; then
              reason=none        # nobody recorded a provenance file
            elif [ "$uniq_n" -gt 1 ]; then
              reason=mixed       # shards read different builds
            elif [ "$(sort -u /tmp/brids.txt)" != "$WANT_BRID" ]; then
              reason=mismatch    # all the same, but not the build plan verified
            else
              reason=ok
            fi

            : > /tmp/tcs.txt
            for f in "$d"/shard/*/tc.read; do
              [ -f "$f" ] || continue
              awk -F= '/^tc_sha=/ {print $2}' "$f" >> /tmp/tcs.txt
            done
            tc_uniq=$(sort -u /tmp/tcs.txt | wc -l)
            echo "distinct testcase SHAs among the shards: $tc_uniq"
            sort /tmp/tcs.txt | uniq -c
            if [ "$tc_uniq" -eq 0 ]; then
              tc_reason=none
            elif [ "$tc_uniq" -gt 1 ]; then
              tc_reason=mixed
            elif [ "$(sort -u /tmp/tcs.txt)" != "$tc_sha" ]; then
              tc_reason=mismatch
            else
              tc_reason=ok
            fi
            echo "tc verdict: $tc_reason (plan chose: $tc_sha)"

            # --- failed cases -------------------------------------------------
            : > /tmp/failed.list
            mkdir -p "/tmp/failed-logs/$suite"
            logs_awk='
              BEGIN {
                while (idx != "" && (getline line < idx) > 0) {
                  split(line, f, "\t"); want[f[1]] = f[2]
                }
              }
              # First, so that a case log carrying the literal <testcase or
              # <failure does not restart the scan while the body is being read.
              body != "" {
                if (/\]\]><\/failure>/) {
                  sub(/\]\]><\/failure>.*$/, "")
                  print > body
                  close(body)
                  body = ""
                  next
                }
                print > body
                next
              }
              /<testcase/ {
                cur = ""
                # The leading space is required: CTP writes classname before name,
                # so /name="..."/ would match classname and extract a URL.
                if (match($0, / name="[^"]*"/)) {
                  cur = substr($0, RSTART + 7, RLENGTH - 8)
                }
              }
              /<failure/ && cur != "" {
                # No index: the XML is the list itself, numbered as met. With one:
                # only its cases, keyed by name -- the two files are written by
                # different passes and need not share an order.
                if (idx == "") { printf "%s\t%s\n", shard, cur; n = off + ++k }
                else if (cur in want) { n = want[cur] }
                else { cur = ""; next }
                body = dir "/" n ".log"
                rest = $0
                sub(/^.*<!\[CDATA\[/, "", rest)
                if (rest ~ /\]\]><\/failure>/) {
                  sub(/\]\]><\/failure>.*$/, "", rest)
                  print rest > body
                  close(body)
                  body = ""
                } else if (rest != "") {
                  print rest > body
                }
                cur = ""
                next
              }
              /<\/testcase>/ { cur = "" }
            '
            case "$vsrc" in
              test_status.data)
                for sdir in "$d"/shard/*/; do
                  x="$sdir/test-results/test-shell.xml"
                  [ -f "$x" ] || continue
                  i=$(basename "$sdir")
                  # Line k of failed.list is /tmp/failed-logs/<suite>/k.log. The offset
                  # carries that numbering across the shards.
                  off=$(wc -l < /tmp/failed.list)
                  awk -v shard="$i" -v off="$off" -v idx= \
                    -v dir="/tmp/failed-logs/$suite" "$logs_awk" "$x" >> /tmp/failed.list
                done
                ;;
              summary_info)
                # judge_sqlresult reads the same lines. The path is absolute; cut it
                # back to the repo-relative shape the shell suite's XML already has,
                # because plan puts the repo prefix back when it reads this file.
                for st in "$d"/shard/*/summary_info; do
                  [ -f "$st" ] || continue
                  i=$(basename "$(dirname "$st")")
                  { grep -E ':nok[[:space:]]+[0-9]+ms$' "$st" || :; } \
                    | sed -e 's/:nok[[:space:]].*$//' -e "s#^$WORKDIR/$repo/##" \
                    | awk -v shard="$i" '{printf "%s\t%s\n", shard, $0}' >> /tmp/failed.list
                done
                # The names in failed.list are the keys; its line numbers are the logs.
                awk -F'\t' '{printf "%s\t%d\n", $2, NR}' /tmp/failed.list > /tmp/failed.idx
                for x in "$d"/shard/*/test-results/*.xml; do
                  [ -f "$x" ] || continue
                  awk -v dir="/tmp/failed-logs/$suite" -v idx=/tmp/failed.idx "$logs_awk" "$x"
                done
                ;;
            esac
            failed_n=$(wc -l < /tmp/failed.list)
            echo "failed cases: $failed_n"
            [ "$failed_n" -eq 0 ] || head -30 /tmp/failed.list
            cp /tmp/failed.list "$d/collect/failed.list"
            cp /tmp/failed.list "/tmp/failed.$suite.list"

            # --- verdict ------------------------------------------------------
            covered=$((exec_sum + skip_sum))
            v_cov="OK"; [ "$covered" -ge "$total" ] || v_cov="FAIL"
            v_shard="OK"; [ "$done_n" -eq "$planned" ] || v_shard="FAIL"
            # How many recorded and whether they agree are separate faults.
            v_read="OK"; [ "$read_n" -eq "$planned" ] || v_read="FAIL"
            case "$reason" in
              ok)       v_same="OK all the same" ;;
              mixed)    v_same="FAIL shards differ ($uniq_n distinct)" ;;
              mismatch) v_same="FAIL all the same, but not the build plan verified" ;;
              *)        v_same="FAIL nobody recorded a provenance" ;;
            esac
            v_this="OK"; [ "$BRID" = "$GITHUB_RUN_ID" ] || v_this="reused"
            v_tcread="OK"; [ "$tcread_n" -eq "$planned" ] || v_tcread="FAIL"
            case "$tc_reason" in
              ok)       v_tcsame="OK all the same" ;;
              mixed)    v_tcsame="FAIL shards differ ($tc_uniq distinct)" ;;
              mismatch) v_tcsame="FAIL all the same, but not what plan chose" ;;
              *)        v_tcsame="FAIL nobody recorded a tc provenance" ;;
            esac
            . "/tmp/clock.$suite"      # shard_max, shard_med, shard_span, shard_n

            {
              echo "## gha-ci: $suite suite"
              echo
              # Name the source run at the top: results land under the new run id.
              if [ -n "$RERUN_FROM" ]; then
                echo "> **Only what run \`$RERUN_FROM\` left unhandled was re-run. This is not a full run.**"
                echo ">"
                echo "> carried over: $total cases in $units unit(s) — its failures, plus $rerun_unrun cases that never ran because a shard died whole."
                [ "${rerun_short:-0}" -eq 0 ] || echo "> **$rerun_short more were assigned there and never handled. Nothing names them, so this run cannot pass.**"
                [ "${rerun_gone:-0}" -eq 0 ] || echo "> **$rerun_gone of them are no longer in the tree (deleted or renamed), so this run cannot pass.**"
                echo ">"
                echo "> source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RERUN_FROM"
                echo
              fi
              if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
                echo "> **Attempt $GITHUB_RUN_ATTEMPT.** GitHub's _Re-run failed jobs_ ran only the jobs that failed, so a stage that did not run again reads \`(not measured)\` below. This is not \`/run rerun\`, which starts a new run."
                echo
              fi
              echo "### Coverage"
              echo
              echo "| item | value |"
              echo "|---|---|"
              echo "| selected cases | $total |"
              echo "| shards | planned $planned / published $done_n $v_shard |"
              echo "| run | $exec_sum |"
              echo "| skipped | $skip_sum |"
              echo "| handled | $covered / $total $v_cov |"
              s_dead=shards; [ "$dead_n" -eq 1 ] && s_dead=shard
              [ "$unrun_n" -eq 0 ] || echo "| **never run** | **$unrun_n** cases in $dead_n $s_dead that died whole |"
              echo "| passed | $succ_sum |"
              echo "| **failed** | **$fail_sum** |"
              [ "$timed" -eq 0 ] || echo "| cases split by measured timings | $timed |"
              echo
              echo "### Build provenance"
              echo
              echo "| item | value |"
              echo "|---|---|"
              echo "| build SHA | \`$SHA\` |"
              echo "| build namespace | \`$BUILD_NS\` |"
              echo "| current run | \`$GITHUB_RUN_ID\` |"
              echo "| built by run | \`$BRID\` $v_this |"
              echo "| shards that read the meta inside the mounted CUBRID | $read_n / $planned $v_read |"
              echo "| did every shard read the same build | $v_same |"
              echo
              echo "Provenance is read through the overlay the shard actually mounted, not from the volume."
              echo
              echo "### Testcase provenance"
              echo
              echo "| item | value |"
              echo "|---|---|"
              echo "| tc repo | \`$repo\` |"
              echo "| tc branch | \`$tc_branch\` |"
              echo "| tc commit | \`$tc_sha\` |"
              echo "| shards that recorded a tc provenance | $tcread_n / $planned $v_tcread |"
              echo "| same commit across shards | $v_tcsame |"
              echo
              echo "### CTP provenance"
              echo
              echo "| item | value |"
              echo "|---|---|"
              echo "| CTP branch | \`$CTP_BRANCH\` |"
              echo "| CTP commit | \`$CTP_SHA\` |"
              echo
              echo "Every shard is reset to this commit, and one that cannot reach it fails."
              echo
              echo "### Shards and wall clock"
              echo
              echo "| stage | time |"
              echo "|---|---|"
              echo "| queue (run start to build start) | $C_QUEUE |"
              echo "| build | $C_BUILD |"
              echo "| split | $C_PLAN |"
              echo "| longest shard | $shard_max |"
              echo "| median shard | $shard_med |"
              echo "| shard span (first start to last end) | $shard_span |"
              echo "| **total (run start to collect)** | **$C_TOTAL** |"
              echo
              if [ "$failed_n" -gt 0 ]; then
                echo "### Failed cases ($failed_n)"
                echo
                echo "| shard | case |"
                echo "|---|---|"
                head -50 /tmp/failed.list | awk -F'\t' '{printf "| %s | `%s` |\n", $1, $2}'
                [ "$failed_n" -gt 50 ] && echo && echo "_... and $((failed_n - 50)) more. The full list is [\`failed.list\`]($ARTIFACT_URL_BASE/${d#$CI_ROOT/}/collect/failed.list)._"
                echo
              else
                echo "### No failed cases"
                echo
              fi
              if [ "$unrun_n" -gt 0 ]; then
                echo "### Never run ($unrun_n)"
                echo
                echo "$dead_n $s_dead died before running a case, so these never ran and are in no failure list."
                echo
                awk '{print "- `" $0 "`"}' /tmp/dead_shards.list
                echo
              fi
              # /run is a pull request comment, so a batch run has nowhere to put it.
              if [ -n "$PR" ] && { [ "$failed_n" -gt 0 ] || [ "$unrun_n" -gt 0 ]; }; then
                # The CTP branch has to ride along, or the re-run silently takes develop.
                rerun_cmd="/run rerun $GITHUB_RUN_ID"
                [ "$CTP_BRANCH" = develop ] || rerun_cmd="$rerun_cmd testtools=$CTP_BRANCH"
                echo "Re-run the failures and everything that never ran: \`$rerun_cmd\`"
                echo
              fi
              echo "[Artifacts]($ARTIFACT_URL_BASE/${d#$CI_ROOT/}/)"
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            # Guard 3 of 3: a shard dying whole is invisible to guard 2.
            srb=0
            if [ "$done_n" -ne "$planned" ]; then
              echo "::error::$suite: only $done_n of $planned shards published a result; the rest died whole"
              srb=1
            fi
            if [ "$covered" -lt "$total" ]; then
              echo "::error::$suite: only $covered of $total cases were handled; cases went missing"
              srb=1
            fi
            if [ "$read_n" -ne "$planned" ]; then
              echo "::error::$suite: only $read_n of $planned shards recorded a build provenance; the rest died before mounting"
              srb=1
            fi
            case "$reason" in
              ok) ;;
              mixed)
                echo "::error::$suite: shards read different builds (run_id $uniq_n distinct). The artifact changed mid-pipeline"
                srb=1 ;;
              mismatch)
                echo "::error::$suite: every shard read the same build, but not the one from the run plan verified($BRID)"
                srb=1 ;;
              *)
                echo "::error::$suite: no shard recorded a build provenance"
                srb=1 ;;
            esac
            if [ "$tcread_n" -ne "$planned" ]; then
              echo "::error::$suite: only $tcread_n of $planned shards recorded a tc provenance"
              srb=1
            fi
            case "$tc_reason" in
              ok) ;;
              mixed)
                echo "::error::$suite: shards saw different testcases ($tc_uniq distinct). That disagrees with the split list"
                srb=1 ;;
              mismatch)
                echo "::error::$suite: every shard is the same, but not the commit plan chose($tc_sha)"
                srb=1 ;;
              *)
                echo "::error::$suite: no shard recorded a tc provenance"
                srb=1 ;;
            esac
            if [ "$fail_sum" -gt 0 ]; then
              echo "::error::$suite: $fail_sum failed"
              srb=1
            fi
            # A re-run replaces the source run's commit status, so it must not go green
            # over cases it did not run. A dead shard's share is carried by plan; this
            # is what is left.
            if [ -n "$RERUN_FROM" ] && [ "${rerun_short:-0}" -gt 0 ]; then
              echo "::error::run $RERUN_FROM left $rerun_short cases assigned but never handled, and nothing names them"
              echo "  This re-run could not carry them, so it cannot stand in for that run. Use /run $suite."
              srb=1
            fi
            if [ -n "$RERUN_FROM" ] && [ "${rerun_gone:-0}" -gt 0 ]; then
              echo "::error::$rerun_gone of the units run $RERUN_FROM left unhandled are no longer in the tree"
              echo "  Deleted or renamed, nothing here can tell which, and a renamed one has to"
              echo "  run under its new name. Use /run $suite."
              srb=1
            fi

            if [ "$srb" -eq 0 ]; then
              echo "$suite completed with no failures."
              v=pass
            else
              v=fail
              rc=1
            fi
            echo "verdict_$suite=$v" >> "$GITHUB_OUTPUT"
            # On the volume too, so the cleanup step below reads one file per suite
            # instead of three outputs it would have to name suite by suite.
            echo "$v" > "$d/collect/verdict"
            unset total units par timed tc_sha tc_branch rerun_unrun rerun_short rerun_gone \
                  shard_max shard_med shard_span shard_n
          done

          echo
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          # Next to the published build, not under the run directory: a reused
          # build outlives the run that made it. debug is what the suite mounted.
          # A build published before this layout carries no log, so no link.
          line="[Run directory]($ARTIFACT_URL_BASE/${RUNDIR#$CI_ROOT/}/)"
          blog="builds/$BUILD_NS/$SHA/debug/build.log"
          [ -f "$CI_ROOT/$blog" ] && line="$line · [build log]($ARTIFACT_URL_BASE/$blog)"
          {
            echo "$line"
            echo
            echo "Internal network only. The run directory is pruned 30 days after the run."
          } >> "$GITHUB_STEP_SUMMARY"

          exit $rc

      # Its own step, so it gets its own 1 MiB summary budget: when the logs are
      # too big, the upload GitHub drops is this one and the verdict above stays.
      #
      # Only the shell suite reaches this: its <failure> bodies carry the case log,
      # which the SQL runner keeps in its own result tree instead.
      - name: The log of each failed case
        if: always()
        run: |
          set -euo pipefail
          for suite in $SUITES_RUN; do
            list="/tmp/failed.$suite.list"
            [ -f "$list" ] || continue
            n=$(wc -l < "$list")
            [ "$n" -gt 0 ] || continue
            [ -n "$(find "/tmp/failed-logs/$suite" -name '*.log' -print -quit 2>/dev/null)" ] || continue

            # Same 50 the table above lists. Sharing the budget out over them lets a
            # run with one failure show that log whole, which is the common case.
            shown=$n
            [ "$shown" -gt 50 ] && shown=50
            budget=900000
            # 512 for the <details> wrapper of each case, so that the cases which
            # all reach their share still add up to less than the budget.
            case_max=$((budget / shown - 512))
            [ "$case_max" -gt 131072 ] && case_max=131072
            head_b=$((case_max / 2))
            tail_b=$((case_max - head_b))
            echo "$suite: cases $n / shown $shown / per case $case_max bytes"

            esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$1"; }

            base="$ARTIFACT_URL_BASE/${RUNDIR#$CI_ROOT/}/$suite"
            # The suites name their JUnit XML differently, so take it from the shards.
            xml_name=$(basename "$(ls "$RUNDIR/$suite"/shard/*/test-results/*.xml 2>/dev/null | head -1)" 2>/dev/null || :)
            xml_name=${xml_name:-test-shell.xml}
            {
              echo "### $suite: the log of each failed case"
              echo
              echo "What CTP wrote in the case's \`<failure>\`, trimmed to fit. Untrimmed, it is in the shard's \`$xml_name\`."
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            used=0; i=0; left=0
            while IFS=$'\t' read -r shard name; do
              i=$((i + 1))
              [ "$i" -le "$shown" ] || { left=$((left + 1)); continue; }
              log="/tmp/failed-logs/$suite/$i.log"
              {
                echo "<details>"
                echo "<summary>shard $shard &middot; <code>$name</code> &middot; <a href=\"$base/shard/$shard/test-results/$xml_name\">full log</a></summary>"
                echo
                # <pre> opens its own line: a blank line inside the log would end the
                # HTML block that <details> opened, and the rest would render as text.
                echo "<pre>"
              } > /tmp/block
              if [ ! -f "$log" ]; then
                echo "(this case left no log in the XML)" >> /tmp/block
              else
                # The 1 MiB is counted after escaping, so cut the escaped log, not
                # the log: a share measured before escaping is not the share spent.
                esc "$log" > /tmp/esc
                sz=$(wc -c < /tmp/esc)
                if [ "$sz" -le "$case_max" ]; then
                  cat /tmp/esc >> /tmp/block
                else
                  # sed drops the line the byte cut split, so <pre> holds whole
                  # lines and no entity is left half written.
                  head -c "$head_b" /tmp/esc | sed '$d' >> /tmp/block
                  printf '\n... %d KB of the middle is not here ...\n\n' $(((sz - head_b - tail_b) / 1024)) >> /tmp/block
                  tail -c "$tail_b" /tmp/esc | sed '1d' >> /tmp/block
                fi
              fi
              {
                echo "</pre>"
                echo
                echo "</details>"
                echo
              } >> /tmp/block
              size=$(wc -c < /tmp/block)
              if [ $((used + size)) -gt "$budget" ]; then
                left=$((left + 1))
                continue
              fi
              cat /tmp/block >> "$GITHUB_STEP_SUMMARY"
              used=$((used + size))
            done < "$list"

            if [ "$left" -gt 0 ]; then
              echo "_$left more cases failed. Their logs are in each shard's \`$xml_name\`, under [Artifacts]($base/)._" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "wrote $((i - left)) of $i case logs, $used bytes"
          done

  # always(), not success(): a red verdict is what the gate exists to show.
  status:
    name: status ${{ matrix.suite }}
    needs: [gate, collect]
    if: ${{ always() && needs.gate.outputs.run == 'true' && needs.gate.outputs.test == 'true' && needs.gate.outputs.post_status == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    strategy:
      # One context per suite. `/run all` posts three, and one red must not stop
      # the other two from being posted at all.
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.gate.outputs.suites) }}
    steps:
      - name: Post the verdict to the head commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
          SUITE: ${{ matrix.suite }}
          COLLECT: ${{ needs.collect.result }}
          # collect judges each suite on its own, so one red suite does not redden
          # the others' contexts. Empty means it never reached a verdict for this one.
          VERDICT: ${{ needs.collect.outputs[format('verdict_{0}', matrix.suite)] }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be 40 lowercase hex characters, got: ${SHA}"; exit 1
          fi
          CONTEXT=$(jq -r --arg s "$SUITE" '.[$s].status_ctx' <<<"$SUITES")
          case "$VERDICT" in
            pass) state=success; desc="$SUITE suite passed" ;;
            fail) state=failure; desc="$SUITE suite failed -- see the run" ;;
            *)
              # error, not failure: collect reached no verdict for this suite, so the
              # commit has not been judged. The batch takes such a commit again, and
              # branch protection refuses an error the way it refuses a failure.
              state=error
              if [ "$COLLECT" = cancelled ]; then
                desc="run was superseded or cancelled"
              else
                desc="$SUITE suite reached no verdict (collect $COLLECT)"
              fi ;;
          esac
          echo "collect=$COLLECT verdict=${VERDICT:-(none)} -> $state"
          jq -n --arg s "$state" --arg c "$CONTEXT" --arg d "$desc" \
            --arg u "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$s, context:$c, target_url:$u, description:$d}' > /tmp/st.json
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d @/tmp/st.json)
          echo "HTTP $code"
          if [ "$code" != "201" ]; then
            echo "::error::could not post the verdict status"
            jq -r '.message // .' /tmp/resp.json 2>/dev/null | head -3
            exit 1
          fi
          echo "posted ${state} on ${SHA} as '${CONTEXT}'"
