# CUBRIDQA-1526 -- build, publish, then run the shell suite on self-hosted runners.
# Replaces the CircleCI jobs build_debug + download-build + test_shell. Both stay
# live during the migration, so one /run comment can be compared across the two.
#
# Trigger
#   /run shell | /run all   on a pull request. Write access only; claims 50 runners
#   gh workflow run gha-ci.yml -f sha=<40-char SHA>   default branch only
#
# Prerequisites in the runner, not here. Apply ARC-1526-* per RUNBOOK-1526.
#   pod template   shareProcessNamespace, or the shell tests hang instead of
#                  failing; privileged, or the overlay mount fails
#   job hook       ALLOWED_EVENTS must include issue_comment
#
# Rationale, measurements and the shared-path analysis: CUBRIDQA-1526.

name: gha-ci

on:
  # Which comments wake this is decided by the gate job; it cannot be narrowed here.
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      sha:
        description: "Engine commit to test: full 40-char SHA"
        required: true
        type: string
      force_build:
        description: "Rebuild even when this SHA is already published"
        required: false
        default: false
        type: boolean
      parallelism:
        description: "Shard count, 1..256 (CircleCI test_shell uses 50)"
        required: false
        default: "50"
        type: string
      limit:
        description: "Cap on case count; 0 means all of them"
        required: false
        default: "0"
        type: string
      rerun_from:
        description: "Re-run only the cases that failed in this run id. Takes precedence over limit"
        required: false
        default: ""
        type: string
      sabotage:
        description: "Break the split on purpose to check the guards: none | empty-shard | lose-shard"
        required: false
        default: "none"
        type: string
      pr:
        description: "Engine PR number. Testcases come from tc/pr-<number> and results are posted there"
        required: false
        default: ""
        type: string

# shard is 50 privileged pods running testcase code; it holds no token at all.
permissions: {} # jobs opt-in below

# One group per pull request, so different PRs run in parallel. A global group
# would cancel someone else's run once anyone can trigger by comment.
# The dispatch fallback is the SHA, not run_id: two force_build dispatches for one
# SHA would race the republish and pull the overlay lowerdir from a running shard.
concurrency:
  group: gha-ci-${{ github.event.issue.number || inputs.pr || inputs.sha }}
  cancel-in-progress: true

env:
  # Not the operational builds/ path -- the CircleCI test_shell still reads that.
  CI_ROOT: /home/build-cache/gha-ci
  CI_BUILD_ROOT: /home/build-cache/gha-ci/builds
  TIMINGS: /home/build-cache/gha-ci/timings/shell.tsv
  STAMPS: /home/build-cache/gha-ci/runs/${{ github.run_id }}/stamps
  BUILD_SENTINEL: .complete
  BUILD_META: .gha-ci-build.meta

jobs:
  # Both triggers become one shape: every job below reads needs.gate.outputs.
  # GitHub-hosted, so the permission decision lands before a runner is claimed.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # reads the head SHA of the commented PR
    # Same author set as comment_trigger.yml. CONTRIBUTOR is refused.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/run')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) }}
    outputs:
      run: ${{ steps.g.outputs.run }}
      sha: ${{ steps.g.outputs.sha }}
      pr: ${{ steps.g.outputs.pr }}
      parallelism: ${{ steps.g.outputs.parallelism }}
      limit: ${{ steps.g.outputs.limit }}
      force_build: ${{ steps.g.outputs.force_build }}
      rerun_from: ${{ steps.g.outputs.rerun_from }}
      sabotage: ${{ steps.g.outputs.sabotage }}
    steps:
      - name: Resolve the trigger
        id: g
        env:
          # Inputs arrive through env, never interpolated into the script body.
          EV: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          IN_SHA: ${{ inputs.sha }}
          IN_PR: ${{ inputs.pr }}
          IN_PAR: ${{ inputs.parallelism }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_FORCE: ${{ inputs.force_build }}
          IN_RERUN: ${{ inputs.rerun_from }}
          IN_SAB: ${{ inputs.sabotage }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail

          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          if [ "$EV" = 'workflow_dispatch' ]; then
            # A dispatch supplies every value; pass them through.
            emit run true
            emit sha "$IN_SHA"
            emit pr "$IN_PR"
            emit parallelism "$IN_PAR"
            emit limit "$IN_LIMIT"
            emit force_build "$IN_FORCE"
            emit rerun_from "$IN_RERUN"
            emit sabotage "$IN_SAB"
            echo "dispatch: sha=$IN_SHA pr=${IN_PR:-(none)} parallelism=$IN_PAR"
            exit 0
          fi

          # Regex must stay identical to comment_trigger.yml: one syntax to learn.
          if ! [[ "$BODY" =~ ^/run([[:space:]]+(all|shell|sql|medium)){1,4}$ ]]; then
            echo "[info] not /run syntax, ignoring: $BODY"
            emit run false
            exit 0
          fi

          # Only shell lives here; sql and medium are CircleCI's.
          if ! [[ "$BODY" =~ (^|[[:space:]])(all|shell)($|[[:space:]]) ]]; then
            echo "[info] shell was not requested, ignoring: $BODY"
            emit run false
            exit 0
          fi

          # Pin the head commit. A branch name is a moving target.
          sha=$(gh api "repos/${REPO}/pulls/${ISSUE}" --jq '.head.sha') || {
            echo "::error::could not read the head SHA of PR ${ISSUE}"; exit 1; }
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head SHA is not 40 hex characters: $sha"; exit 1
          fi

          emit run true
          emit sha "$sha"
          emit pr "$ISSUE"
          # The comment path exposes no knobs; use workflow_dispatch to change these.
          emit parallelism 50
          emit limit 0
          emit force_build false
          emit rerun_from ""
          emit sabotage none
          echo "comment: PR #${ISSUE} / head ${sha} / parallelism 50"

  build_debug:
    name: build (rl8.10 node)
    needs: gate
    permissions: {} # no token used; the engine is cloned from the GlusterFS mirror
    if: needs.gate.outputs.run == 'true'
    runs-on: cubrid-arc
    timeout-minutes: 120
    container:
      image: cubridci/cubridci:rl8.10
    defaults:
      run:
        shell: bash
    outputs:
      sha: ${{ steps.args.outputs.sha }}
      mode: ${{ steps.reuse.outputs.mode }}

    env:
      # Same values as the CircleCI executor cubrid-build-node.
      BUILD_MIRROR: /home/build-cache/cubrid-mirror
      CCACHE_DIR: /home/build-cache/ccache-shell-debug
      CCACHE_COMPILERCHECK: content
      # No CCACHE_HARDLINK: cache on gluster, build tree pod-local -- it would copy.
      CI_LOG_ROOT: /home/build-cache/gha-ci/logs

    steps:
      - name: 0. Environment check
        id: args
        env:
          # Inputs via env, never interpolated into the body.
          INPUT_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -eo pipefail
          echo "=== identity ==="
          echo "job pod    : $(hostname)"
          echo "runner     : ${RUNNER_NAME:-(none)}"
          echo "image      : $(cat /etc/redhat-release)"

          echo "=== input SHA ==="
          # Full 40-char SHA only. Short SHAs and ref names are refused.
          if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be 40 lowercase hex characters"
            exit 1
          fi
          echo "SHA: $INPUT_SHA"
          echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          echo "SHA=$INPUT_SHA" >> "$GITHUB_ENV"

          echo "=== mounts ==="
          ls -ld /home/build-cache "$BUILD_MIRROR/cubrid.git" "$CCACHE_DIR" || true
          if [ ! -d "$BUILD_MIRROR/cubrid.git" ]; then
            echo "::error::the mirror is not visible. The pod template did not reach the job pod."
            exit 1
          fi

          echo "=== writable ==="
          # Checked now rather than at publish time, 30 minutes later.
          mkdir -p "$CI_BUILD_ROOT"
          probe="$CI_BUILD_ROOT/.write-probe.$$"
          touch "$probe" && rm -f "$probe"
          echo "writable"

          # Wall-clock stamps. build_debug opens the run dir; plan's mkdir -p keeps it.
          mkdir -p "$STAMPS"
          printf 'start\t%s\n' "$(date -u +%s)" > "$STAMPS/build.tsv"

          # WAN baseline. GlusterFS goes via hostPath, so this counts GitHub + 3rdparty.
          awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' \
            /proc/net/dev > "$RUNNER_TEMP/rx0"

          # The workspace is owned by runner uid 1001; git refuses it (dubious ownership).
          chown root:root "$GITHUB_WORKSPACE"
          ls -ld "$GITHUB_WORKSPACE"

      - name: 1. Is this SHA already published
        id: reuse
        env:
          INPUT_FORCE: ${{ needs.gate.outputs.force_build }}
        run: |
          set -eo pipefail
          # No `step halt` in GHA: emit an output and gate later steps on it.
          dir="$CI_BUILD_ROOT/$SHA/debug"
          if [ "$INPUT_FORCE" = 'true' ]; then
            echo "force_build=true, rebuilding even though an artifact exists"
            mode=built
          elif [ -f "$dir/$BUILD_SENTINEL" ]; then
            echo "already published: $dir"
            mode=reused
          else
            echo "nothing published, building"
            mode=built
          fi
          echo "mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: 2. Source, borrowed from the mirror with only the delta fetched
        if: steps.reuse.outputs.mode != 'reused'
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"

          # Never write to the mirror: a pod dying mid-fetch leaves a .lock that stalls
          # every later build. Borrow history with --shared, fetch here.
          git clone --quiet --shared --no-checkout "$BUILD_MIRROR/cubrid.git" .

          # Not shallow: the serial is `git rev-list --count`; shallow stamps 0001.
          git fetch --quiet https://github.com/CUBRID/cubrid.git "$SHA"
          git checkout --quiet --detach "$SHA"

          git submodule sync
          git submodule init
          # Only submodules the mirror has are pointed at it; the rest come from GitHub.
          while read -r sub_sha sub_path; do
            url=$(git config -f .gitmodules --get "submodule.${sub_path}.url")
            mirror="$BUILD_MIRROR/$(basename "${url%.git}").git"
            if git -C "$mirror" cat-file -e "${sub_sha}^{commit}" 2>/dev/null; then
              git config "submodule.${sub_path}.url" "$mirror"
              echo "[mirror] $sub_path"
            else
              echo "[warn] $sub_path is not in the mirror, fetching it in full from GitHub"
            fi
          done < <(git ls-tree HEAD | awk '$2 == "commit" { print $3, $4 }')

          # git 2.38 stopped cloning submodules from local paths (CVE-2022-39253).
          git -c protocol.file.allow=always submodule update

          echo "HEAD        : $(git rev-parse HEAD)"
          echo "build serial: $(git rev-list --count HEAD)"

      - name: 3. Build, from the source root
        if: steps.reuse.outputs.mode != 'reused'
        run: |
          set -eo pipefail
          # entrypoint's run_build writes build.log to cwd but checks $CUBRID_SRCDIR.
          # One level down, a failed build reports success. Run from the source root.
          cd "$GITHUB_WORKSPACE"

          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          ccache -z

          # No -j: ninja 1.11.1 reads the cgroup quota and decides for itself.
          /entrypoint.sh build -m optdebug
          ccache -s

      # cancel-in-progress makes cancellation a normal exit, so staging survives;
      # one build is 745MB and the cleanup CronJob does not look at this path.
      - name: 3b. Sweep what cancelled runs left behind
        run: |
          set -eo pipefail
          swept=0
          for pat in "$CI_BUILD_ROOT"/*/debug.tmp.* "$CI_BUILD_ROOT"/*/debug.old.* \
                     "$CI_ROOT"/runs/*/testtools "$CI_ROOT"/runs/*/testtools.tmp.* ; do
            # An unmatched glob arrives as the pattern itself; -e filters it out.
            [ -e "$pat" ] || continue
            # Leave this run's own files alone.
            case "$pat" in *".${GITHUB_RUN_ID}"|*"/${GITHUB_RUN_ID}/"*) continue ;; esac
            [ -n "$(find "$pat" -maxdepth 0 -mtime +0 2>/dev/null)" ] || continue
            echo "removing: $pat ($(du -sh "$pat" 2>/dev/null | cut -f1))"
            rm -rf "$pat" && swept=$((swept + 1))
          done
          echo "swept: $swept"

      - name: 4. Publish, staged then moved in with one rename
        id: publish
        env:
          MODE: ${{ steps.reuse.outputs.mode }}
        run: |
          set -eo pipefail
          dir="$CI_BUILD_ROOT/$SHA/debug"

          if [ "$MODE" = 'reused' ]; then
            echo "reused, not publishing: $dir"
          else
            tmp="${dir}.tmp.${GITHUB_RUN_ID}"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            cp -a /home/CUBRID "$tmp/CUBRID"

            # Inside the CUBRID tree on purpose: shard mounts it as the overlay lowerdir,
            # so reading this file proves the mount the tests actually use.
            meta=$(printf 'sha=%s\nrun_id=%s\nrun_attempt=%s\nbuilt_at=%s\nworkflow=gha-ci\n' \
              "$SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(date -u +%s)")
            printf '%s\n' "$meta" > "$tmp/CUBRID/$BUILD_META"
            printf '%s\n' "$meta" > "$tmp/build.meta"

            # Sentinel created inside staging, so the rename never exposes a partial tree.
            touch "$tmp/$BUILD_SENTINEL"

            # rename(2) cannot replace a non-empty directory, so force_build needs two
            # renames. $dir is briefly absent -- plan's sentinel check catches that.
            old="${dir}.old.${GITHUB_RUN_ID}"
            rm -rf "$old"
            if [ -e "$dir" ]; then
              mv -T "$dir" "$old" || {
                rm -rf "$tmp"
                echo "::error::could not move the old artifact aside: $dir"; exit 1; }
            fi
            if ! mv -T "$tmp" "$dir"; then
              # Roll back. The old build surviving beats nothing surviving.
              [ -e "$old" ] && mv -T "$old" "$dir"
              rm -rf "$tmp"
              echo "::error::could not move the new artifact in: $dir"; exit 1
            fi
            rm -rf "$old"
          fi

          # plan and shard assume these three exist. Better to die here.
          for f in "$BUILD_SENTINEL" build.meta "CUBRID/$BUILD_META"; do
            [ -f "$dir/$f" ] || {
              echo "::error::the artifact has no $f: $dir"
              echo "  Builds published before this workflow carry no meta. Re-run with force_build=true."
              exit 1
            }
          done
          by=$(awk -F= '/^run_id=/ {print $2}' "$dir/build.meta")
          echo "artifact : $dir"
          echo "built by : $by (this run: $GITHUB_RUN_ID)"
          cat "$dir/build.meta"
          du -sh "$dir"
          df -h /home/build-cache | tail -1

          printf 'end\t%s\n' "$(date -u +%s)" >> "$STAMPS/build.tsv"

      - name: 5. WAN and build log
        if: always()
        run: |
          set -eo pipefail
          if [ -f "$RUNNER_TEMP/rx0" ]; then
            rx1=$(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev)
            echo "WAN received by this job: $(( (rx1 - $(cat "$RUNNER_TEMP/rx0")) / 1048576 )) MB"
            echo "  baseline: 372.02MB measured, replacing a 290MB CircleCI artifact"
          fi

          # build.log is the only clue on failure, and it does not reach the GHA log.
          f="$GITHUB_WORKSPACE/build.log"
          if [ -f "$f" ]; then
            mkdir -p "$CI_LOG_ROOT"
            cp "$f" "$CI_LOG_ROOT/${GITHUB_RUN_ID}-build.log"
            echo "saved: $CI_LOG_ROOT/${GITHUB_RUN_ID}-build.log ($(wc -l < "$f") lines)"
            echo "=== last 60 lines of build.log ==="
            tail -60 "$f"
          fi

  plan:
    name: plan
    needs: [gate, build_debug]
    permissions: {} # testcases come from the App token; GITHUB_TOKEN is unused
    runs-on: cubrid-arc
    timeout-minutes: 30
    container:
      image: cubridci/cubridci:test_shell
    defaults:
      run:
        shell: bash
    env:
      TC_DIR: /home/cubrid-testcases-private-ex
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      total: ${{ steps.split.outputs.total }}
      rundir: ${{ steps.split.outputs.rundir }}
      sha: ${{ needs.build_debug.outputs.sha }}
      timed: ${{ steps.split.outputs.timed }}
      build_run_id: ${{ steps.build.outputs.build_run_id }}
      tc_sha: ${{ steps.tc.outputs.tc_sha }}
      tc_branch: ${{ steps.tc.outputs.tc_branch }}

    steps:
      - name: Validate inputs
        id: args
        env:
          IN_PAR: ${{ needs.gate.outputs.parallelism }}
          IN_LIMIT: ${{ needs.gate.outputs.limit }}
          IN_SAB: ${{ needs.gate.outputs.sabotage }}
          IN_RERUN: ${{ needs.gate.outputs.rerun_from }}
        run: |
          set -eo pipefail
          # Inputs arrive through env, never interpolated into the script body.
          if [[ ! "$IN_PAR" =~ ^[0-9]{1,3}$ ]] || [ "$IN_PAR" -lt 1 ] || [ "$IN_PAR" -gt 256 ]; then
            echo "::error::parallelism must be an integer in 1..256"; exit 1
          fi
          if [[ ! "$IN_LIMIT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::limit must be an integer"; exit 1
          fi
          case "$IN_SAB" in
            none|empty-shard|lose-shard) ;;
            *) echo "::error::sabotage must be none|empty-shard|lose-shard"; exit 1 ;;
          esac
          if [ -n "$IN_RERUN" ] && [[ ! "$IN_RERUN" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::rerun_from must be a run id (integer)"; exit 1
          fi
          echo "parallelism=$IN_PAR / limit=$IN_LIMIT / sabotage=$IN_SAB / rerun_from=${IN_RERUN:-(none)}"
          echo "par=$IN_PAR" >> "$GITHUB_OUTPUT"
          echo "limit=$IN_LIMIT" >> "$GITHUB_OUTPUT"

          mkdir -p "$STAMPS"
          printf 'start\t%s\n' "$(date -u +%s)" > "$STAMPS/plan.tsv"

      - name: Verify the build published by build_debug
        id: build
        env:
          SHA: ${{ needs.build_debug.outputs.sha }}
          MODE: ${{ needs.build_debug.outputs.mode }}
        run: |
          set -eo pipefail
          dir="$CI_BUILD_ROOT/$SHA/debug"

          # The sentinel marks a finished tree; directory existence passes a partial one.
          [ -f "$dir/$BUILD_SENTINEL" ] || {
            echo "::error::the build is not finished publishing (no sentinel): $dir"; exit 1; }
          [ -d "$dir/CUBRID" ] || { echo "::error::no CUBRID tree: $dir"; exit 1; }
          [ -f "$dir/build.meta" ] || {
            echo "::error::no build.meta: $dir"
            echo "  An artifact published before this workflow. Re-run with force_build=true."; exit 1; }

          meta_sha=$(awk -F= '/^sha=/ {print $2}' "$dir/build.meta")
          [ "$meta_sha" = "$SHA" ] || {
            echo "::error::meta sha($meta_sha) differs from build_debug sha($SHA)"; exit 1; }

          brid=$(awk -F= '/^run_id=/ {print $2}' "$dir/build.meta")
          echo "build    : $dir"
          echo "built by : $brid (this run: $GITHUB_RUN_ID / mode=$MODE)"
          echo "published: $(stat -c '%y' "$dir")"
          echo "build_run_id=$brid" >> "$GITHUB_OUTPUT"

          # Same App as tc-branch-sync/tc-merge-gate. 1-hour token, two repos.
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          # One private repo only: asking for cubrid-testtools fails token issuance.
          repositories: cubrid-testcases-private-ex
          owner: CUBRID
          # Read-only: the default would carry the installation's contents: write.
          permission-contents: read

      - name: Mask the token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "::add-mask::$APP_TOKEN"

      - name: Refresh testcases, decided once here
        id: tc
        env:
          GHI_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PR: ${{ needs.gate.outputs.pr }}
        run: |
          set -eo pipefail
          # Overlay first: the node seed (/ro) is the lowerdir, so entrypoint sees .git.
          mkdir -p /rw/upper /rw/work "$TC_DIR"
          mount -t overlay overlay -o lowerdir=/ro,upperdir=/rw/upper,workdir=/rw/work "$TC_DIR"
          echo "seed HEAD : $(git -C "$TC_DIR" log -1 --format='%h %ci' 2>/dev/null)"

          # Same settings as entrypoint's configure(); ls-remote needs them first.
          git config --global url."https://x-access-token:${GHI_TOKEN}@github.com/".insteadof https://github.com/

          # The sync bot creates tc/pr-<N> when the PR opens. Same rule as CircleCI.
          TC_REPO=https://github.com/CUBRID/cubrid-testcases-private-ex.git
          if [ -n "$INPUT_PR" ]; then
            if [[ ! "$INPUT_PR" =~ ^[0-9]{1,7}$ ]]; then
              echo "::error::pr must be an integer"; exit 1
            fi
            TC_BRANCH="tc/pr-${INPUT_PR}"
          else
            TC_BRANCH=develop
          fi

          # May not exist, e.g. a PR opened before the sync bot. Falls back to develop.
          if ! git ls-remote --exit-code --heads "$TC_REPO" "$TC_BRANCH" >/dev/null 2>&1; then
            echo "::warning::$TC_BRANCH does not exist, falling back to develop"
            TC_BRANCH=develop
          fi
          echo "tc branch  : $TC_BRANCH"

          # Same command the CircleCI test_shell runs on every node.
          export BRANCH_TESTCASES="$TC_BRANCH"
          rx0=$(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev)
          /entrypoint.sh checkout
          rx1=$(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev)
          echo "refresh WAN: $(( (rx1 - rx0) / 1048576 )) MB"

          # Pin the commit: if plan's list and the shard's checkout drift, cases vanish.
          TC_SHA=$(git -C "$TC_DIR" rev-parse HEAD)
          echo "tc SHA    : $TC_SHA"
          echo "tc HEAD   : $(git -C "$TC_DIR" log -1 --format='%ci %s')"
          {
            echo "tc_sha=$TC_SHA"
            echo "tc_branch=$TC_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Case list and LPT split
        id: split
        env:
          PAR: ${{ steps.args.outputs.par }}
          LIMIT: ${{ steps.args.outputs.limit }}
          SABOTAGE: ${{ needs.gate.outputs.sabotage }}
          RERUN_FROM: ${{ needs.gate.outputs.rerun_from }}
        run: |
          set -eo pipefail

          # _25_unstable must be removed after checkout: `reset --hard` restores it.
          rm -rf "$TC_DIR/shell/_25_unstable"     # same exclusion as CircleCI

          find "$TC_DIR/shell" -path '*/cases/*.sh' 2>/dev/null \
            | grep -P '/([^/]+)/cases/\1\.sh$' \
            | sed "s#^$TC_DIR/#cubrid-testcases-private-ex/#" \
            | sort > /tmp/all.list
          # Re-run only failures. failed.list is <shard>\t<shell/...>; align the prefix.
          if [ -n "$RERUN_FROM" ]; then
            src="$CI_ROOT/runs/$RERUN_FROM/failed.list"
            [ -f "$src" ] || { echo "::error::no failed.list: $src"; exit 1; }
            cut -f2 "$src" | sed 's#^#cubrid-testcases-private-ex/#' | sort -u > /tmp/want.list
            want=$(wc -l < /tmp/want.list)
            # Keep only what is in the tree now; cases deleted since are dropped.
            grep -xF -f /tmp/want.list /tmp/all.list > /tmp/cases.list || : > /tmp/cases.list
            got=$(wc -l < /tmp/cases.list)
            echo "re-running: $got of the $want failures from run $RERUN_FROM are still in the tree"
            if [ "$got" -ne "$want" ]; then
              echo "::warning::$((want - got)) are not in the tree now (deleted or renamed)"
              comm -23 /tmp/want.list <(sort /tmp/cases.list) | sed 's/^/  missing: /'
            fi
          elif [ "$LIMIT" -gt 0 ]; then
            head -"$LIMIT" /tmp/all.list > /tmp/cases.list
          else
            cp /tmp/all.list /tmp/cases.list
          fi
          total=$(wc -l < /tmp/cases.list)
          echo "all cases: $(wc -l < /tmp/all.list) / selected: $total"
          # Zero from a re-run and zero from a broken glob have different causes.
          if [ "$total" -eq 0 ]; then
            if [ -n "$RERUN_FROM" ]; then
              echo "::error::nothing to run: none of the failures from run $RERUN_FROM can be run now"
            else
              echo "::error::no cases at all: the glob matched nothing. Check the testcase tree"
            fi
            exit 1
          fi

          # Format: <case path>\t<seconds>.
          mkdir -p "$(dirname "$TIMINGS")"
          [ -f "$TIMINGS" ] || : > "$TIMINGS"
          timings_n=$(wc -l < "$TIMINGS")
          echo "timing data: $timings_n rows"

          if [ -s "$TIMINGS" ]; then
            dflt=$(cut -f2 "$TIMINGS" | sort -n | awk '{a[NR]=$1} END {print (NR? a[int(NR/2)+1] : 10)}')
          else
            # Empty timings turn LPT into name order: longest shard 24.8m -> 49.4m.
            # A silent regression, so say it out loud.
            echo "::warning::timing data is empty, so LPT degrades to name order --"
            echo "::warning::  the longest shard roughly doubles. Check $TIMINGS."
            echo "::warning::  If the path moved, copy it from the old one (see RUNBOOK)."
            dflt=10
          fi
          echo "default seconds for an unseen case: $dflt"

          # LPT: longest first onto the lightest shard. Durations span 1.5s to 301s.
          # In awk, because the test_shell image has no python.
          mkdir -p /tmp/shards
          awk -v dflt="$dflt" -v tf="$TIMINGS" '
            BEGIN {
              FS = "\t"
              while ((getline line < tf) > 0) {
                n = split(line, a, "\t")
                if (n >= 2) t[a[1]] = a[2] + 0
              }
              close(tf)
            }
            {
              c = $0
              if (c in t) { sec = t[c]; timed++ } else { sec = dflt }
              # Sort key for descending order; ties fall back to name, deterministically.
              printf "%015.3f\t%s\n", sec, c
            }
            # timed may never increment, which prints an empty field; +0 forces 0.
            END { print timed + 0 > "/tmp/timed.count" }
          ' /tmp/cases.list | sort -rn -k1,1 -k2,2 > /tmp/sorted.tsv

          timed=$(cat /tmp/timed.count 2>/dev/null || echo 0)
          timed=${timed:-0}
          echo "measured: $timed cases / default: $((total - timed)) cases"

          awk -v par="$PAR" '
            BEGIN { FS = "\t"; for (i = 0; i < par; i++) load[i] = 0 }
            {
              # Find the shard with the lightest load so far.
              best = 0
              for (i = 1; i < par; i++) if (load[i] < load[best]) best = i
              load[best] += $1
              printf "%s\n", $2 >> sprintf("/tmp/shards/%02d.list", best)
              cnt[best]++
            }
            END {
              for (i = 0; i < par; i++)
                printf "%02d\t%d\t%.1f\n", i, cnt[i] + 0, load[i]
            }
          ' /tmp/sorted.tsv > /tmp/plan.tsv

          echo
          echo "=== split (shard / cases / estimated seconds) ==="
          sort -t$'\t' -k3,3 -rn /tmp/plan.tsv | head -5
          echo "..."
          sort -t$'\t' -k3,3 -rn /tmp/plan.tsv | tail -3
          echo
          awk -F'\t' '{s+=$3; if(NR==1||$3>mx)mx=$3; if(NR==1||$3<mn)mn=$3}
                      END {printf "estimated longest shard: %.1fs (%.1fm) / shortest: %.1fs / spread: %.2fx\n",
                             mx, mx/60, mn, (mn>0? mx/mn : 0)
                           printf "sum of all shards: %.1fm if run in sequence\n", s/60}' /tmp/plan.tsv

          # Guard 1 of 3: does the split add up to the whole?
          got=$(awk -F'\t' '{s+=$2} END {print s+0}' /tmp/plan.tsv)
          echo
          echo "guard 1: split total $got vs all $total"
          if [ "$got" -ne "$total" ]; then
            echo "::error::the split lost cases ($got != $total)"
            exit 1
          fi
          echo "  matches"

          rundir="$CI_ROOT/runs/${GITHUB_RUN_ID}"
          mkdir -p "$rundir/shards" "$rundir/results"
          for i in $(seq 0 $((PAR - 1))); do
            f=$(printf "%02d.list" "$i")
            # Fewer cases than shards is a bug, not a normal state. Refuse it here.
            if [ ! -f "/tmp/shards/$f" ]; then
              echo "::error::no cases assigned to shard $i. Is parallelism($PAR) larger than the case count($total)?"
              exit 1
            fi
            cp "/tmp/shards/$f" "$rundir/shards/$f"
          done
          cp /tmp/plan.tsv "$rundir/plan.tsv"
          cp /tmp/cases.list "$rundir/cases.list"

          # sabotage: check that the guards actually fire.
          case "$SABOTAGE" in
            empty-shard)
              echo "::warning::sabotage=empty-shard, emptying shard 00's share. shard 00 must fail"
              : > "$rundir/shards/00.list"
              ;;
            lose-shard)
              echo "::warning::sabotage=lose-shard, deleting shard 00's share file. shard 00 must fail"
              rm -f "$rundir/shards/00.list"
              ;;
          esac

          # --- matrix ---
          matrix=$(seq 0 $((PAR - 1)) | awk '{printf "%02d\n", $1}' | jq -R . | jq -sc .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "timed=$timed" >> "$GITHUB_OUTPUT"
          echo "rundir=$rundir" >> "$GITHUB_OUTPUT"
          echo
          echo "published: $rundir"

      - name: Publish CTP for the shards
        run: |
          set -eo pipefail
          # On GlusterFS so 50 shards copy it over the LAN and shard WAN stays 0.
          # plan clones in full (~25MB): the nodes carry no testtools seed -- CUBRIDQA-1497.
          src="$WORKDIR/cubrid-testtools"
          [ -d "$src/.git" ] || { echo "::error::checkout did not fetch CTP: $src"; exit 1; }
          # Per-run path, not a shared one: publishing leaves the seed briefly absent,
          # which another run's shard would read. collect removes it (59MB each).
          seed="$CI_ROOT/runs/${GITHUB_RUN_ID}/testtools"
          head=$(git -C "$src" rev-parse HEAD)

          tmp="${seed}.tmp.${GITHUB_RUN_ID}"
          rm -rf "$tmp"
          mkdir -p "$(dirname "$seed")"
          cp -a "$src" "$tmp"

          # One rename publishes it, so no consumer sees a half-copied tree.
          rm -rf "${seed}.old"
          [ -d "$seed" ] && mv -T "$seed" "${seed}.old"
          mv -T "$tmp" "$seed"
          rm -rf "${seed}.old"
          echo "CTP seed: $seed @ $head"

          printf 'end\t%s\n' "$(date -u +%s)" >> "$STAMPS/plan.tsv"

      - name: Split summary
        env:
          TOTAL: ${{ steps.split.outputs.total }}
          PAR: ${{ steps.args.outputs.par }}
          TIMED: ${{ steps.split.outputs.timed }}
          SHA: ${{ needs.build_debug.outputs.sha }}
          MODE: ${{ needs.build_debug.outputs.mode }}
          BRID: ${{ steps.build.outputs.build_run_id }}
          RUNDIR: ${{ steps.split.outputs.rundir }}
        run: |
          set -eo pipefail
          {
            echo "## Split"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| selected cases | $TOTAL |"
            echo "| shard | $PAR |"
            echo "| cases with measured timings | $TIMED |"
            echo "| build SHA | \`$SHA\` |"
            echo "| build | $MODE (built by run \`$BRID\`) |"
            echo "| run directory | \`$RUNDIR\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  shard:
    name: "shard ${{ matrix.i }}"
    needs: plan
    # 50 privileged pods running testcase code; testcases arrive via the App token.
    permissions: {}
    runs-on: cubrid-arc
    timeout-minutes: 120
    strategy:
      # One dying must not stop the rest. No max-parallel: maxRunners is the ceiling.
      fail-fast: false
      matrix:
        i: ${{ fromJson(needs.plan.outputs.matrix) }}
    container:
      image: cubridci/cubridci:test_shell
    defaults:
      run:
        shell: bash
    env:
      WORKDIR: /home
      TC_DIR: /home/cubrid-testcases-private-ex
      CUBRID_DIR: /home/CUBRID
      RUNDIR: ${{ needs.plan.outputs.rundir }}
      IDX: ${{ matrix.i }}

    steps:
      - name: Check the pod template assumptions
        run: |
          set -eo pipefail
          printf 'start\t%s\n' "$(date -u +%s)" > "$STAMPS/shard-${IDX}.tsv"

          # Without shareProcessNamespace, PID 1 never reaps the double-forked server,
          # so `cubrid server stop` waits forever and the job hangs to the timeout.
          # Nothing in the log says so, hence this check.
          pid1=$(ps -p 1 -o comm= | tr -d ' ')
          echo "PID 1: $pid1"
          if [ "$pid1" != "pause" ]; then
            echo "::error::PID 1 is not pause ($pid1). shareProcessNamespace: true is missing from the pod template."
            echo "  Left as is, the shell tests hang instead of failing."
            exit 1
          fi

      - name: Take my share (guard 2 of 3)
        id: mine
        run: |
          set -eo pipefail
          f="$RUNDIR/shards/${IDX}.list"

          # Guard 2 of 3. plan split everything, so an empty share is a bug.
          # CircleCI could legitimately answer "your share is 0"; here it cannot.
          if [ ! -f "$f" ]; then
            echo "::error::my share file is missing: $f"
            echo "  plan either never wrote it or it vanished. Zero cases is not success."
            exit 1
          fi
          n=$(wc -l < "$f")
          if [ "$n" -eq 0 ]; then
            echo "::error::my share is empty: $f"
            echo "  plan split everything, so zero is a bug. Zero cases is not success."
            exit 1
          fi
          echo "my share: $n cases"
          head -3 "$f"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Storage, two overlays and the build provenance
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          WANT_BRID: ${{ needs.plan.outputs.build_run_id }}
        run: |
          set -eo pipefail
          mkdir -p /rw/upper /rw/work "$TC_DIR"
          mount -t overlay overlay -o lowerdir=/ro,upperdir=/rw/upper,workdir=/rw/work "$TC_DIR"

          lower="$CI_BUILD_ROOT/$SHA/debug/CUBRID"
          [ -d "$lower" ] || { echo "::error::no build: $lower"; exit 1; }
          mkdir -p /build-rw/upper /build-rw/work "$CUBRID_DIR"
          mount -t overlay overlay \
            -o lowerdir="$lower",upperdir=/build-rw/upper,workdir=/build-rw/work "$CUBRID_DIR"
          echo "testcases and CUBRID mounted"

          # Read through the overlay the tests use, not the hostPath.
          m="$CUBRID_DIR/$BUILD_META"
          [ -f "$m" ] || {
            echo "::error::no $BUILD_META inside the mounted CUBRID"
            echo "  What this shard reads is not the artifact build_debug published."; exit 1; }

          got_sha=$(awk -F= '/^sha=/ {print $2}' "$m")
          got_brid=$(awk -F= '/^run_id=/ {print $2}' "$m")
          echo "build read: sha=$got_sha run_id=$got_brid"
          [ "$got_sha" = "$SHA" ] || {
            echo "::error::the build read has sha($got_sha), not plan's sha($SHA)"; exit 1; }
          [ "$got_brid" = "$WANT_BRID" ] || {
            echo "::error::the build read was made by run($got_brid), not the run plan verified($WANT_BRID)"
            echo "  The artifact changed mid-pipeline."; exit 1; }

          # collect counts these files to decide every shard read the same build.
          out="$RUNDIR/results/${IDX}"
          mkdir -p "$out"
          cp -f "$m" "$out/build.read"
          echo "matches: this shard reads the build from run $got_brid"

      - name: Copy CTP from what plan published
        run: |
          set -eo pipefail
          # Per-run path, so no other run can move it aside mid-read.
          seed="$RUNDIR/testtools"
          [ -d "$seed" ] || { echo "::error::no CTP seed: $seed"; exit 1; }

          # GlusterFS is LAN. No WAN here: one clone would be 25MB.
          rx0=$(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev)
          cp -a "$seed" "$WORKDIR/cubrid-testtools"
          rx1=$(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev)
          echo "CTP copy WAN: $(( (rx1 - rx0) / 1048576 )) MB (must be 0)"
          ls "$CTP_HOME/bin/ctp.sh" "$CTP_HOME/conf/shell_ci.conf"

          sudo /usr/sbin/sshd || /usr/sbin/sshd || true

      # Each job mints its own: job outputs cross boundaries unmasked.
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          # One private repo only: asking for cubrid-testtools fails token issuance.
          repositories: cubrid-testcases-private-ex
          owner: CUBRID
          # Read-only: the default would carry the installation's contents: write.
          permission-contents: read

      - name: Mask the token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "::add-mask::$APP_TOKEN"

      - name: Align testcases to the commit plan saw
        env:
          GHI_TOKEN: ${{ steps.app-token.outputs.token }}
          TC_BRANCH: ${{ needs.plan.outputs.tc_branch }}
          WANT_TC_SHA: ${{ needs.plan.outputs.tc_sha }}
        run: |
          set -eo pipefail
          # CTP must be copied first: entrypoint needs .git to fetch instead of clone.
          [ -d "$WORKDIR/cubrid-testtools/.git" ] || {
            echo "::error::CTP is missing. The steps are in the wrong order"; exit 1; }

          export BRANCH_TESTCASES="$TC_BRANCH"
          rx0=$(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev)
          /entrypoint.sh checkout

          # Pin to the commit plan saw. checkout aligns to the tip; undo that here.
          cd "$TC_DIR"
          git fetch -q --depth 1 --no-tags origin "$WANT_TC_SHA"
          git reset -q --hard "$WANT_TC_SHA"
          rx1=$(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev)

          got=$(git rev-parse HEAD)
          echo "tc branch  : $TC_BRANCH"
          echo "tc SHA    : $got"
          echo "refresh WAN: $(( (rx1 - rx0) / 1048576 )) MB"
          [ "$got" = "$WANT_TC_SHA" ] || {
            echo "::error::could not align to the tc SHA plan saw($WANT_TC_SHA); at $got"; exit 1; }

          # collect counts these to decide every shard saw the same testcases.
          out="$RUNDIR/results/${IDX}"
          mkdir -p "$out"
          printf 'tc_sha=%s\ntc_branch=%s\n' "$got" "$TC_BRANCH" > "$out/tc.read"

      - name: Keep only my share
        run: |
          set -eo pipefail
          rm -rf "$TC_DIR/shell/_25_unstable"

          # plan emits a repo-prefixed path; the delete side is absolute. Align them.
          sed "s#^cubrid-testcases-private-ex/#$TC_DIR/#" "$RUNDIR/shards/${IDX}.list" \
            | xargs -n1 dirname | sort -u > /tmp/keep_dirs.list
          echo "directories kept: $(wc -l < /tmp/keep_dirs.list)"

          find "$TC_DIR/shell" -name cases -type d \
            | grep -v -F -f /tmp/keep_dirs.list \
            | xargs -r rm -rf

          left=$(find "$TC_DIR/shell" -path '*/cases/*.sh' 2>/dev/null | grep -Pc '/([^/]+)/cases/\1\.sh$' || echo 0)
          echo "cases left: $left (expected: ${{ steps.mine.outputs.n }})"
          echo "/rw: $(df -h /rw | tail -1 | awk '{print $3" used of "$2}')"

      - name: Run CTP
        id: ctp
        env:
          # The only CircleCI variable CTP reads. Without it every shard logs as `local`.
          CIRCLE_NODE_INDEX: ${{ matrix.i }}
        run: |
          set -eo pipefail
          ulimit -c 10485760
          set +e
          ( cd "$CTP_HOME" && HOME="$WORKDIR" ./bin/ctp.sh shell -c "$CTP_HOME/conf/shell_ci.conf" )
          rc=$?
          set -e
          echo "ctp exit: $rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Do not stop on a non-zero exit: collect needs the results published first.

      - name: Publish results for collect
        if: always()
        run: |
          set -eo pipefail
          out="$RUNDIR/results/${IDX}"
          mkdir -p "$out"
          logs="$CTP_HOME/result/shell/current_runtime_logs"

          if [ -d "$logs" ]; then
            for f in test-shell.xml test_status.data feedback.log; do
              cp -f "$(readlink -f "$logs")/$f" "$out/$f" 2>/dev/null || true
            done
          fi

          # Marks that the shard got this far. Without it collect counts it as dead.
          printf 'idx=%s\nassigned=%s\nctp_rc=%s\n' \
            "$IDX" "${{ steps.mine.outputs.n }}" "${{ steps.ctp.outputs.rc }}" > "$out/shard.done"

          printf 'end\t%s\n' "$(date -u +%s)" >> "$STAMPS/shard-${IDX}.tsv"

          echo "published: $out"
          ls -la "$out"
          [ -f "$out/test_status.data" ] && cat "$out/test_status.data" || echo "(no status file)"

      - name: Verdict
        if: always()
        run: |
          set -eo pipefail
          out="$RUNDIR/results/${IDX}"
          st="$out/test_status.data"
          [ -f "$st" ] || { echo "::error::no CTP status file: the tests did not run"; exit 1; }

          exec_n=$(awk -F= '/total_executed_case_count/ {print $2+0}' "$st")
          fail_n=$(awk -F= '/total_fail_case_count/ {print $2+0}' "$st")
          skip_n=$(awk -F= '/total_skip_case_count/ {print $2+0}' "$st")
          want="${{ steps.mine.outputs.n }}"
          echo "assigned $want / run $exec_n / failed $fail_n / skipped $skip_n"

          # run + skipped must equal what was assigned; fewer means silent loss.
          if [ "$((exec_n + skip_n))" -lt "$want" ]; then
            echo "::error::assigned $want but only $((exec_n + skip_n)) handled: cases went missing"
            exit 1
          fi
          [ "$fail_n" -eq 0 ] || { echo "::error::$fail_n failed"; exit 1; }
          echo "this shard passed"

  collect:
    name: collect
    needs: [gate, build_debug, plan, shard]
    # always() alone would also run for comments the gate turned away.
    if: always() && needs.gate.outputs.run == 'true'
    permissions:
      # The wall-clock step reads the run start time. Public repos need no scope --
      # stated so it does not fail silently if this repository ever becomes private.
      actions: read
      # Posts the result summary. The only place here that needs write.
      pull-requests: write
    runs-on: cubrid-arc
    timeout-minutes: 30
    container:
      image: cubridci/cubridci:test_shell
    defaults:
      run:
        shell: bash
    env:
      RUNDIR: ${{ needs.plan.outputs.rundir }}
      TOTAL: ${{ needs.plan.outputs.total }}

    steps:
      - name: Gather the results
        id: gather
        env:
          BUILD_RESULT: ${{ needs.build_debug.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          set -eo pipefail
          if [ -z "$RUNDIR" ] || [ ! -d "$RUNDIR" ]; then
            # Say which stage broke, not just that something did.
            if [ "$BUILD_RESULT" != 'success' ]; then
              echo "::error::the build ended $BUILD_RESULT, so no test ran at all."
            else
              echo "::error::plan ended $PLAN_RESULT, so the split stage broke."
            fi
            exit 1
          fi

          # Not `ls <glob> | wc -l`: with no match it kills the step under pipefail --
          # exactly when every shard died and guard 3 must speak. find returns 0.
          planned=$(find "$RUNDIR/shards" -maxdepth 1 -name '*.list' 2>/dev/null | wc -l)
          done_n=$(find "$RUNDIR/results" -mindepth 2 -maxdepth 2 -name shard.done 2>/dev/null | wc -l)
          read_n=$(find "$RUNDIR/results" -mindepth 2 -maxdepth 2 -name build.read 2>/dev/null | wc -l)
          tcread_n=$(find "$RUNDIR/results" -mindepth 2 -maxdepth 2 -name tc.read 2>/dev/null | wc -l)
          echo "shard: planned $planned / published $done_n / build provenance $read_n / tc provenance $tcread_n"

          : > /tmp/agg.tsv
          for d in "$RUNDIR"/results/*/; do
            i=$(basename "$d")
            st="$d/test_status.data"
            if [ -f "$st" ]; then
              awk -F= -v i="$i" '
                /total_case_count/        {c=$2+0}
                /total_executed_case_count/ {e=$2+0}
                /total_success_case_count/  {s=$2+0}
                /total_fail_case_count/     {f=$2+0}
                /total_skip_case_count/     {k=$2+0}
                END {printf "%s\t%d\t%d\t%d\t%d\t%d\n", i, c, e, s, f, k}' "$st" >> /tmp/agg.tsv
            else
              printf "%s\t0\t0\t0\t0\t0\n" "$i" >> /tmp/agg.tsv
            fi
          done

          exec_sum=$(awk -F'\t' '{s+=$3} END {print s+0}' /tmp/agg.tsv)
          succ_sum=$(awk -F'\t' '{s+=$4} END {print s+0}' /tmp/agg.tsv)
          fail_sum=$(awk -F'\t' '{s+=$5} END {print s+0}' /tmp/agg.tsv)
          skip_sum=$(awk -F'\t' '{s+=$6} END {print s+0}' /tmp/agg.tsv)
          echo "run $exec_sum / passed $succ_sum / failed $fail_sum / skipped $skip_sum (of $TOTAL)"

          for k in planned done_n read_n tcread_n exec_sum succ_sum fail_sum skip_sum; do
            echo "$k=${!k}" >> "$GITHUB_OUTPUT"
          done

      - name: Compare build provenance
        id: provenance
        env:
          WANT_BRID: ${{ needs.plan.outputs.build_run_id }}
          MODE: ${{ needs.build_debug.outputs.mode }}
          WANT_TC_SHA: ${{ needs.plan.outputs.tc_sha }}
        run: |
          set -eo pipefail
          # Every shard recorded the meta it read. They must all name the same run.
          : > /tmp/brids.txt
          for f in "$RUNDIR"/results/*/build.read; do
            [ -f "$f" ] || continue
            awk -F= '/^run_id=/ {print $2}' "$f" >> /tmp/brids.txt
          done
          uniq_n=$(sort -u /tmp/brids.txt | wc -l)
          echo "distinct run_ids among the builds shards read: $uniq_n"
          sort /tmp/brids.txt | uniq -c

          # Three ways to disagree, reported separately: they are different faults.
          if [ "$uniq_n" -eq 0 ]; then
            reason=none        # nobody recorded a provenance file
          elif [ "$uniq_n" -gt 1 ]; then
            reason=mixed       # shards read different builds
          elif [ "$(sort -u /tmp/brids.txt)" != "$WANT_BRID" ]; then
            reason=mismatch    # all the same, but not the build plan verified
          else
            reason=ok
          fi

          # With mode=built, the run that made the build is this run.
          this_run=no
          [ "$WANT_BRID" = "$GITHUB_RUN_ID" ] && this_run=yes
          echo "build made by run: $WANT_BRID (this run: $GITHUB_RUN_ID / mode=$MODE)"
          echo "provenance: $reason / built by this run: $this_run"

          : > /tmp/tcs.txt
          for f in "$RUNDIR"/results/*/tc.read; do
            [ -f "$f" ] || continue
            awk -F= '/^tc_sha=/ {print $2}' "$f" >> /tmp/tcs.txt
          done
          tc_uniq=$(sort -u /tmp/tcs.txt | wc -l)
          echo "distinct testcase SHAs among the shards: $tc_uniq"
          sort /tmp/tcs.txt | uniq -c

          if [ "$tc_uniq" -eq 0 ]; then
            tc_reason=none
          elif [ "$tc_uniq" -gt 1 ]; then
            tc_reason=mixed
          elif [ "$(sort -u /tmp/tcs.txt)" != "$WANT_TC_SHA" ]; then
            tc_reason=mismatch
          else
            tc_reason=ok
          fi
          echo "tc verdict: $tc_reason (plan chose: $WANT_TC_SHA)"

          {
            echo "reason=$reason"
            echo "uniq=$uniq_n"
            echo "this_run=$this_run"
            echo "tc_reason=$tc_reason"
            echo "tc_uniq=$tc_uniq"
          } >> "$GITHUB_OUTPUT"

      - name: Failure list, from CTP JUnit XML
        id: failures
        run: |
          set -eo pipefail
          : > /tmp/failed.list
          for x in "$RUNDIR"/results/*/test-shell.xml; do
            [ -f "$x" ] || continue
            i=$(basename "$(dirname "$x")")
            awk -v shard="$i" '
              /<testcase/ {
                cur = ""
                # The leading space is required: CTP writes classname before name,
                # so /name="..."/ would match classname and extract a URL.
                if (match($0, / name="[^"]*"/)) {
                  cur = substr($0, RSTART + 7, RLENGTH - 8)
                }
                next
              }
              /<failure/ && cur != "" { printf "%s\t%s\n", shard, cur; cur = "" }
              /<\/testcase>/ { cur = "" }
            ' "$x" >> /tmp/failed.list
          done
          n=$(wc -l < /tmp/failed.list)
          echo "failed cases: $n"
          [ "$n" -eq 0 ] || head -30 /tmp/failed.list
          cp /tmp/failed.list "$RUNDIR/failed.list"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Update timings for the next split
        run: |
          set -eo pipefail
          # feedback.log format: [OK]:  <case path> <milliseconds> EnvId=...
          : > /tmp/new_timings.tsv
          for f in "$RUNDIR"/results/*/feedback.log; do
            [ -f "$f" ] || continue
            grep -E '^\[(OK|NOK)\]' "$f" 2>/dev/null | awk '
              {
                # Scan back for the number before EnvId=; assumes no spaces in the path.
                for (i = NF; i > 1; i--) {
                  if ($i ~ /^EnvId=/) { ms = $(i-1); path = $(i-2); break }
                }
                if (ms ~ /^[0-9]+$/ && path != "") printf "%s\t%.3f\n", path, ms / 1000
              }' >> /tmp/new_timings.tsv
          done
          new_n=$(wc -l < /tmp/new_timings.tsv)
          echo "measured by this run: $new_n"

          mkdir -p "$(dirname "$TIMINGS")"
          [ -f "$TIMINGS" ] || : > "$TIMINGS"
          old_n=$(wc -l < "$TIMINGS")

          # Newer values win, as they do in CircleCI.
          awk -F'\t' '
            NR == FNR { t[$1] = $2; next }        # take the new values first
            !($1 in t) { t[$1] = $2 }             # old values only fill the gaps
            END { for (k in t) printf "%s\t%s\n", k, t[k] }
          ' /tmp/new_timings.tsv "$TIMINGS" | sort > /tmp/merged.tsv

          # Losing this data takes the longest shard 24.8m -> 49.4m. The merge is a
          # union, so a shorter result means the merge broke. Keep the old file then.
          merged_n=$(wc -l < /tmp/merged.tsv)
          if [ "$merged_n" -lt "$old_n" ]; then
            echo "::error::the merge is shorter than the old file ($merged_n < $old_n). Not updating."
            exit 1
          fi

          # A cross-filesystem mv is copy+unlink: move onto GlusterFS, then rename.
          mv -f /tmp/merged.tsv "${TIMINGS}.tmp.$$"
          mv -f "${TIMINGS}.tmp.$$" "$TIMINGS"
          echo "timing data: $old_n -> $(wc -l < "$TIMINGS") rows"

      - name: Wall clock
        id: clock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          now=$(date -u +%s)
          mkdir -p "$STAMPS"
          printf 'start\t%s\n' "$now" > "$STAMPS/collect.tsv"

          # The run start time is not in the context; one API call returns it.
          # queue_sec now covers gate + runner queue, so it is not comparable
          # with the pre-port runs.
          run_started=""
          if code=$(curl -sS -o /tmp/run.json -w '%{http_code}' \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"); then
            if [ "$code" = "200" ]; then
              run_started=$(date -u -d "$(jq -r '.run_started_at' /tmp/run.json)" +%s 2>/dev/null || echo "")
            fi
          fi
          [ -n "$run_started" ] || echo "::warning::could not read the run start time (HTTP ${code:-?}); queue time is omitted."

          dur() {   # <file> -> seconds; needs both start and end
            [ -f "$1" ] || { echo ""; return; }
            awk -F'\t' '$1=="start"{s=$2} $1=="end"{e=$2} END {if (s&&e) print e-s}' "$1"
          }

          build_sec=$(dur "$STAMPS/build.tsv")
          plan_sec=$(dur "$STAMPS/plan.tsv")

          # Many shards: report longest, median, shortest, and the wall-clock span.
          : > /tmp/shard_dur.txt
          first_start=""; last_end=""
          for f in "$STAMPS"/shard-*.tsv; do
            [ -f "$f" ] || continue
            d=$(dur "$f"); [ -n "$d" ] && echo "$d" >> /tmp/shard_dur.txt
          done
          # The span counts a dead shard's start too, since it held the slot. `|| true`:
          # every shard dying is exactly when the wall clock must still be reported.
          stamp_field() { { awk -F'\t' -v k="$1" '$1==k {print $2}' "$STAMPS"/shard-*.tsv 2>/dev/null || true; } | sort -n; }
          first_start=$(stamp_field start | head -1)
          last_end=$(stamp_field end | tail -1)

          read -r sh_n sh_max sh_med <<<"$(sort -n /tmp/shard_dur.txt | awk '
            {a[NR]=$1} END {
              if (NR==0) {print "0 0 0"; exit}
              printf "%d %d %d\n", NR, a[NR], a[int((NR+1)/2)]
            }')"
          sh_span=""
          [ -n "$first_start" ] && [ -n "$last_end" ] && sh_span=$((last_end - first_start))

          build_start=$(awk -F'\t' '$1=="start"{print $2}' "$STAMPS/build.tsv" 2>/dev/null)
          queue_sec=""
          [ -n "$run_started" ] && [ -n "$build_start" ] && queue_sec=$((build_start - run_started))
          total_sec=""
          [ -n "$run_started" ] && total_sec=$((now - run_started))

          fmt() { [ -z "$1" ] && { echo "(not measured)"; return; }; awk -v s="$1" 'BEGIN{printf "%ds (%.1fm)", s, s/60}'; }

          {
            echo "clock_build=$(fmt "$build_sec")"
            echo "clock_plan=$(fmt "$plan_sec")"
            echo "clock_shard_max=$(fmt "$sh_max")"
            echo "clock_shard_med=$(fmt "$sh_med")"
            echo "clock_shard_span=$(fmt "$sh_span")"
            echo "clock_queue=$(fmt "$queue_sec")"
            echo "clock_total=$(fmt "$total_sec")"
            echo "clock_shard_n=$sh_n"
          } >> "$GITHUB_OUTPUT"

          echo "=== wall clock ==="
          echo "queue        : $(fmt "$queue_sec")"
          echo "build        : $(fmt "$build_sec")"
          echo "split        : $(fmt "$plan_sec")"
          echo "longest shard: $(fmt "$sh_max")   (median $(fmt "$sh_med") / $sh_n shards)"
          echo "shard span   : $(fmt "$sh_span")  (first shard start to last shard end)"
          echo "total        : $(fmt "$total_sec")  (run start to now; the rest of collect is not counted)"

      - name: Guard 3 of 3, and the summary
        env:
          TIMED: ${{ needs.plan.outputs.timed }}
          SHA: ${{ needs.plan.outputs.sha }}
          MODE: ${{ needs.build_debug.outputs.mode }}
          BRID: ${{ needs.plan.outputs.build_run_id }}
          PLANNED: ${{ steps.gather.outputs.planned }}
          DONE_N: ${{ steps.gather.outputs.done_n }}
          READ_N: ${{ steps.gather.outputs.read_n }}
          EXEC_SUM: ${{ steps.gather.outputs.exec_sum }}
          SUCC_SUM: ${{ steps.gather.outputs.succ_sum }}
          FAIL_SUM: ${{ steps.gather.outputs.fail_sum }}
          SKIP_SUM: ${{ steps.gather.outputs.skip_sum }}
          FAILED_N: ${{ steps.failures.outputs.n }}
          PROV_REASON: ${{ steps.provenance.outputs.reason }}
          PROV_UNIQ: ${{ steps.provenance.outputs.uniq }}
          PROV_THIS: ${{ steps.provenance.outputs.this_run }}
          TC_REASON: ${{ steps.provenance.outputs.tc_reason }}
          TC_UNIQ: ${{ steps.provenance.outputs.tc_uniq }}
          TCREAD_N: ${{ steps.gather.outputs.tcread_n }}
          TC_SHA: ${{ needs.plan.outputs.tc_sha }}
          TC_BRANCH: ${{ needs.plan.outputs.tc_branch }}
          RERUN_FROM: ${{ needs.gate.outputs.rerun_from }}   # names the source run in the summary
          C_QUEUE: ${{ steps.clock.outputs.clock_queue }}
          C_BUILD: ${{ steps.clock.outputs.clock_build }}
          C_PLAN: ${{ steps.clock.outputs.clock_plan }}
          C_SMAX: ${{ steps.clock.outputs.clock_shard_max }}
          C_SMED: ${{ steps.clock.outputs.clock_shard_med }}
          C_SPAN: ${{ steps.clock.outputs.clock_shard_span }}
          C_TOTAL: ${{ steps.clock.outputs.clock_total }}
        run: |
          set -eo pipefail
          covered=$((EXEC_SUM + SKIP_SUM))
          v_cov="✅"; [ "$covered" -ge "$TOTAL" ] || v_cov="❌"
          v_shard="✅"; [ "$DONE_N" -eq "$PLANNED" ] || v_shard="❌"
          # How many recorded and whether they agree are separate faults.
          v_read="✅"; [ "$READ_N" -eq "$PLANNED" ] || v_read="❌"
          case "$PROV_REASON" in
            ok)       v_same="✅ all the same" ;;
            mixed)    v_same="❌ shards differ ($PROV_UNIQ distinct)" ;;
            mismatch) v_same="❌ all the same, but not the build plan verified" ;;
            *)        v_same="❌ nobody recorded a provenance" ;;
          esac
          v_this="✅"; [ "$PROV_THIS" = 'yes' ] || v_this="reused"
          v_tcread="✅"; [ "$TCREAD_N" -eq "$PLANNED" ] || v_tcread="❌"
          case "$TC_REASON" in
            ok)       v_tcsame="✅ all the same" ;;
            mixed)    v_tcsame="❌ shards differ ($TC_UNIQ distinct)" ;;
            mismatch) v_tcsame="❌ all the same, but not what plan chose" ;;
            *)        v_tcsame="❌ nobody recorded a tc provenance" ;;
          esac

          {
            echo "## CUBRIDQA-1526 -- build, publish, shell suite"
            echo
            # Name the source run at the top: results land under the new run id.
            if [ -n "$RERUN_FROM" ]; then
              echo "> **Only the failures from run \`$RERUN_FROM\` were re-run. This is not a full run.**"
              echo ">"
              echo "> source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RERUN_FROM"
              echo
            fi
            echo "### AC 1 -- one run carries it end to end"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| selected cases | $TOTAL |"
            echo "| shards | planned $PLANNED / published $DONE_N $v_shard |"
            echo "| run | $EXEC_SUM |"
            echo "| skipped | $SKIP_SUM |"
            echo "| handled | $covered / $TOTAL $v_cov |"
            echo "| passed | $SUCC_SUM |"
            echo "| **failed** | **$FAIL_SUM** |"
            echo "| cases split by measured timings | $TIMED |"
            echo
            echo "### AC 2 -- did the tests read the build this run made"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| build SHA | \`$SHA\` |"
            echo "| build | $MODE |"
            echo "| built by run | \`$BRID\` (this run \`$GITHUB_RUN_ID\`) $v_this |"
            echo "| shards that read the meta inside the mounted CUBRID | $READ_N / $PLANNED $v_read |"
            echo "| did every shard read the same build | $v_same |"
            echo
            echo "Provenance is read through the overlay the shard actually mounted, not through hostPath."
            echo
            echo "### Testcases -- did every shard see the same commit"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| tc branch | \`$TC_BRANCH\` |"
            echo "| tc commit | \`$TC_SHA\` |"
            echo "| shards that recorded a tc provenance | $TCREAD_N / $PLANNED $v_tcread |"
            echo "| same commit across shards | $v_tcsame |"
            echo
            echo "### AC 3 -- pipeline wall clock"
            echo
            echo "| stage | time |"
            echo "|---|---|"
            echo "| queue (run start to build start) | $C_QUEUE |"
            echo "| build | $C_BUILD |"
            echo "| split | $C_PLAN |"
            echo "| longest shard | $C_SMAX |"
            echo "| median shard | $C_SMED |"
            echo "| shard span (first start to last end) | $C_SPAN |"
            echo "| **total (run start to collect)** | **$C_TOTAL** |"
            echo
            if [ "$FAILED_N" -gt 0 ]; then
              echo "### Failed cases ($FAILED_N)"
              echo
              echo "Source: the \`<testcase>\` entries carrying a \`<failure>\` in each shard's \`test-shell.xml\`"
              echo
              echo "| shard | case |"
              echo "|---|---|"
              head -50 /tmp/failed.list | awk -F'\t' '{printf "| %s | `%s` |\n", $1, $2}'
              [ "$FAILED_N" -gt 50 ] && echo && echo "_... and $((FAILED_N - 50)) more. The full list is \`$RUNDIR/failed.list\`_"
            else
              echo "### No failed cases"
            fi
            echo
            echo "---"
            echo "Artifacts: \`$RUNDIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== summary ==="
          cat "$GITHUB_STEP_SUMMARY"
          # The summary file is append-only; leave a copy for the next step.
          cp "$GITHUB_STEP_SUMMARY" /tmp/summary.md

          # Guard 3 of 3: a shard dying whole is invisible to guard 2.
          rc=0
          if [ "$DONE_N" -ne "$PLANNED" ]; then
            echo "::error::only $DONE_N of $PLANNED shards published a result; the rest died whole"
            rc=1
          fi
          if [ "$covered" -lt "$TOTAL" ]; then
            echo "::error::only $covered of $TOTAL cases were handled; cases went missing"
            rc=1
          fi
          if [ "$READ_N" -ne "$PLANNED" ]; then
            echo "::error::only $READ_N of $PLANNED shards recorded a build provenance; the rest died before mounting"
            rc=1
          fi
          case "$PROV_REASON" in
            ok) ;;
            mixed)
              echo "::error::shards read different builds (run_id $PROV_UNIQ distinct). The artifact changed mid-pipeline"
              rc=1 ;;
            mismatch)
              echo "::error::every shard read the same build, but not the one from the run plan verified($BRID)"
              rc=1 ;;
            *)
              echo "::error::no shard recorded a build provenance"
              rc=1 ;;
          esac
          if [ "$TCREAD_N" -ne "$PLANNED" ]; then
            echo "::error::only $TCREAD_N of $PLANNED shards recorded a tc provenance"
            rc=1
          fi
          case "$TC_REASON" in
            ok) ;;
            mixed)
              echo "::error::shards saw different testcases ($TC_UNIQ distinct). That disagrees with the split list"
              rc=1 ;;
            mismatch)
              echo "::error::every shard is the same, but not the commit plan chose($TC_SHA)"
              rc=1 ;;
            *)
              echo "::error::no shard recorded a tc provenance"
              rc=1 ;;
          esac
          if [ "$FAIL_SUM" -gt 0 ]; then
            echo "::error::$FAIL_SUM failed"
            rc=1
          fi
          [ "$rc" -eq 0 ] && echo "completed with no failures."
          exit $rc

      - name: Post to the PR
        # always(): a failure is exactly when the PR needs to hear about it.
        if: always() && needs.gate.outputs.pr != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
        run: |
          set -eo pipefail
          # A job summary lives on the run page only; it does not reach the PR thread.
          if [[ ! "$PR" =~ ^[0-9]{1,7}$ ]]; then
            echo "::error::pr must be an integer"; exit 1
          fi
          if [ ! -f /tmp/summary.md ]; then
            printf '## CUBRIDQA-1526\n\nCould not build a summary. Check the run.\n' > /tmp/summary.md
          fi

          {
            cat /tmp/summary.md
            echo
            echo "<sub>gha-ci / run [\`${GITHUB_RUN_ID}\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) - artifacts \`${RUNDIR}\`</sub>"
          } > /tmp/body.md

          # Comment bodies cap at 65536 characters, so long failure lists are trimmed.
          head -c 60000 /tmp/body.md > /tmp/body.trim.md
          jq -Rs '{body: .}' < /tmp/body.trim.md > /tmp/comment.json

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            -d @/tmp/comment.json)

          echo "HTTP $code"
          if [ "$code" != "201" ]; then
          # A 403 here means pull-requests: write did not reach GITHUB_TOKEN.
            echo "::error::failed to post the PR comment"
            jq -r '.message // .' /tmp/resp.json 2>/dev/null | head -3
            exit 1
          fi
          echo "posted: $(jq -r '.html_url' /tmp/resp.json)"

      # 59MB per run, nothing worth keeping, and the cleanup CronJob does not see it.
      # A cancelled run skips this step; build_debug sweeps what it leaves.
      - name: Clean up the CTP seed
        if: always()
        run: |
          set -eo pipefail
          seed="$RUNDIR/testtools"
          if [ -d "$seed" ]; then
            du -sh "$seed" 2>/dev/null || true
            rm -rf "$seed" "${seed}.tmp.${GITHUB_RUN_ID}" "${seed}.old"
            echo "removed: $seed"
          else
            echo "nothing to remove: $seed"
          fi
