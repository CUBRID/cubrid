# The pods must provide what CUBRID/qatools-internal test-infra/roles/arc/README.md lists.

name: gha-ci

run-name: >-
  ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null
  && format('PR #{0} · {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'workflow_dispatch' && inputs.pr != ''
  && format('PR #{0} · dispatch {1} {2}', inputs.pr, inputs.suite, inputs.sha)
  || github.event_name == 'workflow_dispatch'
  && format('dispatch {0} {1}', inputs.suite, inputs.sha)
  || '' }}

on:
  issue_comment:
    types: [created, edited]
  push:
    branches: [develop]
  # After the day's last develop merge (13Z), off the hour where cron queues longest.
  schedule:
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: "Engine commit to test: full 40-char SHA. Empty only with nightly"
        required: false
        default: ""
        type: string
      force_build:
        description: "Rebuild even when this SHA is already published"
        required: false
        default: false
        type: boolean
      suite:
        description: "Which suite to run. `all` is the batch's shape and takes no parallelism"
        required: false
        default: shell
        type: choice
        options: [shell, sql, medium, sql_by_cci, all]
      parallelism:
        description: "Shard count, 1..256. Empty means the suite's default (shell 50, sql 10, medium 1, sql_by_cci 10)"
        required: false
        default: ""
        type: string
      limit:
        description: "Cap on case count; 0 means all of them"
        required: false
        default: "0"
        type: string
      rerun_from:
        description: "Re-run only what this run id left unhandled, plus the cases the tc branch changed since. Takes precedence over limit"
        required: false
        default: ""
        type: string
      sabotage:
        description: "Break the split on purpose to check the guards: none | empty-shard | lose-shard | kill-shard"
        required: false
        default: "none"
        type: string
      pr:
        description: "Engine PR number. Testcases come from tc/pr-<number> and results are posted there"
        required: false
        default: ""
        type: string
      testtools:
        description: "cubrid-testtools branch to take CTP from; empty means develop"
        required: false
        default: ""
        type: string
      nightly:
        description: "Batch. With sha empty: rehearse the batch. With sha set: test that develop commit and post its statuses"
        required: false
        default: false
        type: boolean

# shard is 50 privileged pods running testcase code; it holds no token at all.
permissions: {}

# push and dispatch key on the SHA: per ref, a third merge drops the second, and two force_build
# dispatches would race the republish. Every /run of a PR shares one group: they post the same
# statuses. A comment that asks for nothing lands alone, or it would cancel a running suite.
concurrency:
  group: >-
    gha-ci-${{ github.event_name == 'push'
    && format('push-{0}', github.sha)
    || github.event_name == 'workflow_dispatch'
    && format('dispatch-{0}', inputs.sha)
    || github.event.issue.pull_request != null
    && startsWith(github.event.comment.body, '/run')
    && contains(github.event.comment.body, 'rerun')
    && format('pr-{0}-run', github.event.issue.number)
    || github.event.issue.pull_request != null
    && startsWith(github.event.comment.body, '/run')
    && (contains(github.event.comment.body, 'shell')
    || contains(github.event.comment.body, 'sql')
    || contains(github.event.comment.body, 'medium')
    || contains(github.event.comment.body, 'all'))
    && format('pr-{0}-run', github.event.issue.number)
    || github.run_id }}
  # A develop push publishes the preserved artifact and refreshes the ccache: never cancel it.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CTX_BUILD_RELEASE: "gha-ci: build (release)"
  CTX_BUILD_DEBUG: "gha-ci: build (debug)"
  CI_ROOT: /home/ci/shared
  CI_BUILD_ROOT: /home/ci/shared/builds
  TIMINGS: /home/ci/shared/timings/shell.tsv
  # Per attempt: a re-run keeps run_id, and would subtract times from different attempts.
  STAMPS: /home/ci/shared/runs/${{ github.run_id }}/stamps/${{ github.run_attempt }}
  CTP_SEED: /home/ci/seed/test/cubrid-testtools
  BUILD_SENTINEL: .complete
  BUILD_META: .gha-ci-build.meta
  # Paired with arc_artifact_server_node_port in CUBRID/qatools-internal test-infra/.
  ARTIFACT_URL_BASE: http://192.168.1.48:30080
  COUNT_RESULTS: |
    count() {
      if [ -f "$1/test_status.data" ]; then
        awk -F= '/total_executed_case_count/ {e = $2 + 0} /total_success_case_count/ {s = $2 + 0}
          /total_fail_case_count/ {f = $2 + 0} /total_skip_case_count/ {k = $2 + 0}
          END {printf "found=yes exec=%d pass=%d fail=%d skip=%d\n", e, s, f, k}' "$1/test_status.data"
      elif [ -f "$1/summary_info" ]; then
        awk '/:nok[[:space:]]+[0-9]+ms$/ {f++; next} /:ok[[:space:]]+[0-9]+ms$/ {s++; next} /:[[:space:]]+[0-9]+ms$/ {k++}
          END {printf "found=yes exec=%d pass=%d fail=%d skip=%d\n", s + f, s, f, k}' "$1/summary_info"
      elif ls "$1"/test-results/*.xml > /dev/null 2>&1; then
        # Same input layout and CDATA rule as collect's FAILED_AWK.
        awk 'FNR == 1 {in_cdata = 0}
          in_cdata { if (index($0, "]]></")) in_cdata = 0; next }
          { c = index($0, "<![CDATA["); tags = c ? substr($0, 1, c - 1) : $0
            if (c && !index($0, "]]></")) in_cdata = 1 }
          tags ~ /<testcase/ {e++} tags ~ /<(failure|error)[ >\/]/ {f++} tags ~ /<skipped[ >\/]/ {k++}
          END {printf "found=yes exec=%d pass=%d fail=%d skip=%d\n", e - k, e - k - f, f, k}' "$1"/test-results/*.xml
      else
        echo "found=no exec=0 pass=0 fail=0 skip=0"
      fi
    }
  SAME_RECIPE: |
    same_recipe() { [ -f "$1/$BUILD_SENTINEL" ] && grep -sqxF "recipe=$BUILD_RECIPE" "$1/build.meta"; }
  OVERLAY: |
    overlay() {   # <lower> <rw dir> <mount point>
      mkdir -p "$2/upper" "$2/work" "$3"
      mount -t overlay overlay -o "lowerdir=$1,upperdir=$2/upper,workdir=$2/work" "$3"
    }
  # A new suite also needs a row in the test image's resolve_category.
  SUITES: |-
    {
      "shell": {
        "tc_repo": "cubrid-testcases-private-ex", "tc_private": "yes",
        "tc_seed": "/home/ci/seed/test/cubrid-testcases-private-ex",
        "tc_subdir": "shell", "build_mode": "debug",
        "unit": "case", "par_default": "50", "runner": "cubrid-arc",
        "exclude": "_25_unstable", "status_ctx": "gha-ci: test_shell"
      },
      "sql": {
        "tc_repo": "cubrid-testcases", "tc_private": "no",
        "tc_seed": "/home/ci/seed/test/cubrid-testcases",
        "tc_subdir": "sql", "build_mode": "debug",
        "unit": "dir", "par_default": "10", "runner": "cubrid-arc",
        "exclude": "", "status_ctx": "gha-ci: test_sql"
      },
      "medium": {
        "tc_repo": "cubrid-testcases", "tc_private": "no",
        "tc_seed": "/home/ci/seed/test/cubrid-testcases",
        "tc_subdir": "medium", "build_mode": "debug",
        "unit": "dir", "par_default": "1", "runner": "cubrid-arc-light",
        "exclude": "", "status_ctx": "gha-ci: test_medium"
      },
      "sql_by_cci": {
        "tc_repo": "cubrid-testcases", "tc_private": "no",
        "tc_seed": "/home/ci/seed/test/cubrid-testcases",
        "tc_subdir": "sql", "build_mode": "release",
        "unit": "dir", "par_default": "10", "runner": "cubrid-arc",
        "exclude": "", "status_ctx": "gha-ci: test_sql_by_cci"
      }
    }

jobs:
  # GitHub-hosted, so the permission decision lands before a runner is claimed.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # a batch child reads its engine commit's date
      pull-requests: read # the head SHA of the commented PR
      actions: read # a re-run reads the source run's jobs
    # Same author set as comment_trigger.yml; the other events already need write access.
    if: >-
      ${{ github.event_name != 'issue_comment'
      || (github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/run')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) }}
    outputs:
      run: ${{ steps.g.outputs.run }}
      test: ${{ steps.g.outputs.test }}
      suites: ${{ steps.g.outputs.suites }}
      ci_env: ${{ steps.g.outputs.ci_env }}
      sha: ${{ steps.g.outputs.sha }}
      pr: ${{ steps.g.outputs.pr }}
      post_status: ${{ steps.g.outputs.post_status }}
      build_ns: ${{ steps.g.outputs.build_ns }}
      cache_write: ${{ steps.g.outputs.cache_write }}
      parallelism: ${{ steps.g.outputs.parallelism }}
      limit: ${{ steps.g.outputs.limit }}
      force_build: ${{ steps.g.outputs.force_build }}
      rerun_from: ${{ steps.g.outputs.rerun_from }}
      sabotage: ${{ steps.g.outputs.sabotage }}
      testtools: ${{ steps.g.outputs.testtools }}
      tc_until: ${{ steps.g.outputs.tc_until }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Resolve the trigger
        id: g
        env:
          EV: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          PUSH_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          IN_SHA: ${{ inputs.sha }}
          IN_PR: ${{ inputs.pr }}
          IN_SUITE: ${{ inputs.suite }}
          IN_PAR: ${{ inputs.parallelism }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_FORCE: ${{ inputs.force_build }}
          IN_RERUN: ${{ inputs.rerun_from }}
          IN_SAB: ${{ inputs.sabotage }}
          IN_TT: ${{ inputs.testtools }}
          IN_NIGHTLY: ${{ inputs.nightly }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          par=''; limit=0; force=false; rerun=''; sab=none; tt=''
          test_run=false; pr=''; ns='pr'; cache_write=false; sel=''

          case "$EV" in
            schedule)
              emit run false
              exit 0
              ;;

            push)
              sha="$PUSH_SHA"
              if [ "$REF" = 'refs/heads/develop' ]; then
                ns=develop
                cache_write=true
              fi
              ;;

            workflow_dispatch)
              if [ "$IN_NIGHTLY" = true ] && [ -z "$IN_SHA" ]; then
                emit run false
                exit 0
              fi
              sha="$IN_SHA"; pr="$IN_PR"
              par="$IN_PAR"; limit="$IN_LIMIT"; force="$IN_FORCE"
              rerun="$IN_RERUN"; sab="$IN_SAB"; tt="$IN_TT"
              sel="${IN_SUITE:-shell}"
              case "$sel" in
                shell|sql|medium|sql_by_cci) ;;
                all)
                  if [ -n "$par" ] || [ -n "$rerun" ]; then
                    echo "::error::suite=all takes neither parallelism nor rerun_from"; exit 1
                  fi
                  sel="medium shell sql sql_by_cci" ;;
                *) echo "::error::suite must be shell, sql, medium, sql_by_cci or all, got: ${sel}"; exit 1 ;;
              esac
              test_run=true
              if [ "$IN_NIGHTLY" = true ]; then ns=develop; fi
              ;;

            issue_comment)
              pr="$ISSUE"
              # The body ends in CRLF: a CR left on the last suite word fails its case match.
              req=$(printf '%s' "$BODY" | tr -d '\r')
              if [[ "$req" =~ ^(/run[[:space:]].*)[[:space:]]+testtools=([^[:space:]]+)[[:space:]]*$ ]]; then
                req="${BASH_REMATCH[1]}"
                tt="${BASH_REMATCH[2]}"
              fi
              if [[ "$req" =~ ^/run[[:space:]]+rerun[[:space:]]+([0-9]{1,20})[[:space:]]*$ ]]; then
                rerun="${BASH_REMATCH[1]}"
                # Passed suites too: their cases may have changed. A suite with no shard has at most a status job.
                # A suite's jobs come from gha-ci-suite.yml as "<suite> / shard ..."; older runs have no prefix.
                runjobs=$(gh api --paginate "repos/${REPO}/actions/runs/${rerun}/jobs?per_page=100" \
                  --jq '.jobs[].name | sub("^[^ ]+ / "; "") | select(test("^(shard|status) "))') || {
                  echo "::error::could not read the jobs of run ${rerun}"; exit 1; }
                known=$(jq -r 'keys | join("|")' <<<"$SUITES")
                sel=$(printf '%s\n' "$runjobs" \
                  | awk -v k="^(${known})$" '{split($0, a, " "); if (a[2] ~ k) print a[2]}' \
                  | sort -u)
                if [ -z "$sel" ]; then
                  echo "::error::run ${rerun} has no shard or status job of any suite, so its suites are unknown. Use /run shell, sql or all"
                  emit run false
                  exit 0
                fi
                test_run=true
              # comment_trigger.yml takes the same words but sql_by_cci: CircleCI has no sql_by_cci job.
              elif [[ "$req" =~ ^/run([[:space:]]+(all|shell|sql|medium|sql_by_cci)){1,5}[[:space:]]*$ ]]; then
                for w in $req; do
                  case "$w" in
                    all) sel="shell sql medium sql_by_cci" ;;
                    shell|sql|medium|sql_by_cci) sel="$sel $w" ;;
                  esac
                done
                sel=$(printf '%s\n' $sel | sort -u)
                test_run=true
              else
                emit run false
                exit 0
              fi
              # issue_comment has no branches: filter; the base range is enforced here or nowhere.
              pull=$(gh api "repos/${REPO}/pulls/${pr}" --jq '[.head.sha, .base.ref] | @tsv') || {
                echo "::error::could not read PR ${pr}"; exit 1; }
              sha=$(printf '%s' "$pull" | cut -f1)
              base=$(printf '%s' "$pull" | cut -f2)
              # release/11.x builds against a different toolchain, so this image cannot test it.
              case "$base" in
                develop|feature/*) ;;
                *)
                  echo "[info] base branch is out of scope, ignoring: $base"
                  emit run false
                  exit 0 ;;
              esac
              ;;

            *)
              echo "::error::unhandled event: $EV"; exit 1 ;;
          esac

          post_status=false
          if [ -n "$pr" ] || { [ "$EV" = workflow_dispatch ] && [ "$IN_NIGHTLY" = true ]; }; then
            post_status=true
          fi

          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be 40 lowercase hex characters, got: ${sha}"; exit 1
          fi
          # A leading dash would reach git as an option, and `..` reaches outside the ref.
          if [ -n "$tt" ] \
             && { [[ ! "$tt" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || [[ "$tt" == *..* ]]; }; then
            echo "::error::testtools must be a branch name: letters, digits and . _ / -, starting with a letter or a digit, at most 100. Got: ${tt}"
            exit 1
          fi

          # A batch child tests a commit merged hours ago: later answer fixes must not grade it.
          tc_until=''
          if [ "$EV" = workflow_dispatch ] && [ "$IN_NIGHTLY" = true ]; then
            for i in 1 2 3; do
              tc_until=$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.committer.date') && break
              sleep $((i * 5))
            done
            [ -n "$tc_until" ] || { echo "::error::no commit date for $sha"; exit 1; }
          fi

          suites=$(printf '%s\n' $sel | jq -Rc 'select(length > 0)' | jq -sc .)

          emit run true
          emit test "$test_run"
          emit suites "$suites"
          # gha-ci-suite.yml reads these: a called workflow does not inherit this file's env.
          emit ci_env "$(jq -nc --arg CI_ROOT "$CI_ROOT" --arg CI_BUILD_ROOT "$CI_BUILD_ROOT" \
            --arg TIMINGS "$TIMINGS" --arg CTP_SEED "$CTP_SEED" --arg BUILD_META "$BUILD_META" \
            --arg ARTIFACT_URL_BASE "$ARTIFACT_URL_BASE" --arg COUNT_RESULTS "$COUNT_RESULTS" \
            --arg OVERLAY "$OVERLAY" --arg SUITES "$SUITES" '$ARGS.named')"
          emit sha "$sha"
          emit pr "$pr"
          emit post_status "$post_status"
          emit build_ns "$ns"
          emit cache_write "$cache_write"
          emit parallelism "$par"
          emit limit "$limit"
          emit force_build "$force"
          emit rerun_from "$rerun"
          emit sabotage "$sab"
          emit testtools "$tt"
          emit tc_until "$tc_until"
          echo "resolved: event=$EV sha=$sha pr=${pr:-none} suites=$suites test=$test_run namespace=$ns ccache_write=$cache_write status=$post_status${rerun:+ rerun_from=$rerun}${tt:+ testtools=$tt}${tc_until:+ tc_until=$tc_until}"

  # No cursor: the commit status is the record, so a missed night heals on the next.
  nightly:
    name: nightly batch
    if: >-
      ${{ (github.event_name == 'schedule' && github.repository == 'CUBRID/cubrid')
      || (github.event_name == 'workflow_dispatch' && inputs.nightly && inputs.sha == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write # workflow_dispatch is one of the two events GITHUB_TOKEN may raise
      statuses: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Dispatch one run per develop commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
          IN_SUITE: ${{ inputs.suite }}
          IN_PAR: ${{ inputs.parallelism }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_TT: ${{ inputs.testtools }}
        run: |
          BRANCH=develop
          WINDOW_HOURS=48 # one missed batch heals on the next night
          CAP=20          # develop takes 4 to 10 merges a day

          suite="${IN_SUITE:-all}"
          par="$IN_PAR"; limit="${IN_LIMIT:-0}"; tt="$IN_TT"
          want_ctx=$(jq -c '[.[].status_ctx]' <<<"$SUITES")
          since=$(date -u -d "$WINDOW_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)

          # Side branches' commits are listed too; the first-parent walk below says "merged".
          gh api --paginate "repos/${REPO}/commits?sha=${BRANCH}&since=${since}&per_page=100" \
            --jq '.[] | [.sha, (.parents[0].sha // "-"), (.commit.message | split("\n")[0])] | @tsv' \
            > /tmp/window.tsv
          # A dash, not an empty field: read collapses a run of tabs.
          declare -A parent title
          while IFS=$'\t' read -r c p t; do parent[$c]="$p"; title[$c]="$t"; done < /tmp/window.tsv

          covered() {
            local body missing
            body=$(gh api "repos/${REPO}/commits/$1/status") || {
              echo "::error::could not read the statuses of $1"; exit 1; }
            missing=$(jq -r --argjson want "$want_ctx" \
                '[.statuses[] | select(.state == "success" or .state == "failure") | .context] as $done
                 | ($want - $done) | join(", ")' <<<"$body")
            [ -z "$missing" ]
          }

          : > /tmp/todo.list
          c=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)
          while [ -n "$c" ] && [ -n "${parent[$c]+set}" ]; do
            if ! covered "$c"; then
              printf '%s\n' "$c" >> /tmp/todo.list
              if [ "$(wc -l < /tmp/todo.list)" -ge "$CAP" ]; then
                echo "::warning::$CAP commits is the cap; older ones wait for the next batch"
                break
              fi
            fi
            c="${parent[$c]}"
          done

          n=$(wc -l < /tmp/todo.list)
          if [ "$n" = 0 ]; then
            echo "nothing to run: every develop commit in the window has its verdicts"
            exit 0
          fi

          if [ "$REHEARSAL" = true ]; then
            echo "::notice::rehearsal: dispatching the newest of $n commits, printing the rest"
            tail -n +2 /tmp/todo.list | sed 's/^/  would dispatch: /'
            head -1 /tmp/todo.list > /tmp/dispatch.list
          else
            cp /tmp/todo.list /tmp/dispatch.list
          fi

          while read -r c; do
            gh workflow run gha-ci.yml --repo "$REPO" --ref "$REF" \
              -f nightly=true -f sha="$c" -f suite="$suite" \
              -f parallelism="$par" -f limit="$limit" -f testtools="$tt" </dev/null
            echo "dispatched ${c:0:10}  ${title[$c]}"
          done < /tmp/dispatch.list

  # Posted from here: build and collect pods can be evicted, and statuses: write must not reach a
  # runner that executes testcase code.
  status_pending:
    name: status (pending)
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' && needs.gate.outputs.test == 'true' && needs.gate.outputs.post_status == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Mark the head commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
          PR: ${{ needs.gate.outputs.pr }}
          SUITES_RUN: ${{ join(fromJson(needs.gate.outputs.suites), ' ') }}
        run: |
          pending() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" --silent -f state=pending -f context="$1" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="$2"
          }
          if [ -n "$PR" ]; then
            pending "$CTX_BUILD_RELEASE" "release build running"
            pending "$CTX_BUILD_DEBUG" "debug build running"
          fi
          for suite in $SUITES_RUN; do
            pending "$(jq -r --arg s "$suite" '.[$s].status_ctx' <<<"$SUITES")" "$suite suite running"
          done

  # No job outputs: a matrix job reports the last-finishing element's, making `mode` ambiguous.
  build:
    name: build (${{ matrix.mode }})
    needs: gate
    permissions: {}
    if: needs.gate.outputs.run == 'true'
    runs-on: cubrid-arc-build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [cubridci/cubridci:develop]
        mode: [release, debug]
        include:
          - mode: release
            args: ""
          - mode: debug
            args: "-m optdebug"
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    env:
      BUILD_MIRROR: /home/ci/seed/build
      BUILD_LOG_DIR: /home/ci/shared/runs/${{ github.run_id }}/build/${{ matrix.mode }}
      MODE: ${{ matrix.mode }}
      BUILD_ARGS: ${{ matrix.args }}
      # A build from another image or other args sits at the same $SHA/$MODE path.
      BUILD_RECIPE: ${{ matrix.image }}|${{ matrix.args }}
      BUILD_NS: ${{ needs.gate.outputs.build_ns }}
      CC: "ccache gcc"
      CXX: "ccache g++"
      CCACHE_DIR: /home/ci/cache/ccache/develop-${{ matrix.mode }}
      # The default is mtime, which a fresh checkout always misses.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 10G
      # A /* fall through */ comment changes -Werror results, so it must change the cache key.
      CCACHE_COMMENTS: 1
      # No CCACHE_HARDLINK: a hardlinked entry is one bad build away from a poisoned cache.
      CACHE_WRITE: ${{ needs.gate.outputs.cache_write }}

    steps:
      - name: 0. Environment check
        env:
          INPUT_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex characters"; exit 1; }
          echo "SHA=$INPUT_SHA" >> "$GITHUB_ENV"
          { mkdir -p "$BUILD_LOG_DIR" && printf '%s\n' "$BUILD_RECIPE" > "$BUILD_LOG_DIR/recipe"; } ||
            echo "::warning::could not write $BUILD_LOG_DIR/recipe, so plan will refuse to test this run's build"
          for d in "$BUILD_MIRROR/cubrid/.git" "$BUILD_MIRROR/cubrid.git"; do
            [ -d "$d" ] || {
              echo "::error::the node copy is not visible: $d. The pod template did not reach the pod, or gha-node-seed has not run"
              exit 1; }
          done
          mkdir -p "$CI_BUILD_ROOT"
          probe="$CI_BUILD_ROOT/.write-probe.$$"
          touch "$probe" && rm -f "$probe"
          mkdir -p "$STAMPS"
          printf 'start\t%s\n' "$(date -u +%s)" > "$STAMPS/build.tsv"
          awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev > "$RUNNER_TEMP/rx0"

      - name: 1. Is this SHA already published
        id: reuse
        env:
          INPUT_FORCE: ${{ needs.gate.outputs.force_build }}
        run: |
          eval "$SAME_RECIPE"
          if [ "$INPUT_FORCE" != 'true' ] && same_recipe "$CI_BUILD_ROOT/$BUILD_NS/$SHA/$MODE"; then
            echo "reuse=reused" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=built" >> "$GITHUB_OUTPUT"
          fi

      - name: 2. Source, the node copy with only the delta fetched
        if: steps.reuse.outputs.reuse != 'reused'
        run: |
          cd "$GITHUB_WORKSPACE"
          eval "$OVERLAY"
          # upper and work on the node disk: overlayfs refuses an upperdir on overlayfs, which / is.
          overlay "$BUILD_MIRROR/cubrid" "$RUNNER_TEMP/src" cubrid
          # Never shallow: build.sh reads the serial off `git rev-list --count`.
          /entrypoint.sh checkout "$SHA"

      - name: 3. Build
        if: steps.reuse.outputs.reuse != 'reused'
        run: |
          cd "$GITHUB_WORKSPACE"
          [ "$CACHE_WRITE" = 'true' ] || export CCACHE_READONLY=1 CCACHE_NOSTATS=1
          export CCACHE_TEMPDIR="$RUNNER_TEMP/ccache-tmp"
          # The node's counters are shared by concurrent builds and off in PR builds: a build counts its own in this log.
          export CCACHE_LOGFILE="$RUNNER_TEMP/ccache.log"
          mkdir -p "$CCACHE_TEMPDIR"
          [ -d "$CCACHE_DIR" ] || echo "::warning::no ccache at $CCACHE_DIR yet, so this is a cold build"
          # No -j: ninja reads the cgroup quota.
          # shellcheck disable=SC2086
          /entrypoint.sh build $BUILD_ARGS
          echo "ccache, the node's cache, cumulative over develop pushes:"
          ccache -s
          # Parallel compiles share the log, so one line can land inside another: read from every "[time pid] ".
          tally='
            BEGIN { if (results != "") printf "" > results }
            function entry(s,   pid, f, part, k) {
              if (!match(s, /^\[[^ ]+ [0-9]+ *\] /)) return
              pid = substr(s, 1, RLENGTH); gsub(/^\[[^ ]+ | *\] $/, "", pid)
              s = substr(s, RLENGTH + 1)
              if (s ~ /^=== CCACHE .* STARTED/) { delete cwd[pid]; delete src[pid] }
              else if (sub(/^Working directory: /, "", s)) cwd[pid] = s
              else if (sub(/^Source file: /, "", s)) src[pid] = s
              else if (sub(/^Result: /, "", s)) {
                if (results != "") print s "\t" cwd[pid] "\t" src[pid] > results
                k = s ~ /^cache hit \(direct\)/ ? 1 : s ~ /^cache hit \(preprocessed\)/ ? 2 : s ~ /^cache miss/ ? 3 : 0
                if (!k) return
                f = src[pid] ~ /^\// ? src[pid] : cwd[pid] "/" src[pid]
                part = "CUBRID source"
                if (cwd[pid] ~ /\/CMakeFiles\/CMakeScratch\//) part = "CMake checks"
                if (cwd[pid] ~ /\/3rdparty\// || f ~ /\/3rdparty\//) part = "external libraries"
                n[part, k]++; all[k]++
              }
            }
            function rate(d, p, m) { return d + p + m ? sprintf("%.2f %%", 100 * (d + p) / (d + p + m)) : "-" }
            {
              s = $0
              # entry() resets RSTART: cut both pieces before calling it, or the loop never moves on.
              while (match(substr(s, 2), /\[[0-9-]+T[0-9:.]+ [0-9]+ *\] /)) { head = substr(s, 1, RSTART); s = substr(s, RSTART + 1); entry(head) }
              entry(s)
            }
            END {
              if (!(all[1] + all[2] + all[3])) {
                print "::warning::no cache hit or miss in " FILENAME ", so ccache changed its log wording or no compile went through it"; exit
              }
              printf "ccache, this build: cache hit (direct) %d, cache hit (preprocessed) %d, cache miss %d, cache hit rate %s\n", all[1], all[2], all[3], rate(all[1], all[2], all[3])
              split("CUBRID source|external libraries|CMake checks", parts, "|")
              for (i = 1; i <= 3; i++)
                printf "  %-19s hit (direct) %d, hit (preprocessed) %d, miss %d, hit rate %s\n", parts[i] ":", n[parts[i], 1], n[parts[i], 2], n[parts[i], 3], rate(n[parts[i], 1], n[parts[i], 2], n[parts[i], 3])
            }'
          # Only the second pass writes a file, so a table that cannot be written leaves the counts in place.
          if awk "$tally" "$CCACHE_LOGFILE"; then
            results="$RUNNER_TEMP/ccache-results.tsv"
            { awk -v results="$results" "$tally" "$CCACHE_LOGFILE" > /dev/null && mkdir -p "$BUILD_LOG_DIR" &&
              gzip -c "$results" > "$BUILD_LOG_DIR/ccache-results.tsv.gz" &&
              echo "ccache, per-file results: $ARTIFACT_URL_BASE/${BUILD_LOG_DIR#"$CI_ROOT"/}/ccache-results.tsv.gz"; } ||
              echo "::warning::could not write the per-file ccache results to $results or $BUILD_LOG_DIR"
          else
            echo "::warning::ccache wrote no log to $CCACHE_LOGFILE"
          fi

      - name: 4. Publish, staged then moved in with one rename
        env:
          INPUT_FORCE: ${{ needs.gate.outputs.force_build }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: |
          dir="$CI_BUILD_ROOT/$BUILD_NS/$SHA/$MODE"
          eval "$SAME_RECIPE"
          # Another run on this SHA may have published since the reuse check; the rename decides.
          if [ "$REUSE" != 'reused' ] && [ "$INPUT_FORCE" != 'true' ] && same_recipe "$dir"; then
            REUSE=reused
          fi
          if [ "$REUSE" != 'reused' ]; then
            tmp="${dir}.tmp.${GITHUB_RUN_ID}"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            meta=$(printf 'sha=%s\nmode=%s\nns=%s\nrun_id=%s\nrun_attempt=%s\nbuilt_at=%s\nrecipe=%s\nworkflow=gha-ci\n' \
              "$SHA" "$MODE" "$BUILD_NS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(date -u +%s)" "$BUILD_RECIPE")
            # Inside the archive too: the shard reads it back out of what it unpacked.
            printf '%s\n' "$meta" > "/home/CUBRID/$BUILD_META"
            # An archive: a published tree made every process launch read the build over GlusterFS.
            tar -C /home -cf - CUBRID | gzip -1 > "$tmp/CUBRID.tar.gz"
            [ ! -f "$GITHUB_WORKSPACE/build.log" ] || cp "$GITHUB_WORKSPACE/build.log" "$tmp/build.log"
            printf '%s\n' "$meta" > "$tmp/build.meta"
            touch "$tmp/$BUILD_SENTINEL"

            if mv -T "$tmp" "$dir" 2>/dev/null; then
              :
            elif same_recipe "$dir" && [ "$INPUT_FORCE" != 'true' ]; then
              echo "another run published this build first, keeping theirs: $dir"
              rm -rf "$tmp"
            else
              old="${dir}.old.${GITHUB_RUN_ID}"
              rm -rf "$old"
              if [ -e "$dir" ] && ! mv -T "$dir" "$old"; then
                rm -rf "$tmp"
                echo "::error::could not move the old artifact aside: $dir"; exit 1
              fi
              if ! mv -T "$tmp" "$dir"; then
                [ -e "$old" ] && mv -T "$old" "$dir"
                rm -rf "$tmp"
                echo "::error::could not move the new artifact in: $dir"; exit 1
              fi
              rm -rf "$old"
            fi
          fi

          for f in "$BUILD_SENTINEL" build.meta; do
            [ -f "$dir/$f" ] || { echo "::error::the artifact has no $f: $dir. Re-run with force_build=true"; exit 1; }
          done
          if [ -f "$dir/CUBRID.tar.gz" ]; then
            tar -tzf "$dir/CUBRID.tar.gz" "CUBRID/$BUILD_META" >/dev/null || {
              echo "::error::the archive carries no CUBRID/$BUILD_META: $dir"; exit 1; }
          elif [ ! -f "$dir/CUBRID/$BUILD_META" ]; then
            echo "::error::the artifact has no CUBRID.tar.gz and no CUBRID/$BUILD_META: $dir. Re-run with force_build=true"
            exit 1
          fi
          echo "artifact $(du -sh "$dir" | cut -f1) built by run $(awk -F= '/^run_id=/ {print $2}' "$dir/build.meta") · volume $(df -h "$CI_ROOT" | awk 'END {print $3 "/" $2}') used"
          printf 'end\t%s\n' "$(date -u +%s)" >> "$STAMPS/build.tsv"

      - name: 5. WAN and build log
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f "$RUNNER_TEMP/rx0" ]; then
            echo "WAN received by this job: $(( ($(awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev) - $(cat "$RUNNER_TEMP/rx0")) / 1048576 )) MB"
          fi
          f="$GITHUB_WORKSPACE/build.log"
          if [ -f "$f" ]; then
            mkdir -p "$BUILD_LOG_DIR"
            cp "$f" "$BUILD_LOG_DIR/build.log"
            [ "$JOB_STATUS" = success ] || tail -60 "$f"
          fi

  # A comment run's check runs land on the default branch head: the build verdict is a status.
  build_status:
    name: build status
    needs: [gate, build]
    # !cancelled(), not always(): a superseded run's failure could land after the new verdict.
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.gate.outputs.test == 'true' && needs.gate.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
      actions: read # the per-leg conclusion, below
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Post each build leg to the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          legs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name | startswith("build (")) | [.name, .conclusion] | @tsv') || {
            echo "::error::could not read the jobs of this run; posting nothing"; exit 1; }
          bad=0
          post() {
            conc=$(printf '%s\n' "$legs" | awk -F'\t' -v n="build ($2)" '$1 == n {print $2}')
            case "$conc" in
              success) state=success; desc="$2 build passed" ;;
              '')      state=failure; desc="no $2 build job in this run"; bad=1 ;;
              *)       state=failure; desc="$2 build $conc -- see the run" ;;
            esac
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" --silent -f state="$state" -f context="$1" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="$desc" \
              || { echo "::error::could not post the status: $1"; bad=1; }
          }
          post "$CTX_BUILD_RELEASE" release
          post "$CTX_BUILD_DEBUG" debug
          [ "$bad" = 0 ]

  plan:
    name: plan
    needs: [gate, build]
    # Not success(): a red release leg must not block the debug suites.
    if: ${{ !cancelled() && needs.gate.outputs.test == 'true' }}
    permissions: {}
    runs-on: cubrid-arc-light
    timeout-minutes: 30
    container:
      image: cubridci/cubridci:test_rl8.10
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      WORKDIR: /home
      BUILD_NS: ${{ needs.gate.outputs.build_ns }}
      SUITES_RUN: ${{ join(fromJson(needs.gate.outputs.suites), ' ') }}
    outputs:
      shards_shell: ${{ steps.split.outputs.shards_shell }}
      shards_sql: ${{ steps.split.outputs.shards_sql }}
      shards_medium: ${{ steps.split.outputs.shards_medium }}
      shards_sql_by_cci: ${{ steps.split.outputs.shards_sql_by_cci }}
      rundir: ${{ steps.split.outputs.rundir }}
      build_run_ids: ${{ steps.build.outputs.build_run_ids }}
      ctp_sha: ${{ steps.tc.outputs.ctp_sha }}
      ctp_branch: ${{ steps.tc.outputs.ctp_branch }}

    steps:
      - name: Validate inputs
        id: args
        env:
          IN_PAR: ${{ needs.gate.outputs.parallelism }}
          IN_LIMIT: ${{ needs.gate.outputs.limit }}
          IN_SAB: ${{ needs.gate.outputs.sabotage }}
          IN_RERUN: ${{ needs.gate.outputs.rerun_from }}
        run: |
          if [ -n "$IN_PAR" ] \
             && { [[ ! "$IN_PAR" =~ ^[0-9]{1,3}$ ]] || [ "$IN_PAR" -lt 1 ] || [ "$IN_PAR" -gt 256 ]; }; then
            echo "::error::parallelism must be an integer in 1..256"; exit 1
          fi
          if [[ ! "$IN_LIMIT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::limit must be an integer"; exit 1
          fi
          case "$IN_SAB" in
            none|empty-shard|lose-shard|kill-shard) ;;
            *) echo "::error::sabotage must be none|empty-shard|lose-shard|kill-shard"; exit 1 ;;
          esac
          if [ -n "$IN_RERUN" ] && [[ ! "$IN_RERUN" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::rerun_from must be a run id (integer)"; exit 1
          fi
          echo "par=$IN_PAR" >> "$GITHUB_OUTPUT"
          echo "limit=$IN_LIMIT" >> "$GITHUB_OUTPUT"
          mkdir -p "$STAMPS"
          printf 'start\t%s\n' "$(date -u +%s)" > "$STAMPS/plan.tsv"

      - name: Verify the builds the build job published
        id: build
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          attr() { jq -r --arg s "$1" --arg k "$2" '.[$s][$k] // ""' <<<"$SUITES"; }
          unusable() {   # <dir> <mode>: why the suites cannot read it, or nothing
            if [ ! -f "$1/$BUILD_SENTINEL" ]; then
              echo "the build is not finished publishing (no sentinel): $1"
            elif [ ! -f "$1/CUBRID.tar.gz" ] && [ ! -d "$1/CUBRID" ]; then
              echo "no CUBRID archive or tree: $1"
            elif [ ! -f "$1/build.meta" ]; then
              echo "no build.meta: $1. Re-run with force_build=true"
            else
              meta_sha=$(awk -F= '/^sha=/ {print $2}' "$1/build.meta")
              want=$(cat "$CI_ROOT/runs/$GITHUB_RUN_ID/build/$2/recipe" 2>/dev/null) || want=''
              got=$(sed -n 's/^recipe=//p' "$1/build.meta")
              if [ "$meta_sha" != "$SHA" ]; then
                echo "meta sha($meta_sha) differs from the sha gate resolved($SHA)"
              elif [ -z "$want" ] || [ "$got" != "$want" ]; then
                echo "the published build was made with '${got:-no recorded recipe}', not this run's '${want:-unknown}'. Re-run the failed build job"
              fi
            fi
          }
          ids='{}'; recipes='{}'
          for mode in $(for s in $SUITES_RUN; do attr "$s" build_mode; done | sort -u); do
            dir="$CI_BUILD_ROOT/$BUILD_NS/$SHA/$mode"
            why=$(unusable "$dir" "$mode")
            if [ -z "$why" ]; then
              ids=$(jq -c --arg m "$mode" --arg id "$(awk -F= '/^run_id=/ {print $2}' "$dir/build.meta")" '.[$m] = $id' <<<"$ids")
              recipes=$(jq -c --arg m "$mode" --arg r "$(sed -n 's/^recipe=//p' "$dir/build.meta")" '.[$m] = $r' <<<"$recipes")
            elif [ "$mode" = debug ]; then
              echo "::error::$why"; exit 1
            else
              echo "::warning::$why"
            fi
          done
          echo "build_run_ids=$ids" >> "$GITHUB_OUTPUT"
          echo "build_recipes=$recipes" >> "$GITHUB_OUTPUT"

      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TC_APP_ID }}
          private-key: ${{ secrets.TC_APP_PRIVATE_KEY }}
          # One repo only: naming cubrid-testtools too fails the issuance.
          repositories: cubrid-testcases-private-ex
          owner: CUBRID
          permission-contents: read

      - name: Refresh testcases, decided once here
        id: tc
        env:
          GHI_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PR: ${{ needs.gate.outputs.pr }}
          INPUT_TT: ${{ needs.gate.outputs.testtools }}
          TC_UNTIL: ${{ needs.gate.outputs.tc_until }}
          RERUN_FROM: ${{ needs.gate.outputs.rerun_from }}
        run: |
          echo "::add-mask::$GHI_TOKEN"
          eval "$OVERLAY"
          attr() { jq -r --arg s "$1" --arg k "$2" '.[$s][$k] // ""' <<<"$SUITES"; }
          probe_branch() {
            local i rc
            for i in 1 2 3 4 5; do
              rc=0
              git ls-remote --exit-code --heads "$1" "$2" >/dev/null 2>&1 || rc=$?
              [ "$rc" -eq 0 ] && return 0
              [ "$rc" -eq 2 ] && return 2
              echo "::warning::ls-remote '$2' failed (attempt $i, exit $rc); retrying"
              sleep $((i * 3))
            done
            return 1
          }
          # The entrypoint drops the same global key on exit, so each use puts it back.
          use_token() {
            git config --global url."https://x-access-token:${GHI_TOKEN}@github.com/".insteadof \
              https://github.com/
          }
          wan() { awk 'NR>2 {n=$1; sub(/:.*/,"",n); if (n!="lo") r+=$2} END {print r+0}' /proc/net/dev; }

          if [ -n "$INPUT_PR" ] && [[ ! "$INPUT_PR" =~ ^[0-9]{1,7}$ ]]; then
            echo "::error::pr must be an integer"; exit 1
          fi

          # No fallback to develop: the failures would be reported against a tree nobody asked for.
          CTP_REPO=https://github.com/CUBRID/cubrid-testtools.git
          CTP_BRANCH="${INPUT_TT:-develop}"
          if [ -n "$INPUT_TT" ]; then
            use_token
            probe_rc=0
            probe_branch "$CTP_REPO" "$CTP_BRANCH" || probe_rc=$?
            case "$probe_rc" in
              0) ;;
              2) echo "::error::cubrid-testtools has no branch '$CTP_BRANCH'. Push it there first, or drop testtools="; exit 1 ;;
              *) echo "::error::could not reach $CTP_REPO after 5 attempts"; exit 1 ;;
            esac
          fi

          # Else a small fetch touches the node copy's packs, copying them whole into /rw.
          git config --global fetch.unpackLimit 1

          if [ -d "$CTP_SEED/.git" ]; then
            overlay "$CTP_SEED" /rw/ctp "$WORKDIR/cubrid-testtools"
            git -C "$WORKDIR/cubrid-testtools" remote set-url origin "$CTP_REPO"
          else
            echo "::warning::no usable CTP seed at $CTP_SEED; the entrypoint will clone"
            rm -rf "$WORKDIR/cubrid-testtools"
          fi

          rx0=$(wan)
          # sql and medium share a repo: a second checkout would move the tree under the split.
          done_repos=''
          for suite in $SUITES_RUN; do
            repo=$(attr "$suite" tc_repo)
            case " $done_repos " in *" $repo "*) continue ;; esac

            seed=$(attr "$suite" tc_seed)
            dir="$WORKDIR/$repo"
            [ -d "$seed" ] || {
              echo "::error::no testcase seed for $suite: $seed; gha-node-seed swaps it, so it can be absent for a moment"
              exit 1; }
            overlay "$seed" "/rw/$repo" "$dir"

            use_token
            # No fallback to develop: the verdict would be against the wrong cases.
            TC_REPO_URL="https://github.com/CUBRID/${repo}.git"
            if [ -n "$INPUT_PR" ]; then TC_BRANCH="tc/pr-${INPUT_PR}"; else TC_BRANCH=develop; fi
            probe_rc=0
            probe_branch "$TC_REPO_URL" "$TC_BRANCH" || probe_rc=$?
            case "$probe_rc" in
              0) ;;
              2) echo "::error::$repo has no $TC_BRANCH. TC Branch Sync creates tc/pr-<N> when the pull request opens"; exit 1 ;;
              *) echo "::error::could not reach $TC_REPO_URL after 5 attempts"; exit 1 ;;
            esac

            export BRANCH_TESTCASES="$TC_BRANCH"
            # Only the node mirror answers as of a past instant: the entrypoint fetches --depth 1.
            if [ -n "$TC_UNTIL" ]; then
              mirror="${seed}.git"
              [ -d "$mirror" ] || { echo "::error::no mirror for $repo: $mirror"; exit 1; }
              # By commit date a quiet repo looks dead; the hourly refresh rewrites FETCH_HEAD.
              [ "$(stat -c %Y "$mirror/FETCH_HEAD")" -ge "$(date -u -d "$TC_UNTIL" +%s)" ] || {
                echo "::error::$repo mirror predates the cutoff $TC_UNTIL; gha-node-seed is behind"; exit 1; }
              BRANCH_TESTCASES=$(git -C "$mirror" rev-list -1 --first-parent --before="$TC_UNTIL" "$TC_BRANCH")
              [ -n "$BRANCH_TESTCASES" ] || {
                echo "::error::$repo has no $TC_BRANCH commit at or before $TC_UNTIL"; exit 1; }
            fi
            BRANCH_TESTTOOLS="$CTP_BRANCH" /entrypoint.sh checkout "$suite"

            git -C "$dir" rev-parse HEAD > "/tmp/tc.$repo.sha"
            printf '%s\n' "$TC_BRANCH" > "/tmp/tc.$repo.branch"
            done_repos="$done_repos $repo"
          done

          if [ -n "$RERUN_FROM" ]; then
            for suite in $SUITES_RUN; do
              repo=$(attr "$suite" tc_repo)
              dir="$WORKDIR/$repo"
              : > "/tmp/tc.$suite.diff"
              : > "/tmp/tc.$suite.since"
              meta="$CI_ROOT/runs/$RERUN_FROM/$suite/plan/split.meta"
              # The split step says why the source run is unusable.
              [ -f "$meta" ] || continue
              since=$(sed -n "s/^tc_sha='\(.*\)'\$/\1/p" "$meta")
              [[ "$since" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::run $RERUN_FROM recorded no $suite tc commit, so what changed since is unknown. Use /run $suite"; exit 1; }
              if ! git -C "$dir" cat-file -e "$since^{commit}" 2>/dev/null; then
                use_token
                git -C "$dir" fetch -q --depth 1 "https://github.com/CUBRID/${repo}.git" "$since" || {
                  echo "::error::could not fetch $repo $since, the tc commit run $RERUN_FROM read"; exit 1; }
              fi
              git -C "$dir" diff --name-status -M "$since" HEAD -- "$(attr "$suite" tc_subdir)/" > "/tmp/tc.$suite.diff"
              echo "$since" > "/tmp/tc.$suite.since"
              echo "$suite: $(wc -l < "/tmp/tc.$suite.diff") paths changed in $(cat "/tmp/tc.$repo.branch") since $since"
            done
          fi
          echo "refresh WAN: $(( ($(wan) - rx0) / 1048576 )) MB · /rw $(df -h /rw | awk 'END {print $3}') used"
          {
            echo "ctp_sha=$(git -C "$WORKDIR/cubrid-testtools" rev-parse HEAD)"
            echo "ctp_branch=$CTP_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Case list and split
        id: split
        env:
          PAR: ${{ steps.args.outputs.par }}
          LIMIT: ${{ steps.args.outputs.limit }}
          SABOTAGE: ${{ needs.gate.outputs.sabotage }}
          RERUN_FROM: ${{ needs.gate.outputs.rerun_from }}
          SHA: ${{ needs.gate.outputs.sha }}
          BUILD_RECIPES: ${{ steps.build.outputs.build_recipes }}
        run: |
          eval "$COUNT_RESULTS"
          attr() { jq -r --arg s "$1" --arg k "$2" '.[$s][$k] // ""' <<<"$SUITES"; }
          rundir="$CI_ROOT/runs/${GITHUB_RUN_ID}"
          : > /tmp/matrix.jsonl

          for suite in $SUITES_RUN; do
            repo=$(attr "$suite" tc_repo)
            unit=$(attr "$suite" unit)
            excl=$(attr "$suite" exclude)
            runner=$(attr "$suite" runner)
            par="${PAR:-$(attr "$suite" par_default)}"
            # One light-lane shard for a re-run: spread out, it would delay other PRs' first runs.
            if [ -n "$RERUN_FROM" ]; then par=1; runner=cubrid-arc-light; fi
            subdir=$(attr "$suite" tc_subdir)
            dir="$WORKDIR/$repo"
            root="$dir/$subdir"
            out="$rundir/$suite"
            recipe=$(jq -r --arg m "$(attr "$suite" build_mode)" '.[$m] // ""' <<<"$BUILD_RECIPES")
            unrun=0; short=0; gone=0; nfail=0; changed=0

            # After the previous step's checkout: its reset --hard brings $excl back.
            [ -z "$excl" ] || rm -rf "${root:?}/$excl"
            # tc_subdir, not the suite: the image has no case rule for sql_by_cci.
            /entrypoint.sh cases "$subdir" "$root" | sed "s#^$WORKDIR/##" | sort > /tmp/cases.list
            case "$unit" in
              case) cp /tmp/cases.list /tmp/all.list ;;
              dir)
                find "$root" -mindepth 1 -maxdepth 1 -type d -name '_*' | sed "s#^$WORKDIR/##" | sort > /tmp/all.list ;;
              *) echo "::error::unknown unit '$unit' for suite $suite"; exit 1 ;;
            esac

            if [ -n "$RERUN_FROM" ]; then
              src="$CI_ROOT/runs/$RERUN_FROM/$suite/collect/failed.list"
              rd="$CI_ROOT/runs/$RERUN_FROM"
              if [ ! -f "$src" ]; then
                if [ ! -d "$rd" ]; then
                  echo "::error::run $RERUN_FROM has no run directory: pruned 30 days after the run, or never a gha-ci run"
                elif [ -d "$rd/$suite/results" ]; then
                  echo "::error::run $RERUN_FROM predates the run directory relayout. Use /run $suite"
                elif [ ! -d "$rd/$suite/shard" ]; then
                  echo "::error::run $RERUN_FROM never ran the $suite suite. Take the id from a run that ran it, not from 'built by run'"
                else
                  echo "::error::run $RERUN_FROM planned the suite but collect published no failure list (running, cancelled or dead)"
                fi
                exit 1
              fi
              srcdir="$rd/$suite"
              prev_sha=$(find "$srcdir/shard" -mindepth 2 -maxdepth 2 -name build.read \
                -exec awk -F= '/^sha=/ {print $2}' {} + 2>/dev/null | sort -u) || prev_sha=''
              # A suite with no shard has no build.read: only plan recorded the commit.
              [ -n "$prev_sha" ] || prev_sha=$(awk -F= '/^sha=/ {print $2}' "$srcdir/plan/split.meta" 2>/dev/null) || prev_sha=''
              if [ "$(printf '%s' "$prev_sha" | grep -c . || :)" -ne 1 ] || [ "$prev_sha" != "$SHA" ]; then
                echo "::error::run $RERUN_FROM tested '$(echo $prev_sha)', not this head $SHA. A re-run only re-runs the same commit"
                exit 1
              fi
              prev_recipe=$(find "$srcdir/shard" -mindepth 2 -maxdepth 2 -name build.read \
                -exec sed -n 's/^recipe=//p' {} + 2>/dev/null | sort -u) || prev_recipe=''
              [ -n "$prev_recipe" ] || prev_recipe=$(sed -n "s/^build_recipe='\(.*\)'\$/\1/p" "$srcdir/plan/split.meta" 2>/dev/null) || prev_recipe=''
              # A run from before recipes were recorded matches no build, and a buildless re-run of it must pass that on, not ''.
              [ -n "$prev_recipe" ] || grep -q "^build_recipe=" "$srcdir/plan/split.meta" 2>/dev/null || prev_recipe='no recorded recipe'
              # Nothing to keep the same when this run has no usable build, or when the source recorded
              # build_recipe='', which means none of the results a re-run of it relies on came from a build.
              if [ -n "$recipe" ] && ! grep -qx "build_recipe=''" "$srcdir/plan/split.meta" 2>/dev/null \
                 && [ "$prev_recipe" != "$recipe" ]; then
                echo "::error::the recipe recorded for run $RERUN_FROM is '$(echo ${prev_recipe:-no recorded recipe})', not '$recipe'. A re-run only re-runs the same build. Use /run $suite"
                exit 1
              fi
              # A shard with no result file left nothing in failed.list: carry its share.
              : > /tmp/unrun.list
              for sf in "$srcdir"/plan/shards/*.list; do
                [ -f "$sf" ] || continue
                i=$(basename "$sf" .list)
                a=$(awk -F'\t' -v k="$i" '$1 == k {print $2}' "$srcdir/plan/plan.tsv")
                h=$(eval "$(count "$srcdir/shard/$i")"; [ "$found" = yes ] && echo $((exec + skip)) || echo none)
                if [ "$h" = none ]; then
                  cat "$sf" >> /tmp/unrun.list
                  unrun=$((unrun + ${a:-0}))
                elif [ "${a:-0}" -gt "$h" ]; then
                  short=$((short + a - h))
                fi
              done
              if [ -f "$srcdir/plan/plan.tsv" ]; then
                while IFS=$'\t' read -r si scnt _; do
                  [ -n "$si" ] && [ ! -f "$srcdir/plan/shards/$si.list" ] && short=$((short + scnt))
                done < "$srcdir/plan/plan.tsv"
              fi
              cut -f2 "$src" | sed "s#^#$repo/#" > /tmp/want.list
              nfail=$(wc -l < /tmp/want.list)
              # The whole directory: a case is not known to be safe on its own.
              [ "$unit" != dir ] || sed -i "s#^\($repo/$subdir/[^/]*\)/.*#\1#" /tmp/want.list
              cat /tmp/unrun.list >> /tmp/want.list
              sort -u -o /tmp/want.list /tmp/want.list
              [ "$short" -eq 0 ] || echo "::warning::run $RERUN_FROM left $short more cases assigned but never handled. Nothing names them, so this re-run cannot pass"
              # A re-run's shards list cases even where the suite's unit is a directory.
              sort -u /tmp/all.list /tmp/cases.list | grep -xF -f /tmp/want.list > /tmp/sel.list || : > /tmp/sel.list
              # Deleted or renamed by the tc branch since, or a top-level directory it emptied: gone on purpose.
              awk -F'\t' -v r="$repo/" -v s="$subdir" '$1 ~ /^[DR]/ {
                  print r $2; if (match($2, "^" s "/[^/]+/")) print r substr($2, 1, RLENGTH - 1) }' \
                "/tmp/tc.$suite.diff" > /tmp/left.list
              { grep -vxF -f /tmp/sel.list /tmp/want.list || :; } | { grep -vxF -f /tmp/left.list || :; } > /tmp/gone.list
              gone=$(wc -l < /tmp/gone.list)
              if [ "$gone" -gt 0 ]; then
                echo "::warning::$gone are no longer in the tree, and the tc branch did not delete or rename them since, so this re-run cannot pass"
                sed 's/^/  gone: /' /tmp/gone.list
              fi
              # By case, so keep holds just the cases/ directories named: a failed directory becomes its cases.
              awk -F/ 'NR == FNR {d[$0]; next} $0 in d || ($1 "/" $2 "/" $3) in d' /tmp/sel.list /tmp/cases.list > /tmp/sel.cases
              awk -F'\t' '$1 !~ /^D/ {print $NF}' "/tmp/tc.$suite.diff" \
                | sed -nE "s#^(${subdir}/.*)/(cases|answers)/[^/]+\$#${repo}/\1/cases#p" | sort -u > /tmp/changed.dirs
              awk 'NR == FNR {d[$0]; next} {p = $0; sub(/\/[^\/]*$/, "", p)} p in d' /tmp/changed.dirs /tmp/cases.list > /tmp/changed.list
              changed=$(wc -l < /tmp/changed.list)
              sort -u /tmp/sel.cases /tmp/changed.list > /tmp/sel.list
              unit=case
            elif [ "$LIMIT" -gt 0 ]; then
              head -"$LIMIT" /tmp/all.list > /tmp/sel.list
            else
              cp /tmp/all.list /tmp/sel.list
            fi

            awk -F/ -v unit="$unit" 'FILENAME == ARGV[1] {c[$1 "/" $2 "/" $3]++; next}
              {printf "%s\t%d\n", $0, (unit == "case" ? 1 : c[$0] + 0)}' /tmp/cases.list /tmp/sel.list > /tmp/units.tsv
            nunit=$(wc -l < /tmp/units.tsv)
            total=$(awk -F'\t' '{s+=$2} END {print s+0}' /tmp/units.tsv)
            if [ "$nunit" -eq 0 ]; then
              [ -n "$RERUN_FROM" ] || { echo "::error::no cases at all: the glob matched nothing. Check the testcase tree"; exit 1; }
              echo "::notice::$suite: nothing to re-run, so no shard"
              par=0
            fi
            # More shards than units leaves the tail empty, and the matrix loop below rejects an empty shard.
            if [ "$par" -gt "$nunit" ]; then
              echo "::notice::parallelism $par exceeds the $nunit selected units; using $nunit shards"
              par="$nunit"
            fi

            rm -rf /tmp/shards; mkdir -p /tmp/shards
            timed=0
            if [ "$unit" = case ]; then
              mkdir -p "$(dirname "$TIMINGS")"
              [ -f "$TIMINGS" ] || : > "$TIMINGS"
              if [ -s "$TIMINGS" ]; then
                dflt=$(cut -f2 "$TIMINGS" | sort -n | awk '{a[NR]=$1} END {print (NR? a[int(NR/2)+1] : 10)}')
              else
                echo "::warning::timing data is empty, so LPT degrades to name order and the longest shard roughly doubles. Check $TIMINGS"
                dflt=10
              fi
              awk -v dflt="$dflt" -v tf="$TIMINGS" '
                BEGIN {
                  FS = "\t"
                  while ((getline line < tf) > 0) { n = split(line, a, "\t"); if (n >= 2) t[a[1]] = a[2] + 0 }
                  close(tf)
                }
                {
                  if ($1 in t) { sec = t[$1]; timed++ } else { sec = dflt }
                  printf "%015.3f\t%s\t%s\n", sec, $1, $2
                }
                END { print timed + 0 > "/tmp/timed.count" }
              ' /tmp/units.tsv | sort -rn -k1,1 -k2,2 > /tmp/sorted.tsv
              timed=$(cat /tmp/timed.count)
              # A develop merge into the tc branch can bring in hundreds of cases. Past 90 minutes one
              # shard nears the shard job's timeout-minutes (120). Not where a cases/ directory holds
              # many cases: keep would run all of them on every shard that got one.
              if [ -n "$RERUN_FROM" ] && [ "$(attr "$suite" unit)" = case ]; then
                load=$(awk -F'\t' '{s += $1} END {printf "%d", s}' /tmp/sorted.tsv)
                if [ "$load" -gt 5400 ]; then
                  par=$(( (load + 1799) / 1800 ))
                  max=$(attr "$suite" par_default)
                  [ "$par" -le "$max" ] || par="$max"
                  [ "$par" -le "$nunit" ] || par="$nunit"
                  runner=$(attr "$suite" runner)
                  echo "::notice::$suite: the re-run would take about $((load / 60)) minutes on one shard, so it runs on $par shards on $runner"
                fi
              fi
              awk -v par="$par" '
                BEGIN { FS = "\t"; for (i = 0; i < par; i++) load[i] = 0 }
                {
                  best = 0
                  for (i = 1; i < par; i++) if (load[i] < load[best]) best = i
                  load[best] += $1
                  printf "%s\n", $2 >> sprintf("/tmp/shards/%02d.list", best)
                  cases[best] += $3
                  units[best]++
                }
                END { for (i = 0; i < par; i++) printf "%02d\t%d\t%d\t%.1f\n", i, cases[i] + 0, units[i] + 0, load[i] }
              ' /tmp/sorted.tsv > /tmp/plan.tsv
            else
              awk -v par="$par" '
                BEGIN { FS = "\t" }
                { u[NR] = $1; c[NR] = $2 }
                END {
                  for (i = 0; i < par; i++) {
                    lo = int(i * NR / par); hi = int((i + 1) * NR / par)
                    f = sprintf("/tmp/shards/%02d.list", i)
                    n = 0
                    for (k = lo + 1; k <= hi; k++) { print u[k] > f; n += c[k] }
                    close(f)
                    printf "%02d\t%d\t%d\t0\n", i, n, hi - lo
                  }
                }
              ' /tmp/units.tsv > /tmp/plan.tsv
            fi

            got=$(awk -F'\t' '{s+=$2} END {print s+0}' /tmp/plan.tsv)
            [ "$got" -eq "$total" ] || { echo "::error::guard 1 of 3: the split lost cases ($got != $total)"; exit 1; }

            mkdir -p "$out/plan/shards" "$out/shard" "$out/collect"
            for i in $(seq 0 $((par - 1))); do
              n=$(printf "%02d" "$i")
              [ -f "/tmp/shards/$n.list" ] || {
                echo "::error::no units assigned to shard $i of $suite (parallelism $par, units $nunit)"; exit 1; }
              cp "/tmp/shards/$n.list" "$out/plan/shards/$n.list"
              # No usable build: a shard would only stop at its build check. The share list stays for a re-run.
              [ -z "$recipe" ] || printf '{"suite":"%s","i":"%02d","runner":"%s"}\n' "$suite" "$i" "$runner" >> /tmp/matrix.jsonl
            done
            cp /tmp/plan.tsv "$out/plan/plan.tsv"
            cp /tmp/sel.list "$out/plan/cases.list"
            [ -z "$RERUN_FROM" ] || cp /tmp/changed.list "$out/plan/changed.list"
            # Quoted: shard and collect source it.
            {
              echo "total=$total"
              echo "unit=$unit"
              echo "sha=$SHA"
              echo "units=$nunit"
              echo "par=$par"
              echo "timed=$timed"
              echo "tc_sha='$(cat "/tmp/tc.$repo.sha")'"
              echo "tc_branch='$(cat "/tmp/tc.$repo.branch")'"
              echo "rerun_unrun=$unrun"
              echo "rerun_short=$short"
              echo "rerun_gone=$gone"
              echo "rerun_failed=$nfail"
              echo "rerun_changed=$changed"
              echo "rerun_since='$(cat "/tmp/tc.$suite.since" 2>/dev/null || :)'"
              # A re-run with no usable build keeps its source's recipe: a re-run of it relies on the same results.
              echo "build_recipe='${recipe:-${prev_recipe:-}}'"
            } > "$out/plan/split.meta"

            case "$SABOTAGE" in
              empty-shard)
                echo "::warning::sabotage=empty-shard: shard 00's share is emptied, so shard 00 must fail"
                : > "$out/plan/shards/00.list" ;;
              lose-shard)
                echo "::warning::sabotage=lose-shard: shard 00's share file is deleted, so shard 00 must fail"
                rm -f "$out/plan/shards/00.list" ;;
              kill-shard)
                echo "::warning::sabotage=kill-shard: shard 00 dies with its share intact, so shard 00 must fail"
                : > "$out/plan/shards/00.kill" ;;
            esac
          done

          {
            for suite in $SUITES_RUN; do
              echo "shards_$suite=$(jq -sc --arg s "$suite" 'map(select(.suite == $s))' /tmp/matrix.jsonl)"
            done
            echo "rundir=$rundir"
          } >> "$GITHUB_OUTPUT"
          printf 'end\t%s\n' "$(date -u +%s)" >> "$STAMPS/plan.tsv"

      - name: Split summary
        env:
          RUNDIR: ${{ steps.split.outputs.rundir }}
          SHA: ${{ needs.gate.outputs.sha }}
          BRIDS: ${{ steps.build.outputs.build_run_ids }}
        run: |
          {
            echo "## Split"
            echo
            echo "| suite | selected cases | units | shards | measured timings |"
            echo "|---|---|---|---|---|"
            for suite in $SUITES_RUN; do
              . "$RUNDIR/$suite/plan/split.meta"
              echo "| \`$suite\` | $total | $units | $par | $timed |"
            done
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| build SHA | \`$SHA\` |"
            jq -r 'to_entries[] | "| \(.key) build | built by run `\(.value)` |"' <<<"$BRIDS"
            echo "| current run | \`$GITHUB_RUN_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # One pipeline per suite: a suite's status waits for its own shards, not for every suite's.
  suite:
    name: ${{ matrix.suite }}
    needs: [gate, build, plan]
    # !cancelled(), not always(): a cancelled run re-evaluates it, and always() would keep every shard running.
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.gate.outputs.test == 'true' }}
    # The most the called jobs get: collect reads this run, status posts the verdict.
    permissions:
      actions: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.gate.outputs.suites) }}
    uses: ./.github/workflows/gha-ci-suite.yml
    with:
      suite: ${{ matrix.suite }}
      ci_env: ${{ needs.gate.outputs.ci_env }}
      shards: ${{ needs.plan.outputs[format('shards_{0}', matrix.suite)] }}
      sha: ${{ needs.gate.outputs.sha }}
      pr: ${{ needs.gate.outputs.pr }}
      post_status: ${{ needs.gate.outputs.post_status }}
      rerun_from: ${{ needs.gate.outputs.rerun_from }}
      build_ns: ${{ needs.gate.outputs.build_ns }}
      build_result: ${{ needs.build.result }}
      plan_result: ${{ needs.plan.result }}
      rundir: ${{ needs.plan.outputs.rundir }}
      build_run_ids: ${{ needs.plan.outputs.build_run_ids }}
      ctp_sha: ${{ needs.plan.outputs.ctp_sha }}
      ctp_branch: ${{ needs.plan.outputs.ctp_branch }}
    secrets:
      TC_APP_ID: ${{ secrets.TC_APP_ID }}
      TC_APP_PRIVATE_KEY: ${{ secrets.TC_APP_PRIVATE_KEY }}

  # A suite whose workflow never started, or stopped before its status job, is left pending.
  status_cancelled:
    name: status (cancelled)
    needs: [gate, suite]
    if: ${{ cancelled() && needs.gate.outputs.run == 'true' && needs.gate.outputs.test == 'true' && needs.gate.outputs.post_status == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Post the cancellation to the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
          SUITES_RUN: ${{ join(fromJson(needs.gate.outputs.suites), ' ') }}
        run: |
          export RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Newest first, and only the newest: an attempt of Re-run all jobs posts pending again under the same URL.
          latest=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses?per_page=100" \
            --jq '.[] | select(.target_url == env.RUN_URL) | [.context, .state] | @tsv' | awk -F'\t' '!seen[$1]++')
          for suite in $SUITES_RUN; do
            ctx=$(jq -r --arg s "$suite" '.[$s].status_ctx' <<<"$SUITES")
            case "$(awk -F'\t' -v c="$ctx" '$1 == c {print $2}' <<<"$latest")" in
              success|failure|error) continue ;;
            esac
            # error, not failure: the commit was not judged, and the batch takes it again.
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" --silent -f state=error -f context="$ctx" \
              -f target_url="$RUN_URL" -f description="run was superseded or cancelled"
          done
