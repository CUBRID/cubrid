version: 2.1

# Trigger-provided values (GitHub Actions comment trigger) + pipeline-wide knobs.
parameters:
  baseline:
    type: string
    default: "none"
  run_shell_test:
    type: boolean
    default: false
  run_sql_test:
    type: boolean
    default: false
  run_medium_test:
    type: boolean
    default: false
  run_all_test:
    type: boolean
    default: false
  # Single knob for the shell fan-out width. CUBRIDQA-1471 (40/10 pool
  # partition) changes this to 40 — keep every reference on this parameter.
  shell_parallelism:
    type: integer
    default: 50

executors:
  # Build machine: ccache environment baked in so both build jobs share it
  cubrid-build:
    docker:
      - image: cubridci/cubridci:develop
    resource_class: xlarge
    working_directory: /home
    environment:
      MAKEFLAGS: -j 8
      CC: "ccache gcc"
      CXX: "ccache g++"
      CCACHE_DIR: /home/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_HARDLINK: 1

  cubrid-default:
    docker:
      - image: cubridci/cubridci:develop
    working_directory: /home

  cubrid-test-shell:
    docker:
      - image: cubridci/cubridci:test_shell
    # self-hosted runner
    resource_class: cubrid/ramdisk
    working_directory: /home
    environment:
      # GlusterFS build layout contract, defined once for both sides:
      # download-build publishes <root>/<sha>/<mode>/CUBRID + sentinel,
      # test_shell waits on the sentinel and mounts that tree.
      BUILD_CACHE_ROOT: &build_cache_root /home/build-cache/builds
      BUILD_SENTINEL: &build_sentinel .complete

  # CUBRIDQA-1506, temporary. The Helm values pin cubridci:test_shell on this
  # resource class; the image named here wins, so this needs no runner change.
  cubrid-build-node:
    docker:
      - image: cubridci/cubridci:rl8.10
    resource_class: cubrid/ramdisk
    working_directory: /home/cubrid
    environment:
      BUILD_CACHE_ROOT: *build_cache_root
      BUILD_SENTINEL: *build_sentinel
      BUILD_MIRROR: /home/build-cache/cubrid-mirror
      CCACHE_DIR: /home/build-cache/ccache-shell-debug
      # No CCACHE_HARDLINK: this cache is on GlusterFS and the build tree is
      # not, so hardlinking would silently fall back to copying.
      CCACHE_COMPILERCHECK: content

commands:
  submodules:
    description: "Sync and init git submodules"
    steps:
      - run:
          name: Submodules
          command: |
            git submodule sync
            git submodule update --init

  collect-build-logs:
    description: "Collect build logs and store them"
    steps:
      # when: always — a failed build is exactly when build.log is worth having;
      # without it this step is skipped and the upload below finds nothing.
      - run:
          name: Store build logs and commits
          when: always
          command: |
            mkdir -p /tmp/build_logs
            mv -f build.log /tmp/build_logs || true
            git log | head -n 1000 > /tmp/build_logs/commits.log || true
      - store_artifacts:
          path: /tmp/build_logs
          when: always

  build-cubrid:
    description: "Build CUBRID with ccache (shared by release and debug builds)"
    parameters:
      ccache-prefix:
        type: string
      mode:
        type: string
        default: release
      build-args:
        type: string
        default: ""
    steps:
      - checkout
      - restore_cache:
          keys:
            - &ccache_key << parameters.ccache-prefix >>-{{ checksum "build.sh" }}-{{ checksum "CMakeLists.txt" }}-develop-{{ .Revision }}
            - << parameters.ccache-prefix >>-{{ checksum "build.sh" }}-{{ checksum "CMakeLists.txt" }}-develop-
      - submodules
      - run:
          name: Build (<< parameters.mode >>)
          command: |
            mkdir -p $CCACHE_DIR
            ccache --max-size=5G
            ccache -z
            scl enable devtoolset-8 -- /entrypoint.sh build << parameters.build-args >>
            ccache -s
      # ccache save: write only on develop-branch builds -> a single shared warm cache
      # (other branches/PRs are restore-only; avoids 5G-per-PR bloat and non-develop pollution)
      - when:
          condition:
            equal: [ develop, << pipeline.git.branch >> ]
          steps:
            - save_cache:
                key: *ccache_key
                paths:
                  - /home/.ccache
      - collect-build-logs

  package-build:
    description: "Upload the built tree as an artifact and hand its job number to consumers"
    parameters:
      mode:
        # One vocabulary end to end: this is the workspace file suffix
        # (BUILD_NUM_<mode>) and the builds/<SHA>/<mode> path segment.
        type: enum
        enum: [ release, debug ]
    steps:
      - run:
          name: Package build for artifact (<< parameters.mode >>)
          command: |
            tar czf CUBRID.tar.gz CUBRID
            echo "Build packaged: $(ls -lh CUBRID.tar.gz | awk '{print $5}')"
      - store_artifacts:
          path: CUBRID.tar.gz
          destination: CUBRID.tar.gz
      - run:
          name: Save build metadata for consumers (<< parameters.mode >>)
          command: |
            mkdir -p workspace
            echo "${CIRCLE_BUILD_NUM}" > workspace/BUILD_NUM_<< parameters.mode >>
      - persist_to_workspace:
          root: workspace
          paths: [ BUILD_NUM_<< parameters.mode >> ]

  resolve-testcases:
    description: "Resolve testcases branch/SHA for a TC repo; export BRANCH_TESTCASES and materialize cache-key inputs"
    parameters:
      tc-repo:
        # Resolve against the repo the suite actually checks out: public
        # cubrid-testcases for sql/medium, private cubrid-testcases-private-ex
        # for shell. Their tc/pr-<N> branches are created independently and
        # often diverge, so each suite must resolve against its own repo.
        type: string
        default: cubrid-testcases
    steps:
      - run:
          name: Resolve testcases branch and SHA (<< parameters.tc-repo >>)
          command: |
            TC_REPO="https://x-access-token:${GHI_TOKEN}@github.com/CUBRID/<< parameters.tc-repo >>.git"

            # ls-remote the testcases repo with retries. A transient network error
            # (e.g. "Empty reply from server") must not fail the job: on persistent
            # failure we return empty and fall back to develop.
            resolve_sha() {
              local i out
              for i in 1 2 3 4 5; do
                if out=$(git ls-remote "$TC_REPO" "$1" 2>/dev/null); then
                  echo "$out" | cut -f1
                  return 0
                fi
                echo "[warn] ls-remote '$1' failed (attempt $i); retrying" >&2
                sleep $((i * 3))
              done
              echo "[warn] ls-remote '$1' failed after retries; continuing without SHA" >&2
            }

            if [[ "$CIRCLE_BRANCH" == pull/* ]]; then
              TC_BRANCH="tc/pr-${CIRCLE_BRANCH//[^0-9]/}"
            else
              TC_BRANCH="develop"
            fi

            TC_SHA=$(resolve_sha "$TC_BRANCH")
            if [ -z "$TC_SHA" ]; then
              TC_BRANCH="develop"
              TC_SHA=$(resolve_sha develop)
            fi

            echo "TC_BRANCH: $TC_BRANCH"
            echo "TC_SHA: $TC_SHA"

            # checkout reads BRANCH_TESTCASES to select the testcases branch
            echo "export BRANCH_TESTCASES=$TC_BRANCH" >> "$BASH_ENV"

            # Cache keys cannot read shell vars, so materialize the runtime values
            # to files and reference them via {{ checksum }} in restore_cache/save_cache.
            echo "${TC_BRANCH//\//-}" > /tmp/tc_cache_branch
            echo "$TC_SHA" > /tmp/tc_cache_sha
            echo "develop" > /tmp/tc_cache_develop

  run-tests:
    description: "Run test scripts (CUBRID must be at /home/CUBRID)"
    steps:
      # The test steps set `shell: /bin/bash` (i.e. no -e/-o pipefail): the prune
      # pipelines exit non-zero when there is nothing left to prune.
      - run:
          name: Check out testcases and testtools
          shell: /bin/bash
          command: |
            if [ -z "$TEST_SUITE" ] || [ "$TEST_SUITE" = "none" ]; then
              echo "[error] TEST_SUITE is not set"
              exit 1
            fi
            /entrypoint.sh checkout
      - run:
          name: Split tests for this node
          shell: /bin/bash
          command: |
            # Only the glob+split pipeline and the prune differ per suite.
            case "$TEST_SUITE" in
              shell)
                base_dir="cubrid-testcases-private-ex"
                rm -rf "$base_dir/shell/_25_unstable"
                split_pipe() {
                  circleci tests glob "$base_dir/$TEST_SUITE/_*/**/*.sh" | grep -P '/([^/]+)/cases/\1\.sh$' \
                    | circleci tests run --command="tee tc.list" --verbose --split-by=timings --timings-type=file
                }
                prune() {
                  xargs -n1 dirname < tc.list > tc_dirs.list
                  find "$base_dir" -name "cases" -type d | grep -v -F -f tc_dirs.list | xargs -r rm -rf
                }
                ;;
              *)
                base_dir="cubrid-testcases"
                split_pipe() {
                  circleci tests glob "$base_dir/$TEST_SUITE/_*" \
                    | circleci tests run --command="xargs -n1 >> tc.list" --verbose --split-by=name
                }
                prune() {
                  find "$base_dir" -name "*.sql" -type f | grep -v -F -f tc.list | xargs -r rm -rf
                }
                ;;
            esac

            # A split can fail transiently (e.g. the circleci-tests-plugin-cli
            # download timing out under 50-way fan-out). Retry, and on persistent
            # failure fail this node rather than fall through to the empty-list
            # halt below, which would silently skip this node's share of tests.
            n=0
            until { : > tc.list; split_pipe; }; do
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "[error] test split failed after $n attempts; failing node to avoid silently skipping tests"
                exit 1
              fi
              echo "[warn] test split failed; retry $n after backoff"
              sleep $((n * 10))
            done

            # Split succeeded, so an empty list is a genuine empty assignment
            # (normal during "rerun failed tests only") -> halt as success. Halting
            # here, before the build wait, releases the slot right away.
            if [ ! -s tc.list ]; then
              echo "[debug] No tests assigned to this node"
              circleci-agent step halt
              exit 0
            fi
            prune
            # wc -w, not -l: the shell split writes tc.list as one space-separated
            # line (tee), sql/medium writes one path per line — word count is the
            # case count either way, and a wrong "0" here would look like the
            # silent-skip failure mode we deliberately fail loudly on.
            echo "[debug] assigned testcases: $(wc -w < tc.list)"
      - run:
          name: Mount debug build from GlusterFS
          shell: /bin/bash
          command: |
            if [ "$TEST_SUITE" != "shell" ]; then
              echo "[debug] non-shell suite runs on the artifact build; nothing to mount"
              exit 0
            fi
            # Explicit, so the contract does not depend on the step's shell
            # setting: any failure below (including publish's) aborts the job.
            set -eo pipefail
            : "${BUILD_CACHE_ROOT:?}" "${BUILD_SENTINEL:?}"
            BUILD_DIR="${BUILD_CACHE_ROOT}/${CIRCLE_SHA1}/debug"

            # requires(download-build) normally means the sentinel is already
            # there; the bounded wait covers concurrent workflow reruns.
            n=0
            until [ -f "${BUILD_DIR}/${BUILD_SENTINEL}" ]; do
              n=$((n + 1))
              if [ "$n" -gt 60 ]; then
                echo "[error] build sentinel not found after 300s: ${BUILD_DIR}/${BUILD_SENTINEL}"
                exit 1
              fi
              [ $((n % 12)) -eq 1 ] && echo "[debug] waiting for build sentinel... ($(((n - 1) * 5))s elapsed)"
              sleep 5
            done

            if [ -x /home/CUBRID/bin/cubrid ]; then
              echo "[debug] /home/CUBRID already mounted by postStart (legacy flat layout), reusing"
              exit 0
            fi
            # upperdir/workdir must sit on the emptyDir volume: the kernel refuses
            # an overlay whose upper is on the container rootfs.
            mkdir -p /build-rw/step-upper /build-rw/step-work /home/CUBRID
            mount -t overlay overlay \
              -o "lowerdir=${BUILD_DIR}/CUBRID,upperdir=/build-rw/step-upper,workdir=/build-rw/step-work" /home/CUBRID \
              || { echo "[error] CUBRID overlay mount failed"; exit 1; }
            echo "[debug] CUBRID mounted (overlay on ${BUILD_DIR}/CUBRID)"
      - run:
          name: Run tests
          shell: /bin/bash
          no_output_timeout: 45m
          command: |
            ulimit -c 10485760   # limit core files to 10mb
            /entrypoint.sh test
      - run:
          name: Collect Logs
          when: on_fail
          command: |
            mkdir -p /tmp/logs
            cp -f /tmp/tests/* /tmp/logs || true
            if [ "$TEST_SUITE" = "shell" ]; then
              mv -f cubrid-testtools/CTP/result/shell/current_runtime_logs /tmp/logs/ctp_log || true
            else
              mv -f CUBRID/log /tmp/logs/cubrid_log || true
              mv -f cubrid-testtools/CTP/sql/log /tmp/logs/ctp_log || true
            fi
            [ -e CUBRID/log/coredump ] && mv -f CUBRID/log/coredump /tmp/logs/coredump || true
            mv -f tc.list /tmp/logs/ || true
      - store_test_results:
          path: /tmp/tests
          when: always
      - store_artifacts:
          path: /tmp/logs
          when: on_fail

  download-build-from-artifact:
    description: "Download CUBRID build from artifact (for sql/medium tests)"
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Download build from artifact
          command: |
            BUILD_NUM=$(cat /tmp/workspace/BUILD_NUM_debug)
            echo "Downloading build from job #${BUILD_NUM}..."

            RESPONSE=$(curl -s -H "Circle-Token: ${CIRCLECI_TOKEN}" \
              "https://circleci.com/api/v2/project/gh/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${BUILD_NUM}/artifacts")

            # Extract CUBRID.tar.gz URL. `|| true`: grep exits non-zero when the
            # artifact is absent, and under the default errexit shell that would
            # kill the step before the diagnostic below ever prints.
            ARTIFACT_URL=$(echo "$RESPONSE" | grep -o '"url": "[^"]*CUBRID.tar.gz[^"]*"' | head -1 | sed 's/"url": "//;s/"$//' || true)

            if [ -z "$ARTIFACT_URL" ]; then
              echo "ERROR: CUBRID.tar.gz artifact not found"
              echo "Response: $RESPONSE"
              exit 1
            fi

            echo "Artifact URL: $ARTIFACT_URL"

            curl -L -o /tmp/CUBRID.tar.gz "$ARTIFACT_URL"
            tar xzf /tmp/CUBRID.tar.gz -C /home/
            rm /tmp/CUBRID.tar.gz

            ls -la /home/CUBRID

  download-build-to-glusterfs:
    description: "Download CUBRID build to GlusterFS shared storage (for shell tests)"
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Download build to GlusterFS
          command: |
            # Explicit, so the contract does not depend on the step's shell
            # setting: any failure below (including publish's) aborts the job.
            set -eo pipefail
            : "${BUILD_CACHE_ROOT:?}" "${BUILD_SENTINEL:?}"

            # One build-number file per packaged mode (package-build persists
            # BUILD_NUM_RELEASE / BUILD_NUM_DEBUG), so this transports exactly what
            # the build jobs produced: debug only on PRs, both on develop.
            publish() {
              local mode="$1" build_num="$2"
              local build_dir="${BUILD_CACHE_ROOT}/${CIRCLE_SHA1}/${mode}"
              echo "== ${mode}: artifact of job #${build_num} -> ${build_dir}"

              # Same commit = same build: reuse across workflow retries.
              if [ -f "${build_dir}/${BUILD_SENTINEL}" ]; then
                echo "Build already complete for this commit, skipping download"
                ls -la "${build_dir}/CUBRID"
                return 0
              fi

              # Stage, then publish with one atomic rename: consumers never see a
              # half-extracted tree, and a concurrent duplicate run just loses the
              # rename and drops its staging dir (no rm of a published tree).
              local tmp_dir="${build_dir}.tmp.$$"
              rm -rf "${tmp_dir}"
              mkdir -p "${tmp_dir}"

              local response artifact_url
              response=$(curl -s -H "Circle-Token: ${CIRCLECI_TOKEN}" \
                "https://circleci.com/api/v2/project/gh/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${build_num}/artifacts")
              # `|| true`: grep exits non-zero when the artifact is absent, and
              # under errexit that would kill the job before the diagnostic below.
              artifact_url=$(echo "$response" | grep -o '"url": "[^"]*CUBRID.tar.gz[^"]*"' | head -1 | sed 's/"url": "//;s/"$//' || true)
              if [ -z "$artifact_url" ]; then
                echo "ERROR: CUBRID.tar.gz artifact not found in job #${build_num}"
                echo "Response: $response"
                rm -rf "${tmp_dir}"
                return 1
              fi

              curl -L -o "${tmp_dir}/CUBRID.tar.gz" "$artifact_url"
              tar xzf "${tmp_dir}/CUBRID.tar.gz" -C "${tmp_dir}"
              rm "${tmp_dir}/CUBRID.tar.gz"
              touch "${tmp_dir}/${BUILD_SENTINEL}"

              if mv -T "${tmp_dir}" "${build_dir}" 2>/dev/null; then
                echo "Build published at ${build_dir}"
              else
                # Lost the publish race to a concurrent duplicate run.
                echo "Another run published this build first, discarding staging dir"
                rm -rf "${tmp_dir}"
              fi
              ls -la "${build_dir}/CUBRID"
            }

            # publish is called plainly on purpose: errexit propagates any
            # failure inside it (an `if !` wrapper would suspend errexit within
            # the function and could publish a half-extracted tree).
            published=0
            for num_file in /tmp/workspace/BUILD_NUM_*; do
              [ -f "$num_file" ] || continue
              publish "${num_file##*/BUILD_NUM_}" "$(cat "$num_file")"
              published=$((published + 1))
            done

            if [ "$published" -eq 0 ]; then
              echo "ERROR: no BUILD_NUM_* file in the workspace - did a build job skip packaging?"
              exit 1
            fi
            echo "Transported ${published} build(s) for ${CIRCLE_SHA1}"
            df -h /home/build-cache

jobs:
  build:
    executor: cubrid-build
    steps:
      - build-cubrid:
          ccache-prefix: ccache-global-v2
      # The release build is packaged only on develop, where it is preserved in
      # GlusterFS for downstream consumers. PR pipelines test the debug build,
      # so packaging release there would upload an artifact nobody reads.
      - when:
          condition:
            equal: [ develop, << pipeline.git.branch >> ]
          steps:
            - package-build:
                mode: release

  build_debug:
    executor: cubrid-build
    steps:
      - build-cubrid:
          ccache-prefix: ccache-debug-v2
          mode: optdebug
          build-args: "-m optdebug"
      # Package when a test job will consume it, or on develop for preservation.
      # Not for shell: it builds on its own node now (CUBRIDQA-1506).
      - when:
          condition:
            or:
              - << pipeline.parameters.run_sql_test >>
              - << pipeline.parameters.run_medium_test >>
              - equal: [ develop, << pipeline.git.branch >> ]
          steps:
            - package-build:
                mode: debug

  artifact-test:
    executor: cubrid-default
    parameters:
      suite:
        type: string
      parallelism:
        type: integer
        default: 1
    parallelism: << parameters.parallelism >>
    environment:
      TEST_SUITE: << parameters.suite >>
    steps:
      - resolve-testcases
      - restore_cache:
          keys:
            - &tc_key cubrid-testcases-{{ checksum "/tmp/tc_cache_branch" }}-{{ checksum "/tmp/tc_cache_sha" }}
            - cubrid-testcases-{{ checksum "/tmp/tc_cache_branch" }}-
            - cubrid-testcases-{{ checksum "/tmp/tc_cache_develop" }}-
      - download-build-from-artifact
      - run-tests
      - run:
          name: Clean up tc before save_cache
          command: |
            git -C cubrid-testcases clean -fd
            git -C cubrid-testcases reset --hard
      - save_cache:
          key: *tc_key
          paths:
            - cubrid-testcases

  test_shell:
    executor: cubrid-test-shell
    parallelism: << pipeline.parameters.shell_parallelism >>
    environment:
      BASELINE: << pipeline.parameters.baseline >>
      TEST_SUITE: "shell"
    steps:
      # Testcases branch is resolved once in download-build and shared via the
      # workspace, so the 50 shell pods never hit cubrid-testcases themselves.
      - attach_workspace:
          at: /tmp/tcws
      - run:
          name: Load shared testcases branch
          command: |
            echo "export BRANCH_TESTCASES=$(cat /tmp/tcws/BRANCH_TESTCASES)" >> "$BASH_ENV"
      - run-tests

  download-build:
    description: "Transport the packaged build(s) to GlusterFS; for the shell suite, also resolve the testcases branch once for all shell pods"
    executor: cubrid-test-shell
    parameters:
      for-shell-tests:
        # The develop path transports and stops: resolving the testcases branch
        # there would run a private-repo ls-remote nobody reads, and its failure
        # would redden the develop commit even though the transport succeeded.
        type: boolean
        default: true
    steps:
      # Note: a pipeline that is both on develop and has run_shell_test set would
      # transport twice (this job and the shell path's). Not guarded: the comment
      # trigger only fires on pull requests, so develop never carries that flag.
      - download-build-to-glusterfs
      - when:
          condition: << parameters.for-shell-tests >>
          steps:
            # Resolve the testcases branch a single time (reuses resolve-testcases,
            # which exports BRANCH_TESTCASES) and hand it to the shell pods. Shell
            # runs the private repo, so resolve against cubrid-testcases-private-ex.
            - resolve-testcases:
                tc-repo: cubrid-testcases-private-ex
            - run:
                name: Persist testcases branch for shell pods
                command: |
                  mkdir -p /tmp/tcws
                  echo "$BRANCH_TESTCASES" > /tmp/tcws/BRANCH_TESTCASES
            - persist_to_workspace:
                root: /tmp/tcws
                paths: [ BRANCH_TESTCASES ]

  # CUBRIDQA-1506, temporary: stands in for download-build on the shell path
  # and goes away with CircleCI (CUBRIDQA-1501).
  build-debug-node:
    description: "Build the debug package on the runner node and publish it to GlusterFS"
    executor: cubrid-build-node
    steps:
      - resolve-testcases:
          tc-repo: cubrid-testcases-private-ex
      - run:
          name: Persist testcases branch for shell pods
          command: |
            mkdir -p /tmp/tcws
            echo "$BRANCH_TESTCASES" > /tmp/tcws/BRANCH_TESTCASES
      - persist_to_workspace:
          root: /tmp/tcws
          paths: [ BRANCH_TESTCASES ]
      - run:
          # Halting ends the job as a success, so the workspace above has to be
          # written before it or the shell pods get no testcases branch.
          name: Reuse an existing build
          command: |
            [ -f "${BUILD_CACHE_ROOT}/${CIRCLE_SHA1}/debug/${BUILD_SENTINEL}" ] || exit 0
            echo "[debug] ${CIRCLE_SHA1} is already published"
            circleci-agent step halt
      - run:
          name: Check out the source
          no_output_timeout: 30m
          command: |
            set -eo pipefail
            if [ -d "$BUILD_MIRROR/cubrid.git" ]; then
              git clone --quiet --shared --no-checkout "$BUILD_MIRROR/cubrid.git" .
            else
              echo "[warn] no mirror at $BUILD_MIRROR; cloning the full history over the WAN"
              git clone --progress --no-checkout https://github.com/CUBRID/cubrid.git .
            fi
            # Never shallow: the build number counts commits, so a shallow
            # clone would stamp the package 0001.
            git fetch --quiet https://github.com/CUBRID/cubrid.git "$CIRCLE_SHA1"
            git checkout --quiet --detach "$CIRCLE_SHA1"

            git submodule sync
            git submodule init
            # Mirror only where it holds the commit this revision pins; a
            # submodule bumped since the mirror was seeded comes from GitHub.
            while read -r sha path; do
              url=$(git config -f .gitmodules --get "submodule.${path}.url")
              mirror="$BUILD_MIRROR/$(basename "${url%.git}").git"
              git -C "$mirror" cat-file -e "${sha}^{commit}" 2> /dev/null \
                && git config "submodule.${path}.url" "$mirror"
            done < <(git ls-tree HEAD | awk '$2 == "commit" { print $3, $4 }')
            # git 2.38 refuses to clone a submodule from a path without this.
            git -c protocol.file.allow=always submodule update
      - run:
          # From the source root, which is the executor's working_directory:
          # the entrypoint only detects a failed build when it finds build.sh
          # in the current directory.
          name: Build the debug package
          no_output_timeout: 45m
          command: |
            set -eo pipefail
            mkdir -p "$CCACHE_DIR"
            ccache --max-size=5G
            ccache -z
            /entrypoint.sh build -m optdebug
            ccache -s
      - run:
          name: Publish the build to GlusterFS
          no_output_timeout: 30m
          command: |
            set -eo pipefail
            : "${BUILD_CACHE_ROOT:?}" "${BUILD_SENTINEL:?}"
            dir="${BUILD_CACHE_ROOT}/${CIRCLE_SHA1}/debug"
            tmp="${dir}.tmp.${CIRCLE_BUILD_NUM}"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            cp -a /home/CUBRID "$tmp/CUBRID"
            touch "$tmp/${BUILD_SENTINEL}"
            # One rename publishes it, so a consumer never sees a half-copied tree.
            if ! mv -T "$tmp" "$dir"; then
              rm -rf "$tmp"
              # Only a run that published first may be ignored; it left the
              # sentinel. Any other mv failure published nothing, so fail here
              # rather than let test_shell wait for a build that never lands.
              test -f "${dir}/${BUILD_SENTINEL}"
              echo "Another run published this commit first"
            fi
            df -h /home/build-cache
      - collect-build-logs

# Test jobs are gated by expression-based filters (evaluated server-side).
workflows:
  build_test:
    jobs:
      - build
      - build_debug
      - artifact-test:
          name: test_medium
          suite: medium
          requires: [build_debug]
          filters: pipeline.parameters.run_medium_test
      - artifact-test:
          name: test_sql
          suite: sql
          parallelism: 10
          requires: [build_debug]
          filters: pipeline.parameters.run_sql_test
      # Keeps the name: it is the commit status context and what test_shell
      # requires. No requires of its own -- not waiting for the cloud build is
      # where the time goes (CUBRIDQA-1506).
      - build-debug-node:
          name: download-build
          filters: pipeline.parameters.run_shell_test
      - test_shell:
          requires: [download-build]
          filters: pipeline.parameters.run_shell_test
      # develop merge: transport only. Both builds are preserved in GlusterFS for
      # downstream consumers (AI agent service); no test job runs on this path.
      # Requires both builds so a release-only regression still blocks the upload.
      - download-build:
          name: store-build-develop
          for-shell-tests: false
          requires: [build, build_debug]
          filters:
            branches:
              only: develop
