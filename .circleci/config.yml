defaults: &defaults
  working_directory: /home
  docker:
    - image: cubridci/cubridci:develop

version: 2
jobs:
  build:
    <<: *defaults
    environment:
      MAKEFLAGS: -j 8
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Submodules
          command: |
            git submodule sync
            git submodule update --init
      - run:
          name: Build
          command: |
      - run:
          name: Commits
          command: |
            echo "hello"
            echo $PWD
      - persist_to_workspace:
          root: .
          paths:
            - CUBRID
      - store_artifacts:
          path: /tmp/build_logs

workflows:
  version: 2
  build_test:
    jobs:
      - build
