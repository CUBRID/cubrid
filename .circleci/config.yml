version: 2.1
setup: true
orbs:
  continuation: circleci/continuation@1.1.0
# --------------------------------------------------
# Pipeline-level parameters (values passed from GitHub Actions)
# --------------------------------------------------
parameters:
  baseline:
    type: string
    default: ""
  run_shell_test:
    type: boolean
    default: false
  run_sql_test:
    type: boolean
    default: false
  run_medium_test:
    type: boolean
    default: false
  run_plcsql_test:
    type: boolean
    default: false
  run_all_test:
    type: boolean
    default: false

# --------------------------------------------------
# Jobs
# --------------------------------------------------
jobs:
  # Setup job - 동적 구성을 생성하는 유일한 작업
  setup:
    executor: continuation/default
    environment:
      RUN_MEDIUM_TEST: << pipeline.parameters.run_medium_test >>
      RUN_SQL_TEST: << pipeline.parameters.run_sql_test >>
      RUN_PLCSQL_TEST: << pipeline.parameters.run_plcsql_test >>
      RUN_SHELL_TEST: << pipeline.parameters.run_shell_test >>
      RUN_ALL_TEST: << pipeline.parameters.run_all_test >>
      BASELINE: << pipeline.parameters.baseline >>
    steps:
      - checkout
      - run:
          name: Generate continuation config
          command: |
            # 파이프라인 파라미터 디버깅 출력
            echo "Pipeline parameters:"
            echo "RUN_MEDIUM_TEST: $RUN_MEDIUM_TEST"
            echo "RUN_SQL_TEST: $RUN_SQL_TEST"
            echo "RUN_PLCSQL_TEST: $RUN_PLCSQL_TEST"
            echo "RUN_SHELL_TEST: $RUN_SHELL_TEST"
            echo "RUN_ALL_TEST: $RUN_ALL_TEST"
            echo "BASELINE: $BASELINE"
            
            # 테스트 실행 여부 결정
            # run_all_test=true이면 모든 테스트를 활성화
            if [ "$RUN_ALL_TEST" = "true" ]; then
              RUN_MEDIUM="true"
              RUN_SQL="true"
              RUN_PLCSQL="true"
              RUN_SHELL="true"
            else
              # 개별 테스트 파라미터에 따라 설정
              RUN_MEDIUM="$RUN_MEDIUM_TEST"
              RUN_SQL="$RUN_SQL_TEST"
              RUN_PLCSQL="$RUN_PLCSQL_TEST"
              RUN_SHELL="$RUN_SHELL_TEST"
            fi
            
            # 동적 구성 파일(continue.yml) 생성
            cat \<<EOF > .circleci/continue.yml
            # CircleCI 동적 구성 파일 (setup 작업에서 자동 생성됨)
            version: 2.1
            
            # 워크플로우 정의
            workflows:
              build_test:
                jobs:
                  - build
                  - test_medium:
                      requires: [build]
                      when: $RUN_MEDIUM
                  - test_sql:
                      requires: [build]
                      when: $RUN_SQL
                  - test_plcsql:
                      requires: [build]
                      when: $RUN_PLCSQL
                  - test_shell:
                      requires: [build]
                      when: $RUN_SHELL
            
            # 작업 정의
            jobs:
              # 빌드 작업 - CUBRID 소스 코드 컴파일
              build:
                docker:
                  - image: cubridci/cubridci:develop
                working_directory: /home
                resource_class: xlarge
                environment:
                  MAKEFLAGS: -j 8
                steps:
                  - checkout
                  - run:
                      name: Submodules
                      command: |
                        git submodule sync
                        git submodule update --init
                  - run:
                      name: Build
                      command: |
                        scl enable devtoolset-8 -- /entrypoint.sh build
                  - run:
                      name: Store Build Logs
                      command: |
                        mkdir -p /tmp/build_logs
                        mv -f build.log /tmp/build_logs || true
                  - run:
                      name: Store Commits
                      command: |
                        mkdir -p /tmp/build_logs
                        git log | head -n 1000 > commits.log || true
                        mv -f commits.log /tmp/build_logs
                  - store_artifacts:
                      path: /tmp/build_logs
                  - persist_to_workspace:
                      root: .
                      paths:
                        - CUBRID
              
              # 테스트 작업들 - 각 테스트 유형별로 별도 작업 정의
              test_medium:
                docker:
                  - image: cubridci/cubridci:develop
                working_directory: /home
                resource_class: medium
                parallelism: 1
                environment:
                  BASELINE: $BASELINE
                  TEST_SUITE: "medium"
                  GITHUB_TOKEN: $GHI_TOKEN
                steps:
                  - attach_workspace:
                      at: .
                  - run:
                      name: Test
                      shell: /bin/bash
                      no_output_timeout: 20m
                      command: |
                        # Limit core files
                        ulimit -c 1

                        # Check out testcases and testtools (uses custom entrypoint script)
                        /entrypoint.sh checkout
                        
                        # 테스트 설정
                        base_dir="cubrid-testcases"
                        glob_path="$base_dir/$TEST_SUITE/_*/**/*.sql"

                        # 테스트 분할 (병렬 실행)
                        echo "Selecting from all tests..."
                        circleci tests glob $glob_path | sed "s|^$base_dir/||" | circleci tests split | tee tc.list

                        # 불필요한 테스트 제거
                        find $base_dir -name "*.sql" -type f | grep -v -f tc.list | xargs -r rm -rf

                        # 테스트 실행
                        if [ -s tc.list ]; then
                          /entrypoint.sh test
                        else
                          echo "No tests to run"
                          circleci-agent step halt
                        fi
                  - run:
                      name: Collect Logs
                      command: |
                        mkdir -p /tmp/logs
                        cp -f /tmp/tests/* /tmp/logs || true
                        mv -f CUBRID/log /tmp/logs/cubrid_log || true
                        mv -f cubrid-testtools/CTP/sql/log /tmp/logs/ctp_log || true
                        [ -e CUBRID/log/coredump ] && mv -f CUBRID/log/coredump /tmp/logs/coredump || true
                        find /home -name "tc.list" | xargs -I{} mv -f {} /tmp/logs/tc.list || true
                      when: on_fail
                  - store_test_results:
                      path: /tmp/tests
                      when: always
                  - store_artifacts:
                      path: /tmp/logs
                      when: on_fail
                      
              test_sql:
                docker:
                  - image: cubridci/cubridci:develop
                working_directory: /home
                resource_class: medium
                parallelism: 8
                environment:
                  BASELINE: $BASELINE
                  TEST_SUITE: "sql"
                  GITHUB_TOKEN: $GHI_TOKEN
                steps:
                  - attach_workspace:
                      at: .
                  - run:
                      name: Test
                      shell: /bin/bash
                      no_output_timeout: 20m
                      command: |
                        # Limit core files
                        ulimit -c 1

                        # Check out testcases and testtools (uses custom entrypoint script)
                        /entrypoint.sh checkout
                        
                        # 테스트 설정
                        base_dir="cubrid-testcases"
                        rm -rf $base_dir/sql/_05_plcsql $base_dir/sql/_35_fig_cake/plcsql
                        glob_path="$base_dir/$TEST_SUITE/_*/**/*.sql"

                        # 테스트 분할 (병렬 실행)
                        echo "Selecting from all tests..."
                        circleci tests glob $glob_path | sed "s|^$base_dir/||" | circleci tests split | tee tc.list

                        # 불필요한 테스트 제거
                        find $base_dir -name "*.sql" -type f | grep -v -f tc.list | xargs -r rm -rf

                        # 테스트 실행
                        if [ -s tc.list ]; then
                          /entrypoint.sh test
                        else
                          echo "No tests to run"
                          circleci-agent step halt
                        fi
                  - run:
                      name: Collect Logs
                      command: |
                        mkdir -p /tmp/logs
                        cp -f /tmp/tests/* /tmp/logs || true
                        mv -f CUBRID/log /tmp/logs/cubrid_log || true
                        mv -f cubrid-testtools/CTP/sql/log /tmp/logs/ctp_log || true
                        [ -e CUBRID/log/coredump ] && mv -f CUBRID/log/coredump /tmp/logs/coredump || true
                        find /home -name "tc.list" | xargs -I{} mv -f {} /tmp/logs/tc.list || true
                      when: on_fail
                  - store_test_results:
                      path: /tmp/tests
                      when: always
                  - store_artifacts:
                      path: /tmp/logs
                      when: on_fail
                      
              test_plcsql:
                docker:
                  - image: cubridci/cubridci:develop
                working_directory: /home
                resource_class: medium
                parallelism: 1
                environment:
                  BASELINE: $BASELINE
                  TEST_SUITE: "sql"
                  GITHUB_TOKEN: $GHI_TOKEN
                steps:
                  - attach_workspace:
                      at: .
                  - run:
                      name: Test
                      shell: /bin/bash
                      no_output_timeout: 20m
                      command: |
                        # Limit core files
                        ulimit -c 1

                        # Check out testcases and testtools (uses custom entrypoint script)
                        /entrypoint.sh checkout
                        
                        # 테스트 설정
                        base_dir="cubrid-testcases"
                        glob_path="$base_dir/sql/{_05_plcsql,_35_fig_cake/plcsql}/**/*.sql"

                        # 테스트 분할 (병렬 실행)
                        echo "Selecting from all tests..."
                        circleci tests glob $glob_path | sed "s|^$base_dir/||" | circleci tests split | tee tc.list

                        # 불필요한 테스트 제거
                        find $base_dir -name "*.sql" -type f | grep -v -f tc.list | xargs -r rm -rf

                        # 테스트 실행
                        if [ -s tc.list ]; then
                          /entrypoint.sh test
                        else
                          echo "No tests to run"
                          circleci-agent step halt
                        fi
                  - run:
                      name: Collect Logs
                      command: |
                        mkdir -p /tmp/logs
                        cp -f /tmp/tests/* /tmp/logs || true
                        mv -f CUBRID/log /tmp/logs/cubrid_log || true
                        mv -f cubrid-testtools/CTP/sql/log /tmp/logs/ctp_log || true
                        [ -e CUBRID/log/coredump ] && mv -f CUBRID/log/coredump /tmp/logs/coredump || true
                        find /home -name "tc.list" | xargs -I{} mv -f {} /tmp/logs/tc.list || true
                      when: on_fail
                  - store_test_results:
                      path: /tmp/tests
                      when: always
                  - store_artifacts:
                      path: /tmp/logs
                      when: on_fail
                      
              test_shell:
                docker:
                  - image: cubridci/cubridci:test_shell
                working_directory: /home
                resource_class: medium
                parallelism: 30
                environment:
                  BASELINE: $BASELINE
                  TEST_SUITE: "shell"
                  GITHUB_TOKEN: $GHI_TOKEN
                steps:
                  - attach_workspace:
                      at: .
                  - run:
                      name: Test
                      shell: /bin/bash
                      no_output_timeout: 20m
                      command: |
                        # Limit core files
                        ulimit -c 1

                        # Check out testcases and testtools (uses custom entrypoint script)
                        /entrypoint.sh checkout
                        
                        # 테스트 설정
                        base_dir="cubrid-testcases-private-ex"
                        rm -rf $base_dir/$TEST_SUITE/_25_unstable
                        glob_path="$(find $base_dir/$TEST_SUITE/_* -type f -path "*/*/cases/*.sh" | grep -P '/([^/]+)/cases/\1\.sh$')"

                        # 테스트 분할 (병렬 실행)
                        echo "Selecting from all tests..."
                        circleci tests glob $glob_path | sed "s|^$base_dir/||" | circleci tests split | tee tc.list

                        # 불필요한 테스트 제거
                        cat tc.list | xargs -n1 dirname | uniq> tc_dirs.list
                        find $base_dir -name "cases" -type d| grep -v -f tc_dirs.list | xargs -r rm -rf

                        # 테스트 실행
                        if [ -s tc.list ]; then
                          /entrypoint.sh test
                        else
                          echo "No tests to run"
                          circleci-agent step halt
                        fi
                  - run:
                      name: Collect Logs
                      command: |
                        mkdir -p /tmp/logs
                        cp -f /tmp/tests/* /tmp/logs || true
                        mv -f cubrid-testtools/CTP/result/shell/current_runtime_logs /tmp/logs/ctp_log || true
                        [ -e CUBRID/log/coredump ] && mv -f CUBRID/log/coredump /tmp/logs/coredump || true
                        find /home -name "tc.list" | xargs -I{} mv -f {} /tmp/logs/tc.list || true
                      when: on_fail
                  - store_test_results:
                      path: /tmp/tests
                      when: always
                  - store_artifacts:
                      path: /tmp/logs
                      when: on_fail
            
            # 파라미터 정의 (동적 구성에서 필요함)
            parameters:
              run_shell_test:
                type: boolean
                default: $RUN_SHELL
              run_sql_test:
                type: boolean
                default: $RUN_SQL
              run_medium_test:
                type: boolean
                default: $RUN_MEDIUM
              run_plcsql_test:
                type: boolean
                default: $RUN_PLCSQL
              run_all_test:
                type: boolean
                default: $RUN_ALL_TEST
              baseline:
                type: string
                default: "$BASELINE"
            EOF
            
            # 디버깅을 위해 생성된 구성 파일 출력
            echo "Generated continue.yml:"
            cat .circleci/continue.yml
      
      - continuation/continue:
          configuration_path: .circleci/continue.yml

# --------------------------------------------------
# Workflows
# --------------------------------------------------
workflows:
  # setup 워크플로우 - 동적 구성을 생성하기 위한 초기 워크플로우
  setup:
    jobs:
      - setup
