version: 2.1

# --------------------------------------------------
# Pipeline-level parameters (values passed from GitHub Actions)
# --------------------------------------------------
parameters:
  baseline:
    type: string
    default: ""
  run_shell_test:
    type: boolean
    default: true
  run_sql_test:
    type: boolean
    default: true
  run_medium_test:
    type: boolean
    default: true
  run_plcsql_test:
    type: boolean
    default: true
  run_all_test:
    type: boolean
    default: false
# --------------------------------------------------
# 1. Reusable commands
# --------------------------------------------------
commands:
  attach-and-run-tests:
    description: "Attach workspace and run test scripts"
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Prepare Test
          shell: /bin/bash
          # no_output_timeout: 20m
          command: |
            # Limit core files
            ulimit -c 1

            # Check out testcases and testtools (uses custom entrypoint script)
            /entrypoint.sh checkout
            
            case "$TEST_SUITE" in
              none)
                echo "TEST_SUITE is none"
                exit 1
                ;;
              plcsql)
                TEST_SUITE="sql"
                base_dir="cubrid-testcases"
                glob_path="$base_dir/sql/{_05_plcsql,_35_fig_cake/plcsql}/**/*.sql"
                ;;
              sql)
                base_dir="cubrid-testcases"
                rm -rf $base_dir/sql/_05_plcsql $base_dir/sql/_35_fig_cake/plcsql
                glob_path="$base_dir/$TEST_SUITE/_*/**/*.sql"
                ;;
              shell)
                base_dir="cubrid-testcases-private-ex"
                rm -rf $base_dir/$TEST_SUITE/_25_unstable
                glob_path="$base_dir/$TEST_SUITE/_*/**/*.sh"
                ;;
              *)
                base_dir="cubrid-testcases"
                glob_path="$base_dir/$TEST_SUITE/_*/**/*.sql"
                ;;
            esac

            # Run only failed tests
            if [ "${RUN_ALL_TEST}" = "false" ] && [ "${TEST_SUITE}" = "shell" ]; then
              echo "Finding failed tests from previous build..."
              build_info=$(curl -sSL -H "Circle-Token: $CIRCLE_TOKEN" \
                "https://circleci.com/api/v1.1/project/github/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/tree/${CIRCLE_BRANCH}?limit=10")
              PREV_BUILD_NUM=$(echo "$build_info" | jq -r ".[] | select(.workflows.job_name==\"$CIRCLE_JOB\") | .build_num" | sed -n '2p')
              
              if [ -n "$PREV_BUILD_NUM" ]; then
                echo "Previous build number: $PREV_BUILD_NUM"
                curl -sSL -H "Circle-Token: $CIRCLE_TOKEN" \
                "https://circleci.com/api/v1.1/project/github/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${PREV_BUILD_NUM}/artifacts" \
                | jq -r '.[] | select(.path|endswith(".xml")) | .url' > xml_url.list
                
                if [ -s xml_url.list ]; then
                  echo "Previous build has xml files : $(cat xml_url.list)"
                  while read url; do
                    curl -sSL "$url" | xmllint --xpath "//testcase[failure]/@name" - 2>/dev/null | sed -E 's/name="([^"]*)"/\1/g' | xargs -n1 >> prev_fail.list
                  done < xml_url.list
                  
                  if [ -s prev_fail.list ]; then
                    cat prev_fail.list \
                      | circleci tests split --verbose --split-by=timings --timings-type=testname --total-slices "$CIRCLE_NODE_TOTAL" --index "$CIRCLE_NODE_INDEX" \
                      | tee tc.list
                    echo "Running only failed tests: $(wc -l < tc.list) tests"
                  else
                    echo "No failed tests found in previous build"
                    echo "Selecting from all tests..."
                    circleci tests glob $glob_path | sed "s|^$base_dir/||" \
                      | circleci tests split --verbose --split-by=timings --timings-type=testname --total-slices "$CIRCLE_NODE_TOTAL" --index "$CIRCLE_NODE_INDEX" \
                      | tee tc.list
                  fi
                else
                  echo "No xml file url found in previous build"
                  echo "Selecting from all tests..."
                  circleci tests glob $glob_path | sed "s|^$base_dir/||" \
                    | circleci tests split --verbose --split-by=timings --timings-type=testname --total-slices "$CIRCLE_NODE_TOTAL" --index "$CIRCLE_NODE_INDEX" \
                    | tee tc.list
                fi
              else
                echo "No previous build found"
                echo "Selecting from all tests..."
                circleci tests glob $glob_path | sed "s|^$base_dir/||" \
                  | circleci tests split --verbose --split-by=timings --timings-type=testname --total-slices "$CIRCLE_NODE_TOTAL" --index "$CIRCLE_NODE_INDEX" \
                  | tee tc.list
              fi
            else
              echo "Selecting from all tests..."
              circleci tests glob $glob_path | sed "s|^$base_dir/||" \
                | circleci tests split --verbose --split-by=timings --timings-type=testname --total-slices "$CIRCLE_NODE_TOTAL" --index "$CIRCLE_NODE_INDEX" \
                | tee tc.list              
            fi
            
            # Remove tests that are not in the list
            if [ "$TEST_SUITE" = "shell" ]; then
              cat tc.list | xargs -n1 dirname | uniq> tc_dirs.list
              find $base_dir -name "cases" -type d| grep -v -f tc_dirs.list | xargs -r rm -rf
            else
              find $base_dir -name "*.sql" -type f | grep -v -f tc.list | xargs -r rm -rf
            fi

            circleci-agent step halt
            exit 1


            # # Run the tests
            # if [ -s tc.list ]; then
            #   /entrypoint.sh test
            # else
            #   echo "No tests to run"
            #   circleci-agent step halt
            # fi
      - run:
          name: Test
          no_output_timeout: 20m
          command: |
            # Run the tests
            if [ -s tc.list ]; then
              /entrypoint.sh test
            else
              echo "No tests to run"
              circleci-agent step halt
            fi
      - run:
          name: Collect Logs
          command: |
            mkdir -p /tmp/logs
            cp -f /tmp/tests/* /tmp/logs
            if [ "$TEST_SUITE" = "shell" ]; then
              mv -f cubrid-testtools/CTP/result/shell/current_runtime_logs /tmp/logs/ctp_log
            else
              mv -f CUBRID/log /tmp/logs/cubrid_log
              mv -f cubrid-testtools/CTP/sql/log /tmp/logs/ctp_log
            fi
            [ -e CUBRID/log/coredump ] && mv -f CUBRID/log/coredump /tmp/logs/coredump
            # find /home -name "core.*" | xargs -I{} mv -f {} /tmp/logs
          when: on_fail
      - store_test_results:
          path: /tmp/tests
      - store_artifacts:
          path: /tmp/logs

  collect-build-logs:
    description: "Collect build logs and store them"
    steps:
      - run:
          name: Store Build Logs
          command: |
            mkdir -p /tmp/build_logs
            mv -f build.log /tmp/build_logs
      - run:
          name: Store Commits
          command: |
            mkdir -p /tmp/build_logs
            git log | head -n 1000 > commits.log || true
            mv -f commits.log /tmp/build_logs
      - store_artifacts:
          path: /tmp/build_logs

# --------------------------------------------------
# 2. Reusable executors
# --------------------------------------------------
executors:
  cubrid-default:
    docker:
      - image: cubridci/cubridci:develop
    working_directory: /home

  cubrid-test-shell:
    docker:
      # - image: cubridci/cubridci:test_shell
      - image: twkang3219/ctp_image_shell:latest
    working_directory: /home

# --------------------------------------------------
# 3. Jobs
# --------------------------------------------------
jobs:
  build:
    executor: cubrid-default
    resource_class: xlarge
    environment:
      MAKEFLAGS: -j 8
    steps:
      - checkout
      - run:
          name: Submodules
          command: |
            git submodule sync
            git submodule update --init
      - run:
          name: Build
          command: |
            scl enable devtoolset-8 -- /entrypoint.sh build
      - collect-build-logs
      - persist_to_workspace:
          root: .
          paths:
            - CUBRID

  test_job:
    parameters:
      e:
        type: executor
        default: cubrid-default
      test_suite:
        type: string
        default: "none"
      parallel_num:
        type: integer
        default: 1
    executor: << parameters.e >>
    resource_class: large
    parallelism: << parameters.parallel_num >>
    environment:
      BASELINE: << pipeline.parameters.baseline >>
      RUN_SHELL_TEST: << pipeline.parameters.run_shell_test >>
      RUN_SQL_TEST: << pipeline.parameters.run_sql_test >>
      RUN_MEDIUM_TEST: << pipeline.parameters.run_medium_test >>
      RUN_PLCSQL_TEST: << pipeline.parameters.run_plcsql_test >>
      RUN_ALL_TEST: << pipeline.parameters.run_all_test >>
      TEST_SUITE: << parameters.test_suite >>
      GITHUB_TOKEN: $GHI_TOKEN
    steps:
      - run:
          name: Skip tests if not enabled
          command: |
            if [ "${TEST_SUITE}" = "shell" ] && [ "${RUN_SHELL_TEST}" != "true" ]; then
              echo "Skipping shell tests because RUN_SHELL_TEST is false"
              circleci-agent step halt
            elif [ "${TEST_SUITE}" = "sql" ] && [ "${RUN_SQL_TEST}" != "true" ]; then
              echo "Skipping sql tests because RUN_SQL_TEST is false"
              circleci-agent step halt
            elif [ "${TEST_SUITE}" = "medium" ] && [ "${RUN_MEDIUM_TEST}" != "true" ]; then
              echo "Skipping medium tests because RUN_MEDIUM_TEST is false"
              circleci-agent step halt
            elif [ "${TEST_SUITE}" = "plcsql" ] && [ "${RUN_PLCSQL_TEST}" != "true" ]; then
              echo "Skipping plcsql tests because RUN_PLCSQL_TEST is false"
              circleci-agent step halt
            fi
      - attach-and-run-tests

# --------------------------------------------------
# 4. Workflows
# --------------------------------------------------
workflows:
  build_test:
    jobs:
      - build
      - test_job:
          name: test_medium
          requires: 
            - build
          test_suite: "medium"
      - test_job:
          name: test_sql
          requires:
            - build
          test_suite: "sql"
          parallel_num: 8
      - test_job:
          name: test_plcsql
          requires: 
            - build
          test_suite: "plcsql"
      - test_job:
          name: test_shell
          requires: 
            - build
          test_suite: "shell"
          e: cubrid-test-shell
          parallel_num: 30
